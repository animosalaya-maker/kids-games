<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="../i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-en="Questions – Bobo Land" data-tr="Sorular – Bobo Land">أسئلة – بوبو لاند</title>
<meta name="theme-color" content="#1c1838">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<style>
:root{--bg:#1c1838;--card:#2a2452;--ink:#fff7e8;--muted:#cfc6f2;--gold:#ffcd4d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;line-height:1.7}
main{max-width:680px;margin:0 auto;padding:78px 16px 40px}
h1{color:var(--gold);font-size:28px;margin:0 0 14px;text-align:center}
.item{background:var(--card);border-radius:18px;padding:14px 18px;margin-bottom:12px}
.item b{display:block;font-size:18px;margin-bottom:4px}.item p{margin:0;color:var(--muted)}
.empty{text-align:center;color:var(--muted);background:var(--card);border-radius:18px;padding:30px 18px;font-size:18px}
.empty .big{font-size:52px;display:block;margin-bottom:6px}
</style>
</head>
<body>
<main>
  <h1 data-en="❓ Questions" data-tr="❓ Sorular">❓ أسئلة</h1>
  <section id="list">
    <!-- add <div class="item"><b>question</b><p>answer</p></div> entries here -->
    <div class="empty"><span class="big">❓</span><span data-en="Coming soon…" data-tr="Yakında…">قريباً…</span></div>
  </section>
</main>
<script src="../back.js"></script>
<script>BoboBack.init({}); if(document.querySelector('#list .item')) document.querySelector('#list .empty').remove();</script>
</body>
</html>
