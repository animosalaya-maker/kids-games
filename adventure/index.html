<style>
/* Full-screen canvas game. HUD on top, big touch buttons at the bottom corners, menus as overlays. */
:root{
  --night:#1c1838; --night-2:#2a2452; --night-3:#362e68; --wall-face:#2f2858;
  --ink:#fff7e8; --muted:#bdb4e6; --gold:#ffcd4d; --mint:#5fe3b1; --pink:#ff8fb8;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;pointer-events:none;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.hud > *{pointer-events:auto}
.icon-btn{width:46px;height:46px;flex:none;border:0;border-radius:15px;background:rgba(28,24,56,.78);font-size:22px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.hud-mid{flex:1;min-width:0;display:flex;justify-content:center}
.lvl-tag{background:rgba(28,24,56,.7);border-radius:999px;padding:5px 12px;font-family:var(--display);font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chips{display:flex;gap:6px;flex:none;direction:ltr}
.chip{background:rgba(28,24,56,.78);border-radius:999px;padding:6px 10px;font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px}
.chip .off{filter:grayscale(1);opacity:.35}
@media (max-width:420px){ .hud-mid{display:none} .hud{justify-content:space-between} .chip{font-size:15px;padding:5px 8px} }

.ctl{position:fixed;left:0;right:0;bottom:0;z-index:4;direction:ltr;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.ctl .grp{display:flex;gap:12px;align-items:flex-end}
.pad{--s:min(21vw,86px);width:var(--s);height:var(--s);border:0;border-radius:50%;background:rgba(255,247,232,.2);border:3px solid rgba(255,247,232,.45);
  display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.25);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.pad svg{width:46%;height:46%;fill:#fff7e8}
.pad.jump{--s:min(27vw,108px);background:rgba(255,205,77,.42);border-color:rgba(255,224,140,.8)}
.pad.on{transform:translateY(4px) scale(.96);background:rgba(255,247,232,.4);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.pad.jump.on{background:rgba(255,205,77,.7)}
@media (orientation:landscape) and (max-height:500px){ .pad{--s:min(15vh,76px)} .pad.jump{--s:min(20vh,94px)} }

.toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;background:var(--ink);color:var(--night);
  font-family:var(--display);font-weight:800;font-size:18px;padding:8px 18px;border-radius:999px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 8px 20px rgba(0,0,0,.35);animation:pop .25s ease-out;pointer-events:none}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(18,14,40,.84);overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.card{width:100%;max-width:440px;background:var(--night-2);border-radius:28px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
  box-shadow:0 0 0 3px var(--night-3),0 24px 60px rgba(0,0,0,.5)}
.card h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:1.05;margin:0;color:var(--gold);text-shadow:0 4px 0 var(--wall-face)}
.card h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.6;font-size:16px;text-wrap:balance}
#heroCv{width:180px;height:150px}
.big-btn{border:0;border-radius:20px;background:var(--gold);color:#3a2a00;font-family:var(--display);font-weight:800;font-size:24px;
  padding:12px 26px;min-width:200px;box-shadow:0 6px 0 #c48f12}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c48f12}
.ghost-btn{border:0;background:var(--night-3);border-radius:16px;padding:11px 18px;font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--wall-face);text-decoration:none;color:var(--ink);display:inline-block}
.ghost-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wall-face)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.worlds{display:grid;gap:12px;width:100%}
.world{border-radius:20px;padding:10px 10px 12px;display:grid;gap:8px;text-align:start}
.world h3{margin:0;font-family:var(--display);font-weight:800;font-size:21px;display:flex;align-items:center;gap:8px;color:#fff}
.world h3 small{font-family:var(--body);font-size:13px;font-weight:700;opacity:.85;margin-inline-start:auto}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl{border:0;border-radius:16px;background:rgba(255,255,255,.88);color:#2a2452;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.lvl b{font-family:var(--display);font-size:26px;line-height:1.1}
.lvl small{font-size:12px;line-height:1.2;min-height:2.4em;font-weight:700;opacity:.8}
.lvl .st{font-size:13px;letter-spacing:1px}
.lvl:disabled{opacity:.5;cursor:default;background:rgba(255,255,255,.35)}
.lvl:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.stars{font-size:52px;letter-spacing:6px;line-height:1;direction:ltr}
.stars i{font-style:normal;display:inline-block;animation:star .45s ease-out backwards}
.stars i.off{filter:grayscale(1);opacity:.3}
@keyframes star{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.tally{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tally span{background:var(--night);border-radius:16px;padding:8px 14px;font-weight:700;font-size:18px}
.how{list-style:none;margin:0;padding:12px 14px;background:var(--night);border-radius:18px;display:grid;gap:8px;text-align:start;width:100%}
.how li{display:flex;gap:10px;align-items:center;font-size:15px;line-height:1.4}
.how li span:first-child{font-size:24px;width:32px;text-align:center;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

const N = n => window.I18N ? I18N.num(n) : String(n);
const OF = (a, b) => L(N(a) + ' من ' + N(b), a + '/' + b, a + '/' + b);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('adv_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('adv_' + k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- Sound ---------- */
let actx = null, muted = store.get('muted', false);
function ac(){
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; } }
  if(actx && actx.state === 'suspended') actx.resume().catch(()=>{});
  return actx;
}
function tone(freq, dur, type, vol, delay, toFreq){
  if(muted) return; const a = ac(); if(!a) return;
  const t0 = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if(toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
const SFX = {
  jump(){ tone(360,.16,'sine',.1,0,720); }, djump(){ tone(520,.16,'sine',.1,0,1040); },

  star(){ [784,988,1175,1568].forEach((f,i)=>tone(f,.14,'triangle',.13,i*.07)); },
  stomp(){ tone(500,.1,'square',.07,0,160); tone(1200,.12,'triangle',.08,.06); },
  hurt(){ tone(240,.25,'sawtooth',.07,0,110); },
  spring(){ tone(220,.3,'sine',.12,0,880); },
  splash(){ tone(600,.3,'sine',.06,0,90); tone(300,.25,'triangle',.05,.05,80); },
  flag(){ [523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.12,i*.08)); },
  bump(){ tone(140,.07,'square',.06); },
  win(){ [523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.2,'triangle',.14,i*.11)); },

const PH = { G:38, FALL:1.18, MAXF:17, RUN:6.2, AG:70, AA:46, DG:60, DA:24, JUMP:14.6, DJUMP:12.4, CUT:0.5, COY:0.1, BUF:0.13, SPRING:23, W:0.72, H:0.86 };
function solidAt(lv, tx, ty){ if(tx < 0 || tx >= lv.W) return true; if(ty < 0 || ty >= lv.H) return false; const c = lv.g[ty][tx]; return c === '#' || c === '=' || c === 'S'; }
function oneWayAt(lv, tx, ty){ if(tx < 0 || tx >= lv.W || ty < 0 || ty >= lv.H) return false; return lv.g[ty][tx] === '-'; }
function appr(v, t, d){ return v < t ? Math.min(t, v + d) : Math.max(t, v - d); }
function newBody(x, y){ return { x, y, vx:0, vy:0, on:false, coy:0, buf:0, jumping:false, jumps:0, ride:null, face:1 }; }
/* one fixed physics step for Bobo. inp = { dir:-1|0|1, hold:bool (jump held), press:bool (jump pressed this step) } */
function physStep(p, inp, lv, dt, movers){
  const ev = {};
  let cx = 0;
  if(p.ride){ cx = p.ride.dx; p.x += p.ride.dx; p.y = p.ride.y - PH.H; }
  if(inp.dir){ p.vx = appr(p.vx, inp.dir * PH.RUN, (p.on ? PH.AG : PH.AA) * dt); p.face = inp.dir; }
  else p.vx = appr(p.vx, 0, (p.on ? PH.DG : PH.DA) * dt);
  if(inp.press) p.buf = PH.BUF; else if(p.buf > 0) p.buf -= dt;
  if(p.on){ p.coy = PH.COY; p.jumps = 0; } else if(p.coy > 0) p.coy -= dt;
  if(p.buf > 0){
    if(p.coy > 0){ p.vy = -PH.JUMP; p.coy = 0; p.buf = 0; p.jumping = true; p.on = false; p.ride = null; ev.jump = 1; }
    else if(lv.dbl && p.jumps < 1){ p.vy = -PH.DJUMP; p.jumps = 1; p.buf = 0; p.jumping = true; ev.jump = 2; }
  }
  if(p.jumping && !inp.hold && p.vy < 0){ p.vy *= PH.CUT; p.jumping = false; }
  if(p.vy >= 0) p.jumping = false;
  p.vy = Math.min(PH.MAXF, p.vy + PH.G * dt * (p.vy > 0 ? PH.FALL : 1));
  // horizontal move + walls
  const dx = p.vx * dt; p.x += dx;
  const mv = dx + cx;
  if(mv !== 0){
    const y0 = Math.floor(p.y + 0.001), y1 = Math.floor(p.y + PH.H - 0.001);
    const tx = mv > 0 ? Math.floor(p.x + PH.W) : Math.floor(p.x);
    for(let y = y0; y <= y1; y++) if(solidAt(lv, tx, y)){ p.x = mv > 0 ? tx - PH.W : tx + 1; p.vx = 0; ev.wall = 1; break; }
  }
  // vertical move + floors
  const prevB = p.y + PH.H;
  p.y += p.vy * dt;
  p.on = false; p.ride = null;
  const x0 = Math.floor(p.x + 0.001), x1 = Math.floor(p.x + PH.W - 0.001);
  if(p.vy >= 0){
    const b = p.y + PH.H, ty = Math.floor(b);
    let hit = -1, spring = -1;
    for(let x = x0; x <= x1; x++){
      if(solidAt(lv, x, ty) && prevB <= ty + 0.5){ hit = x; if(lv.g[ty] && lv.g[ty][x] === 'S') spring = x; }
      else if(oneWayAt(lv, x, ty) && prevB <= ty + 0.02) hit = hit < 0 ? x : hit;
    }
    if(hit >= 0){
      p.y = ty - PH.H; p.vy = 0; p.on = true;
      if(spring >= 0){ p.vy = -PH.SPRING; p.on = false; p.jumping = false; p.jumps = 0; p.coy = 0; ev.spring = { x:spring, y:ty }; }
    } else if(movers){
      for(const m of movers){
        if(p.x + PH.W > m.x + 0.05 && p.x < m.x + m.w - 0.05 && prevB <= Math.max(m.y, m.y - m.dy) + 0.08 && b >= m.y - 0.02){
          p.y = m.y - PH.H; p.vy = 0; p.on = true; p.ride = m; break;
        }
      }
    }
  } else {
    const ty = Math.floor(p.y);
    for(let x = x0; x <= x1; x++) if(solidAt(lv, x, ty)){ p.y = ty + 1; p.vy = 0; ev.bump = 1; break; }
  }
  // hazards
  const hx0 = Math.floor(p.x + 0.1), hx1 = Math.floor(p.x + PH.W - 0.1), hy0 = Math.floor(p.y + 0.2), hy1 = Math.floor(p.y + PH.H - 0.05);
  for(let y = hy0; y <= hy1; y++) for(let x = hx0; x <= hx1; x++){
    const c = lv.g[y] && lv.g[y][x];
    if(c === '~') ev.water = 1;
    else if(c === '^' && p.y + PH.H > y + 0.45) ev.spike = { x, y };
  }
  if(p.y > lv.H + 1.5) ev.fall = 1;
  return ev;
}
/*ENDPHYS*/

/* parse a map into tiles + things */
function parseLevel(i){
  const src = LEVELS[i], H = src.map.length, Wd = src.map[0].length;
  const lv = { i, w:src.w, H, W:Wd, dbl:src.w >= 1, g:[], honey:[], stars:[], foes:[], flags:[], movers:[], goal:null, start:null, springs:{} };
  const rows = src.map.map(r => r.split(''));
  for(let y = 0; y < H; y++) for(let x = 0; x < Wd; x++){
    const c = rows[y][x];
    const clear = () => { rows[y][x] = '.'; };
    const inWall = src.map[y][x - 1] === '%' || src.map[y][x + 1] === '%';
    if(c === 'o'){ lv.honey.push({ x:x + 0.5, y:y + 0.5, got:false }); rows[y][x] = inWall ? '%' : '.'; }
    else if(c === '*'){ lv.stars.push({ x:x + 0.5, y:y + 0.5, got:false, hidden:rows[y][x - 1] === '%' || rows[y][x + 1] === '%' }); rows[y][x] = (rows[y][x - 1] === '%' || rows[y][x + 1] === '%') ? '%' : '.'; }
    else if(c === 'P'){ lv.start = { x:x + 0.5 - PH.W / 2, y:y + 1 - PH.H }; clear(); }
    else if(c === 'F'){ lv.flags.push({ x:x + 0.5, y:y + 1, on:false, t:0 }); clear(); }
    else if(c === 'G'){ lv.goal = { x:x + 0.5, y:y + 1 }; clear(); }
    else if(c === 'e'){ lv.foes.push({ kind:'walk', x:x + 0.1, y:y + 0.25, w:0.8, h:0.75, vx:-1, alive:true, t:Math.random() * 6 }); clear(); }
    else if(c === 'b'){ lv.foes.push({ kind:'fly', x:x + 0.1, y:y + 0.15, w:0.8, h:0.7, ox:x + 0.1, oy:y + 0.15, vx:-1, alive:true, t:Math.random() * 6 }); clear(); }
    else if(c === 'M'){
      let e = x + 1; while(e < Wd && rows[y][e] !== ']') e++;
      lv.movers.push({ kind:'h', a:x, b:e - 2, x, y, w:3, dx:0, dy:0, t:0, sp:1.9 }); clear(); if(e < Wd) rows[y][e] = '.';
    }
    else if(c === 'V'){
      let t = y - 1; while(t > 0 && rows[t][x] !== '!') t--;
      lv.movers.push({ kind:'v', a:y, b:t, x, y, w:3, dx:0, dy:0, t:0, sp:1.6 }); clear(); rows[t][x] = '.';
    }
    else if(c === ']' || c === '!') { /* handled with its partner */ }
  }
  lv.g = rows;
  // secret walls hide the star inside: '%' that was a star cell stays '%'
  for(const s of lv.stars) if(s.hidden) lv.g[Math.floor(s.y)][Math.floor(s.x)] = '%';
  return lv;
}

/* ---------- Bobo (same monster as Bobo's House, in the kid's wardrobe colour) ---------- */
function drawBobo(c, cx, cy, r, t, look, state, pal){
  c.save(); c.translate(cx, cy);
  const nap = state === 'nap', chase = state === 'chase', tickle = state === 'tickle';
  const sq = nap ? 1 + Math.sin(t * 2) * 0.04 : 1 + Math.sin(t * (chase ? 14 : 8)) * 0.05;
  if(tickle) c.rotate(Math.sin(t * 30) * 0.15);
  // shadow
  c.fillStyle = 'rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(0, r * 0.92, r * 0.78, r * 0.2, 0, 0, Math.PI * 2); c.fill();
  c.scale(1 / sq, sq);
  // feet
  c.fillStyle = pal.belly;
  c.beginPath(); c.ellipse(-r * 0.4, r * 0.78, r * 0.24, r * 0.15, 0, 0, Math.PI * 2); c.ellipse(r * 0.4, r * 0.78, r * 0.24, r * 0.15, 0, 0, Math.PI * 2); c.fill();
  // horns
  c.fillStyle = pal.light;
  for(const s of [-1, 1]){
    c.beginPath(); c.moveTo(s * r * 0.62, -r * 0.45);
    c.quadraticCurveTo(s * r * 0.9, -r * 1.15, s * r * 0.28, -r * 0.82); c.closePath(); c.fill();
  }
  // fluffy body
  c.fillStyle = pal.color; c.beginPath();
  c.arc(0, 0, r * 0.86, 0, Math.PI * 2);
  for(let i = 0; i < 16; i++){
    const a = i / 16 * Math.PI * 2 + Math.sin(t * 3 + i) * 0.03;
    c.moveTo(Math.cos(a) * r * 0.86 + r * 0.2, Math.sin(a) * r * 0.86);
    c.arc(Math.cos(a) * r * 0.86, Math.sin(a) * r * 0.86, r * 0.2, 0, Math.PI * 2);
  }
  c.fill();
  // belly
  c.fillStyle = pal.belly; c.beginPath(); c.ellipse(0, r * 0.32, r * 0.5, r * 0.42, 0, 0, Math.PI * 2); c.fill();
  // cheeks
  c.fillStyle = 'rgba(255,143,184,.75)';
  c.beginPath(); c.ellipse(-r * 0.56, r * 0.08, r * 0.14, r * 0.09, 0, 0, Math.PI * 2); c.ellipse(r * 0.56, r * 0.08, r * 0.14, r * 0.09, 0, 0, Math.PI * 2); c.fill();
  // eyes
  const ex = r * 0.3, ey = -r * 0.22;
  if(nap){
    c.strokeStyle = '#2a1f4f'; c.lineWidth = Math.max(1.5, r * 0.08); c.lineCap = 'round';
    for(const s of [-1, 1]){ c.beginPath(); c.arc(s * ex, ey, r * 0.15, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke(); }
  } else {
    const er = r * (chase ? 0.27 : 0.24);
    for(const s of [-1, 1]){
      c.fillStyle = '#fff'; c.beginPath(); c.arc(s * ex, ey, er, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#2a1f4f'; c.beginPath(); c.arc(s * ex + look.x * er * 0.4, ey + look.y * er * 0.4, er * 0.52, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(s * ex + look.x * er * 0.4 - er * 0.18, ey + look.y * er * 0.4 - er * 0.18, er * 0.17, 0, Math.PI * 2); c.fill();
    }
  }
  // mouth
  c.fillStyle = '#2a1f4f'; c.strokeStyle = '#2a1f4f'; c.lineWidth = Math.max(1.5, r * 0.07); c.lineCap = 'round';
  if(chase || tickle){
    c.beginPath(); c.ellipse(0, r * 0.2, r * 0.2, r * (tickle ? 0.2 : 0.16), 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#ff8fb8'; c.beginPath(); c.ellipse(0, r * 0.28, r * 0.11, r * 0.07, 0, 0, Math.PI * 2); c.fill();
  } else if(nap){
    c.beginPath(); c.ellipse(0, r * 0.2, r * 0.07, r * 0.09, 0, 0, Math.PI * 2); c.fill();
  } else {
    c.beginPath(); c.arc(0, r * 0.08, r * 0.24, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-r * 0.07, r * 0.28, r * 0.1, r * 0.1);
  }
  c.restore();
}

function viewTiles(){ return { w:VW / S, h:VH / S }; }
function camTarget(){
  const v = viewTiles(), p = G.p, lv = G.lv;
  const ctlH = Math.min(VH * 0.22, 130) / S;
  const bottom = lv.H + Math.max(0, ctlH - 2.2);
  let tx = p.x + PH.W / 2 - v.w * 0.42 + p.face * Math.min(1.6, v.w * 0.08);
  tx = Math.max(0, Math.min(lv.W - v.w, tx));
  let ty = p.y - v.h * 0.55;
  const maxY = bottom - v.h, minY = Math.min(maxY, -3);
  ty = Math.max(minY, Math.min(maxY, ty));
  return { x:tx, y:ty };
}
function snapCam(){ const t = camTarget(); G.cam.x = t.x; G.cam.y = t.y; }

function input(){
  const dir = (keys.r || touch.r ? 1 : 0) - (keys.l || touch.l ? 1 : 0);

  return { dir, hold, press };

function burst(x, y, n, colors, sp){ for(let k = 0; k < n; k++){ const a = Math.random() * Math.PI * 2, v = (sp || 4) * (0.4 + Math.random()); G.parts.push({ x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 2, life:0.6 + Math.random() * 0.4, c:colors[k % colors.length], star:Math.random() < 0.4 }); } }

function hurt(fromX){

function update(dt, inp){
  const g = G, lv = g.lv, p = g.p;
  g.t += dt;
  // movers
  for(const m of lv.movers){
    m.t += dt; const k = 0.5 - 0.5 * Math.cos(m.t * m.sp * Math.PI / Math.max(1, Math.abs(m.b - m.a)) * 1.2);
    if(m.kind === 'h'){ const nx = m.a + (m.b - m.a) * k; m.dx = nx - m.x; m.dy = 0; m.x = nx; }
    else { const ny = m.a + (m.b - m.a) * k; m.dy = ny - m.y; m.dx = 0; m.y = ny; }
  }
  if(g.state === 'win'){
    g.winT += dt;
    const ev = physStep(p, { dir:0, hold:false, press:false }, lv, dt, lv.movers);
    if(p.on && g.winT < 2.4){ p.vy = -9; p.on = false; SFX.jump(); burst(p.x + PH.W / 2, p.y, 6, ['#ffcd4d', '#ff8fb8', '#5fe3b1'], 4); }

function drawMover(c, m, w){
  const sx = (m.x - G.cam.x) * S, sy = (m.y - G.cam.y) * S, lk = LOOK[w];
  const col = [['#a0e070', '#6fb04a'], ['#ffd27a', '#e0a04a'], ['#cfeeff', '#8fc6ea'], ['#c9b8ff', '#9a85dd']][w];
  c.fillStyle = col[1]; rr(c, sx, sy, m.w * S, S * 0.55, S * 0.2); c.fill();
  c.fillStyle = col[0]; rr(c, sx, sy, m.w * S, S * 0.4, S * 0.2); c.fill();
  c.fillStyle = 'rgba(255,255,255,.5)'; for(let k = 0; k < 3; k++){ c.beginPath(); c.arc(sx + S * (0.5 + k), sy + S * 0.2, S * 0.07, 0, Math.PI * 2); c.fill(); }
  void lk;
}
function drawPlayer(c){
  const g = G, p = g.p;
  if(g.inv > 0 && Math.floor(g.inv * 12) % 2 === 0 && g.state !== 'win') return;
  const r = S * 0.5, cx = (p.x + PH.W / 2 - g.cam.x) * S, by = (p.y + PH.H - g.cam.y) * S;
  let sq = g.squash; if(!p.on) sq = Math.max(-0.18, Math.min(0.12, -p.vy * 0.012));
  c.save(); c.translate(cx, by); c.scale(1 + sq * 0.6, 1 - sq * 0.6);
  if(!p.on) c.rotate(p.vx * 0.012);
  const state = g.state === 'win' ? 'tickle' : (Math.abs(p.vx) > 3 && p.on ? 'chase' : 'idle');
  const look = { x:p.face * 0.8, y:p.on ? 0 : (p.vy < 0 ? -0.6 : 0.6) };
  drawBobo(c, 0, -r * 0.95, r, g.t, look, state, boboPal());
  if(window.World) World.drawOutfit(c, 0, -r * 0.95, r);
  c.restore();
}
function render(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if(!G){ ctx.fillStyle = '#1c1838'; ctx.fillRect(0, 0, VW, VH); return; }
  const g = G, lv = g.lv, cam = g.cam, t = g.t;
  drawSky(ctx, lv.w, cam);
  const deferred = drawTiles(ctx);
  for(const m of lv.movers) drawMover(ctx, m, lv.w);
  for(const f of lv.flags) drawFlag(ctx, f.x, f.y, f.on, false, t, f.t);
  if(lv.goal) drawFlag(ctx, lv.goal.x, lv.goal.y, true, true, t, 1);
  const inView = (x, y) => x > cam.x - 2 && x < cam.x + VW / S + 2 && y > cam.y - 2 && y < cam.y + VH / S + 2;
  for(const h of lv.honey) if(!h.got && inView(h.x, h.y)) drawHoney(ctx, (h.x - cam.x) * S, (h.y - cam.y) * S, t);
  for(const s of lv.stars) if(!s.got && inView(s.x, s.y)) drawStar(ctx, (s.x - cam.x) * S, (s.y - cam.y) * S, t + s.x, S * 0.42);
  for(const f of lv.foes) if(f.alive && inView(f.x, f.y)) drawFoe(ctx, f, lv.w, t + f.t);
  drawPlayer(ctx);
  drawSecret(ctx, deferred);
  for(const q of g.parts){
    ctx.globalAlpha = Math.max(0, Math.min(1, q.life * 2)); ctx.fillStyle = q.c;
    const qx = (q.x - cam.x) * S, qy = (q.y - cam.y) * S;
    if(q.star){ star5(ctx, qx, qy, S * 0.14, q.life * 6); ctx.fill(); } else { ctx.beginPath(); ctx.arc(qx, qy, S * 0.08, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

/* ---------- Loop ---------- */
const DT = 1 / 60;
function frame(now){
  const dtR = Math.min(0.1, (now - (lastT || now)) / 1000); lastT = now; clock += dtR;
  if(mode === 'play' && G && !dbg.manual){
    acc += dtR; let n = 0;
    while(acc >= DT && n < 6){ update(DT, input()); acc -= DT; n++; if(mode !== 'play') break; }
    if(n >= 6) acc = 0;
  }
  if(G && (mode === 'play' || mode === 'pause' || mode === 'result' || mode === 'fail')) render();
  else drawMenuBg();
  if(heroCv && !heroCv.isConnected) heroCv = null;
  if(heroCv) drawHero();
  requestAnimationFrame(frame);
}
let menuG = null;
function drawMenuBg(){
  // a gentle scrolling forest behind the menus
  if(!menuG){ menuG = { lv:parseLevel(0), cam:{ x:0, y:0 }, t:0, p:newBody(0, 0), parts:[], springAnim:{} }; }
  const saved = G; G = menuG; G.t = clock; G.cam.x = (clock * 1.2) % (G.lv.W - VW / S - 1); G.cam.y = G.lv.H + 1 - VH / S;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawSky(ctx, 0, G.cam); const d = drawTiles(ctx); G.p.x = -99; drawSecret(ctx, d);
  G = saved;
}
let heroCv = null;
function drawHero(){
  const c = heroCv.getContext('2d'), w = heroCv.width, h = heroCv.height;
  c.clearRect(0, 0, w, h);
  const r = h * 0.3, hop = Math.abs(Math.sin(clock * 3)) * h * 0.12;
  drawBobo(c, w / 2, h * 0.58 - hop, r, clock, { x:Math.sin(clock), y:0 }, 'idle', boboPal());
  if(window.World) World.drawOutfit(c, w / 2, h * 0.58 - hop, r);
}

  $('#bMute').onclick = () => { muted = !muted; store.set('muted', muted); $('#bMute').textContent = muted ? '🔇' : '🔊'; SFX.tap(); };
}
function showMap(){
  mode = 'map'; G = null; $('#hud').hidden = true; $('#ctl').hidden = true;
  let html = `<h2>${L('اختار المرحلة', 'Pick a level', 'Bölüm seç')}</h2><div class="worlds">`;
  WORLDS.forEach((w, wi) => {
    const got = best.slice(wi * 3, wi * 3 + 3).reduce((a, b) => a + b, 0);
    html += `<div class="world" style="background:${w.card}"><h3>${w.e} ${w.name}<small>⭐ ${OF(got, 9)}</small></h3><div class="levels">`;
    for(let k = 0; k < 3; k++){
      const i = wi * 3 + k, open = i < unlocked;
      html += `<button class="lvl" data-i="${i}" ${open ? '' : 'disabled'}><b>${open ? N(k + 1) : '🔒'}</b><small>${NAMES[i]}</small><span class="st">${open ? [0, 1, 2].map(s => s < best[i] ? '⭐' : '☆').join('') : ''}</span></button>`;
    }
    html += '</div></div>';
  });
  html += `</div><div class="row"><button class="ghost-btn" id="bBack">${I18N.dir === 'rtl' ? '➡️' : '⬅️'} ${L('رجوع', 'Back', 'Geri')}</button><a class="ghost-btn" href="../">🏠 ${L('الرئيسية', 'Home', 'Ana sayfa')}</a></div>`;
  showOverlay(html);
  document.querySelectorAll('.lvl').forEach(b => b.onclick = () => { SFX.tap(); startLevel(+b.dataset.i); });
  $('#bBack').onclick = () => { SFX.tap(); showMenu(); };
}
function pause(){
  if(mode !== 'play' || !G || G.state !== 'play') return;
  mode = 'pause'; releaseAll();
  showOverlay(`<h2>⏸️ ${L('استراحة', 'Paused', 'Mola')}</h2>
    <button class="big-btn" id="bRes">▶️ ${L('كمّل', 'Keep going', 'Devam et')}</button>
    <div class="row"><button class="ghost-btn" id="bRe">🔄 ${L('من الأول', 'Restart', 'Baştan')}</button><button class="ghost-btn" id="bMap">🗺️ ${L('الخريطة', 'Map', 'Harita')}</button>
    <button class="ghost-btn" id="bSnd">${muted ? '🔇' : '🔊'}</button><a class="ghost-btn" href="../">🏠</a></div>`);
  $('#bRes').onclick = () => { SFX.tap(); resume(); };
  $('#bRe').onclick = () => { SFX.tap(); startLevel(G.i); };
  $('#bMap').onclick = () => { SFX.tap(); showMap(); };
  $('#bSnd').onclick = () => { muted = !muted; store.set('muted', muted); $('#bSnd').textContent = muted ? '🔇' : '🔊'; };
}
function resume(){ hideOverlay(); mode = 'play'; lastT = 0; acc = 0; }
function failLevel(){
  mode = 'fail'; releaseAll(); SFX.lose();
  setTimeout(() => {
    showOverlay(`<h2>${L('أوف! خلصوا القلوب 💔', 'Oops! Out of hearts 💔', 'Eyvah! Kalpler bitti 💔')}</h2>
      <p>${L('ولا يهمّك، جرّب كمان مرة!', 'No worries, try once more!', 'Dert etme, bir daha dene!')}</p>
      <button class="big-btn" id="bTry">🔄 ${L('جرّب كمان مرة', 'Try again', 'Tekrar dene')}</button>
      <div class="row"><button class="ghost-btn" id="bMap">🗺️ ${L('الخريطة', 'Map', 'Harita')}</button></div>`);
    $('#bTry').onclick = () => { SFX.tap(); startLevel(G.i); };
    $('#bMap').onclick = () => { SFX.tap(); showMap(); };
  }, 500);
}
function showResult(){
  mode = 'result'; releaseAll();
  const g = G, i = g.i, stars = g.stars, coins = stars * 3 + Math.floor(g.honey / 10);
  const newBest = stars > best[i];
  best[i] = Math.max(best[i], stars); store.set('stars', best);
  if(i + 2 > unlocked){ unlocked = Math.min(12, i + 2); store.set('unlocked', unlocked); }
  if(window.World){ World.track('win', 'adventure'); if(coins > 0) World.addCoins(coins, L('من مغامرة بوبو', "from Bobo's Adventure", "Bobo'nun Macerası'ndan")); }
  const last = i === 11, newWorld = !last && (i + 1) % 3 === 0;
  const msg = stars === 3 ? L('لقيت كل النجوم! إنت بطل 🏆', 'You found every star! Champion 🏆', 'Bütün yıldızları buldun! Şampiyon 🏆')
            : stars > 0 ? L('في نجوم مخبّايين كمان… دوّر عليهم!', 'More stars are hiding… go find them!', 'Saklı yıldızlar var… onları bul!')
            : L('برافو! جرّب تلاقي النجوم المرة الجاية', 'Well done! Try to find the stars next time', 'Aferin! Bir dahaki sefere yıldızları bul');
  showOverlay(`<h2>${last ? L('خلّصت كل المغامرة! 🎉', 'You finished the whole adventure! 🎉', 'Bütün macerayı bitirdin! 🎉') : L('برافو! 🎉', 'Well done! 🎉', 'Aferin! 🎉')}</h2>
    <div class="stars">${[0, 1, 2].map(k => `<i class="${k < stars ? '' : 'off'}" style="animation-delay:${0.15 + k * 0.25}s">⭐</i>`).join('')}</div>
    <p>${msg}${newBest && best[i] === 3 ? '' : ''}</p>
    <div class="tally"><span>🍯 ${N(g.honey)}</span><span>🪙 +${N(coins)}</span></div>
    ${newWorld ? `<p>${L('فتحت عالم جديد:', 'New world unlocked:', 'Yeni dünya açıldı:')} ${WORLDS[(i + 1) / 3].e} ${WORLDS[(i + 1) / 3].name}</p>` : ''}
    ${last ? '' : `<button class="big-btn" id="bNext">▶️ ${L('المرحلة الجاية', 'Next level', 'Sonraki bölüm')}</button>`}
    <div class="row"><button class="ghost-btn" id="bAgain">🔄 ${L('العب مرة تانية', 'Play again', 'Tekrar oyna')}</button><button class="ghost-btn" id="bMap">🗺️ ${L('الخريطة', 'Map', 'Harita')}</button></div>`);
  if($('#bNext')) $('#bNext').onclick = () => { SFX.tap(); startLevel(i + 1); };
  $('#bAgain').onclick = () => { SFX.tap(); startLevel(i); };
  $('#bMap').onclick = () => { SFX.tap(); showMap(); };
}

/* ---------- Controls: keyboard + multi-touch buttons ---------- */
const KEYMAP = { ArrowLeft:'l', KeyA:'l', ArrowRight:'r', KeyD:'r', ArrowUp:'j', KeyW:'j', Space:'j', KeyZ:'j' };
addEventListener('keydown', e => {
  if(KEYMAP[e.code]){ keys[KEYMAP[e.code]] = true; if(mode === 'play') e.preventDefault(); ac(); }
  else if((e.code === 'Escape' || e.code === 'KeyP') && mode === 'play') pause();
  else if((e.code === 'Escape' || e.code === 'KeyP') && mode === 'pause') resume();
});
addEventListener('keyup', e => { if(KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if(document.hidden){ releaseAll(); pause(); } });
const pads = { l:$('#padL'), r:$('#padR'), j:$('#padJ') };
const ptrs = new Map();
function zoneAt(x, y){
  // forgiving zones: the right part of the screen jumps, the left part steers (split between the two arrows)
  if(x > VW * 0.55) return 'j';
  const a = pads.l.getBoundingClientRect(), b = pads.r.getBoundingClientRect();
  return x < (a.right + b.left) / 2 ? 'l' : 'r';
}
function syncTouch(){
  touch.l = touch.r = touch.j = false;
  for(const z of ptrs.values()) touch[z] = true;
  for(const k in pads) pads[k].classList.toggle('on', touch[k]);
}
function releaseAll(){ ptrs.clear(); keys.l = keys.r = keys.j = false; syncTouch(); }
function onDown(e){
  if(mode !== 'play' || !$('#overlay').hidden) return;
  if(e.target.closest && e.target.closest('.hud')) return;
  ac(); e.preventDefault();
  ptrs.set(e.pointerId, zoneAt(e.clientX, e.clientY)); syncTouch();
}
function onMove(e){ if(!ptrs.has(e.pointerId)) return; const z = zoneAt(e.clientX, e.clientY); if(z !== ptrs.get(e.pointerId)){ ptrs.set(e.pointerId, z); syncTouch(); } }
function onUp(e){ if(ptrs.delete(e.pointerId)) syncTouch(); }
cv.addEventListener('pointerdown', onDown); $('#ctl').addEventListener('pointerdown', onDown);
addEventListener('pointermove', onMove); addEventListener('pointerup', onUp); addEventListener('pointercancel', onUp);
addEventListener('contextmenu', e => e.preventDefault());
$('#ctl').style.pointerEvents = 'auto';
$('#btnPause').onclick = () => { SFX.tap(); pause(); };

/* ---------- Debug / test hook ---------- */
window.__adv = {
  get mode(){ return mode; }, get G(){ return G; }, dbg, PH, LEVELS, start:i => startLevel(i), physStep, parseLevel,
  unlockAll(){ unlocked = 12; store.set('unlocked', 12); },
  step(n, inp){ for(let k = 0; k < n && mode === 'play'; k++) update(DT, inp || { dir:0, hold:false, press:false }); },
  teleport(x, y){ if(!G) return; G.p.x = x + 0.5 - PH.W / 2; G.p.y = y - PH.H; G.p.vx = 0; G.p.vy = 0; G.p.ride = null; snapCam(); }
};

showMenu();
requestAnimationFrame(frame);
})();
</script>
