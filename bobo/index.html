<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta name="claude:viewport-fit-sides" content="cover">

<meta name="theme-color" content="#1c1838">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen game. Status bar on top, the whole house fitted in the middle, a big arrow pad under it. */
:root{
  --night:#1c1838; --night-2:#2a2452; --night-3:#362e68;
  --wall:#4a4082; --wall-top:#6a5fb0; --wall-face:#2f2858;
  --floor-a:#f4ddb2; --floor-b:#ecd2a2;
  --ink:#fff7e8; --muted:#bdb4e6;
  --bobo:#9b6bff; --gold:#ffcd4d; --mint:#5fe3b1; --pink:#ff8fb8; --danger:#ff6b6b;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}

.hud{display:flex;align-items:center;gap:8px}
.icon-btn{width:44px;height:44px;flex:none;border:0;border-radius:14px;background:var(--night-3);font-size:22px;display:grid;place-items:center}
.icon-btn:active{transform:scale(.94)}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.hud-level{font-family:var(--display);font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex:none}
.chip{background:var(--night-3);border-radius:999px;padding:6px 10px;font-weight:700;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}

.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;touch-action:none}
#cv{display:block;border-radius:16px;box-shadow:0 0 0 4px var(--night-2),0 18px 40px rgba(0,0,0,.45)}
.toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--night);
  font-family:var(--display);font-weight:700;font-size:17px;padding:8px 16px;border-radius:999px;white-space:nowrap;
  box-shadow:0 8px 20px rgba(0,0,0,.35);animation:pop .25s ease-out;pointer-events:none;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

.pad{direction:ltr;display:grid;grid-template-columns:repeat(3,66px);grid-template-rows:repeat(2,58px);gap:8px;justify-content:center;flex:none;touch-action:none}
.pad button{border:0;border-radius:18px;background:var(--night-3);box-shadow:0 5px 0 var(--wall-face);font-size:28px;display:grid;place-items:center;touch-action:none}
.pad button.on{transform:translateY(4px);box-shadow:0 1px 0 var(--wall-face);background:var(--wall)}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.pad svg{width:30px;height:30px;fill:var(--ink)}

.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(18,14,40,.82);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.card{width:100%;max-width:420px;background:var(--night-2);border-radius:28px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
  box-shadow:0 0 0 3px var(--night-3),0 24px 60px rgba(0,0,0,.5)}
.card h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;margin:0;color:var(--gold);text-shadow:0 4px 0 var(--wall-face)}
.card h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.6;font-size:16px;text-wrap:balance}
#boboCv{width:170px;height:150px}
.big-btn{border:0;border-radius:20px;background:var(--gold);color:#3a2a00;font-family:var(--display);font-weight:800;font-size:24px;
  padding:12px 26px;min-width:200px;box-shadow:0 6px 0 #c48f12}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c48f12}
.ghost-btn{border:0;background:var(--night-3);border-radius:16px;padding:10px 18px;font-weight:700;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.lvl{border:0;border-radius:18px;background:var(--night-3);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--wall-face)}
.lvl b{font-family:var(--display);font-size:28px;line-height:1}
.lvl small{font-size:12px;color:var(--muted);min-height:2.4em;line-height:1.2}
.lvl .st{font-size:14px;letter-spacing:1px}
.lvl:disabled{opacity:.45;cursor:default}
.how{list-style:none;margin:0;padding:12px 14px;background:var(--night);border-radius:18px;display:grid;gap:8px;text-align:start;width:100%}
.how li{display:flex;gap:10px;align-items:center;font-size:15px;line-height:1.4}
.how li span:first-child{font-size:24px;width:32px;text-align:center;flex:none}
.stars{font-size:48px;letter-spacing:6px;line-height:1}
.stars i{font-style:normal;display:inline-block;animation:star .45s ease-out backwards}
.stars i.off{filter:grayscale(1);opacity:.35}
@keyframes star{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.note{font-size:13px;color:var(--muted)}

@media (max-height:620px){
  .pad{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,48px)}
  .card h1{font-size:36px} #boboCv{width:130px;height:115px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <button class="icon-btn" id="btnHome" aria-label="القائمة">🏠</button>
    <div class="hud-mid">
      <span class="hud-level" id="hudLevel">بيت بوبو</span>
      <span class="hud-sub" id="hudSub">اجمع المفاتيح واهرب</span>
    </div>
    <div class="chips">
      <span class="chip" id="hudKeys">🔑 ٠ من ٣</span>
      <span class="chip" id="hudHearts">❤️❤️❤️</span>
    </div>
    <button class="icon-btn" id="btnSound" aria-label="الصوت">🔊</button>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="خريطة البيت"></canvas>
    <div class="toast" id="toast" hidden></div>
  </main>

  <div class="pad" id="pad">
    <button class="up" data-dir="up" aria-label="فوق"><svg viewBox="0 0 24 24"><path d="M12 4l8 10h-5v6H9v-6H4z"/></svg></button>
    <button class="left" data-dir="left" aria-label="يسار"><svg viewBox="0 0 24 24"><path d="M4 12l10-8v5h6v6h-6v5z"/></svg></button>
    <button class="down" data-dir="down" aria-label="تحت"><svg viewBox="0 0 24 24"><path d="M12 20L4 10h5V4h6v6h5z"/></svg></button>
    <button class="right" data-dir="right" aria-label="يمين"><svg viewBox="0 0 24 24"><path d="M20 12l-10 8v-5H4V9h6V4z"/></svg></button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card" id="card"></div>
</div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('bobo_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('bobo_' + k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- Levels ----------
 # wall   . floor   B box (hide inside)   s sofa  b bed  t plant (blocked)
 P kid start   M monster start   K key   T teddy   E exit door */
const LEVELS = [
  { name:'البيت الصغير', patrol:2.0, chase:3.0, vision:4.5, map:[
    '#############',
    '#P....#...K.#',
    '#.....#.....#',
    '#..B........#',
    '#.....#..B..#',
    '###.###.#####',
    '#.....#.....#',
    '#.K...#..s..#',
    '#.........M.#',
    '#..t..#.....#',
    '#.....#..B..#',
    '##.####.##.##',
    '#.....#.....#',
    '#.B...#..T..#',
    '#...........#',
    '#..K..#.....#',
    '#.....#..B..#',
    '#..b..#.....#',
    '######E######'] },
  { name:'البيت الكبير', patrol:2.3, chase:3.4, vision:5, map:[
    '#############',
    '#P..#.....#K#',
    '#...#..b..#.#',
    '#.B.........#',
    '#...#..B..#.#',
    '##.####.###.#',
    '#.....#.....#',
    '#..s..#..K..#',
    '#...........#',
    '#.B...#..M..#',
    '###.#####.###',
    '#.....#.....#',
    '#..T..#..B..#',
    '#.....#.....#',
    '#.#######.#.#',
    '#.#..K..#.#.#',
    '#...B.......#',
    '#.#..t..#...#',
    '#####E#######'] },
  { name:'بوبو وأخوه بيبو', patrol:2.3, chase:3.3, vision:5, map:[
    '#############',
    '#K....#....K#',
    '#.B...#...B.#',
    '#.....#.....#',
    '##.#######.##',
    '#...........#',
    '#.s..M...t..#',
    '#...........#',
    '###.##.##.###',
    '#.....#.....#',
    '#..B..#..T..#',
    '#...........#',
    '##.###.###.##',
    '#.....#.....#',
    '#..K..#..M..#',
    '#.....#..B..#',
    '#.B.........#',
    '#P....#.....#',
    '######E######'] }
];
const COLS = 13, ROWS = 19;
const BLOCK = new Set(['#','s','b','t']);
const FURN = { s:'🛋️', b:'🛏️', t:'🪴' };
const MONSTERS = [
  { name:'بوبو', color:'#9b6bff', light:'#d2bcff', belly:'#b993ff' },
  { name:'بيبو', color:'#21b8a8', light:'#9ff0e6', belly:'#4fd6c6' }
];
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

/* ---------- Sound ---------- */
let actx = null, muted = store.get('muted', false);
function ac(){
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; } }
  if(actx && actx.state === 'suspended') actx.resume().catch(()=>{});
  return actx;
}
function tone(freq, dur, type, vol, delay, toFreq){
  if(muted) return; const a = ac(); if(!a) return;
  const t0 = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if(toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
const SFX = {
  key(){ tone(880,.12,'triangle',.18); tone(1318,.22,'triangle',.15,.1); },
  teddy(){ [660,880,1100,1320].forEach((f,i)=>tone(f,.14,'sine',.15,i*.08)); },
  spot(){ tone(330,.18,'square',.07,0,200); tone(260,.28,'square',.07,.16,140); },
  tickle(){ for(let i=0;i<8;i++) tone(i%2?900:640,.07,'triangle',.12,i*.06); },
  door(){ [392,523,659,784].forEach((f,i)=>tone(f,.2,'triangle',.14,i*.1)); },
  win(){ [523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.16,i*.12)); },
  lose(){ [440,370,311,262].forEach((f,i)=>tone(f,.25,'sine',.14,i*.15)); },
  bump(){ tone(120,.06,'sine',.08); },
  yawn(){ tone(300,.6,'sine',.05,0,160); }
};
function say(text){
  if(muted) return;
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ar-SA'; u.rate = 0.95; u.pitch = 1.2;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Canvas ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d'), stage = $('#stage');
let T = 24, dpr = 1;
const emojiCache = new Map();
function emo(ch, size){
  const k = ch + '|' + size;
  let c = emojiCache.get(k);
  if(!c){
    c = document.createElement('canvas');
    const s = Math.ceil(size * 1.35 * dpr); c.width = c.height = s;
    const x = c.getContext('2d');
    x.font = (size * dpr) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(ch, s / 2, s / 2 + size * dpr * 0.06);
    emojiCache.set(k, c);
  }
  return c;
}
function drawEmo(ch, cx, cy, size, flip){
  const c = emo(ch, Math.round(size)); const s = c.width / dpr;
  if(flip){ ctx.save(); ctx.translate(cx, cy); ctx.scale(-1, 1); ctx.drawImage(c, -s/2, -s/2, s, s); ctx.restore(); }
  else ctx.drawImage(c, cx - s/2, cy - s/2, s, s);
}
function fit(){
  const r = stage.getBoundingClientRect();
  T = Math.max(8, Math.floor(Math.min(r.width / COLS, r.height / ROWS)));
  dpr = Math.min(2.5, window.devicePixelRatio || 1);
  cv.style.width = (T * COLS) + 'px'; cv.style.height = (T * ROWS) + 'px';
  cv.width = Math.round(T * COLS * dpr); cv.height = Math.round(T * ROWS * dpr);
  emojiCache.clear();
}

/* ---------- Bobo the monster (drawn, not an emoji) ---------- */
function drawBobo(c, cx, cy, r, t, look, state, pal){
  c.save(); c.translate(cx, cy);
  const nap = state === 'nap', chase = state === 'chase', tickle = state === 'tickle';
  const sq = nap ? 1 + Math.sin(t * 2) * 0.04 : 1 + Math.sin(t * (chase ? 14 : 8)) * 0.05;
  if(tickle) c.rotate(Math.sin(t * 30) * 0.15);
  // shadow
  c.fillStyle = 'rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(0, r * 0.92, r * 0.78, r * 0.2, 0, 0, Math.PI * 2); c.fill();
  c.scale(1 / sq, sq);
  // feet
  c.fillStyle = pal.belly;
  c.beginPath(); c.ellipse(-r * 0.4, r * 0.78, r * 0.24, r * 0.15, 0, 0, Math.PI * 2); c.ellipse(r * 0.4, r * 0.78, r * 0.24, r * 0.15, 0, 0, Math.PI * 2); c.fill();
  // horns
  c.fillStyle = pal.light;
  for(const s of [-1, 1]){
    c.beginPath(); c.moveTo(s * r * 0.62, -r * 0.45);
    c.quadraticCurveTo(s * r * 0.9, -r * 1.15, s * r * 0.28, -r * 0.82); c.closePath(); c.fill();
  }
  // fluffy body
  c.fillStyle = pal.color; c.beginPath();
  c.arc(0, 0, r * 0.86, 0, Math.PI * 2);
  for(let i = 0; i < 16; i++){
    const a = i / 16 * Math.PI * 2 + Math.sin(t * 3 + i) * 0.03;
    c.moveTo(Math.cos(a) * r * 0.86 + r * 0.2, Math.sin(a) * r * 0.86);
    c.arc(Math.cos(a) * r * 0.86, Math.sin(a) * r * 0.86, r * 0.2, 0, Math.PI * 2);
  }
  c.fill();
  // belly
  c.fillStyle = pal.belly; c.beginPath(); c.ellipse(0, r * 0.32, r * 0.5, r * 0.42, 0, 0, Math.PI * 2); c.fill();
  // cheeks
  c.fillStyle = 'rgba(255,143,184,.75)';
  c.beginPath(); c.ellipse(-r * 0.56, r * 0.08, r * 0.14, r * 0.09, 0, 0, Math.PI * 2); c.ellipse(r * 0.56, r * 0.08, r * 0.14, r * 0.09, 0, 0, Math.PI * 2); c.fill();
  // eyes
  const ex = r * 0.3, ey = -r * 0.22;
  if(nap){
    c.strokeStyle = '#2a1f4f'; c.lineWidth = Math.max(1.5, r * 0.08); c.lineCap = 'round';
    for(const s of [-1, 1]){ c.beginPath(); c.arc(s * ex, ey, r * 0.15, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke(); }
  } else {
    const er = r * (chase ? 0.27 : 0.24);
    for(const s of [-1, 1]){
      c.fillStyle = '#fff'; c.beginPath(); c.arc(s * ex, ey, er, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#2a1f4f'; c.beginPath(); c.arc(s * ex + look.x * er * 0.4, ey + look.y * er * 0.4, er * 0.52, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(s * ex + look.x * er * 0.4 - er * 0.18, ey + look.y * er * 0.4 - er * 0.18, er * 0.17, 0, Math.PI * 2); c.fill();
    }
  }
  // mouth
  c.fillStyle = '#2a1f4f'; c.strokeStyle = '#2a1f4f'; c.lineWidth = Math.max(1.5, r * 0.07); c.lineCap = 'round';
  if(chase || tickle){
    c.beginPath(); c.ellipse(0, r * 0.2, r * 0.2, r * (tickle ? 0.2 : 0.16), 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#ff8fb8'; c.beginPath(); c.ellipse(0, r * 0.28, r * 0.11, r * 0.07, 0, 0, Math.PI * 2); c.fill();
  } else if(nap){
    c.beginPath(); c.ellipse(0, r * 0.2, r * 0.07, r * 0.09, 0, 0, Math.PI * 2); c.fill();
  } else {
    c.beginPath(); c.arc(0, r * 0.08, r * 0.24, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-r * 0.07, r * 0.28, r * 0.1, r * 0.1);
  }
  c.restore();
}

/* ---------- Game state ---------- */
let G = null, held = null, running = false, paused = true, toastTimer = 0;
let unlocked = store.get('unlocked', 1), best = store.get('best', [0,0,0]);

function ent(x, y, speed){ return { x, y, fx:x, fy:y, tx:x, ty:y, px:x, py:y, p:1, moving:false, speed, face:1 }; }
function startMove(e, dx, dy){ e.fx = e.x; e.fy = e.y; e.tx = e.x + dx; e.ty = e.y + dy; e.p = 0; e.moving = true; if(dx) e.face = dx; }
function stepEnt(e, dt){
  if(!e.moving) return false;
  e.p += e.speed * dt;
  let arrived = false;
  if(e.p >= 1){ e.p = 1; e.x = e.tx; e.y = e.ty; e.moving = false; arrived = true; }
  e.px = e.fx + (e.tx - e.fx) * e.p; e.py = e.fy + (e.ty - e.fy) * e.p;
  return arrived;
}

function loadLevel(i){
  const L = LEVELS[i];
  const grid = L.map.map(r => r.split(''));
  const g = { i, L, grid, keys:[], teddy:null, got:0, gotTeddy:false, hearts:3, caught:0, exit:null, open:false,
              player:null, start:null, monsters:[], t:0, invuln:0, freeze:0, afterFreeze:null, floor:[] };
  for(let y = 0; y < ROWS; y++) for(let x = 0; x < COLS; x++){
    const c = grid[y][x];
    if(c === 'P'){ g.player = ent(x, y, 5); g.start = { x, y }; grid[y][x] = '.'; }
    else if(c === 'M'){ g.monsters.push(makeMonster(x, y, g.monsters.length)); grid[y][x] = '.'; }
    else if(c === 'K'){ g.keys.push({ x, y, got:false }); grid[y][x] = '.'; }
    else if(c === 'T'){ g.teddy = { x, y, got:false }; grid[y][x] = '.'; }
    else if(c === 'E'){ g.exit = { x, y }; }
    if(grid[y][x] === '.' || grid[y][x] === 'B') g.floor.push({ x, y });
  }
  G = g; held = null;
  updateHud();
  toast('اجمع ' + AR(g.keys.length) + ' مفاتيح 🔑 واهرب من الباب!', 2600);
  say('اجمع المفاتيح، واهرب من ' + (g.monsters.length > 1 ? 'بوبو وبيبو' : 'بوبو'));
}
function makeMonster(x, y, idx){
  const m = ent(x, y, 2);
  return Object.assign(m, { idx, home:{ x, y }, pal: MONSTERS[idx % MONSTERS.length], state:'nap', timer: 2.2 + idx * 1.8,
                            path:[], last:null, wasPatrolling:false, look:{ x:0, y:1 } });
}

function inside(x, y){ return x >= 0 && y >= 0 && x < COLS && y < ROWS; }
function canPlayer(x, y){
  if(!inside(x, y)) return false; const c = G.grid[y][x];
  if(c === 'E') return G.open;
  return !BLOCK.has(c);
}
function canMonster(x, y){ if(!inside(x, y)) return false; const c = G.grid[y][x]; return c !== 'E' && !BLOCK.has(c); }

function bfs(from, to){
  if(!canMonster(to.x, to.y)) return [];
  const key = (x, y) => y * COLS + x, prev = new Map(), q = [[from.x, from.y]];
  prev.set(key(from.x, from.y), null);
  while(q.length){
    const [x, y] = q.shift();
    if(x === to.x && y === to.y){
      const path = []; let k = key(x, y);
      while(prev.get(k) !== null){ path.unshift({ x: k % COLS, y: Math.floor(k / COLS) }); k = prev.get(k); }
      return path;
    }
    for(const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = x + dx, ny = y + dy, nk = key(nx, ny);
      if(!prev.has(nk) && canMonster(nx, ny)){ prev.set(nk, key(x, y)); q.push([nx, ny]); }
    }
  }
  return [];
}
function lineClear(ax, ay, bx, by){
  const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d * 4);
  for(let i = 1; i < n; i++){
    const x = Math.round(ax + (bx - ax) * i / n), y = Math.round(ay + (by - ay) * i / n);
    if(G.grid[y][x] === '#') return false;
  }
  return true;
}
function playerTile(){ const p = G.player; return p.moving && p.p > 0.5 ? { x:p.tx, y:p.ty } : { x:p.x, y:p.y }; }
function canSee(m){
  const p = G.player; if(p.hidden) return false;
  if(Math.hypot(m.px - p.px, m.py - p.py) > G.L.vision) return false;
  return lineClear(m.px, m.py, p.px, p.py);
}

function updateMonster(m, dt){
  m.timer -= dt;
  const p = G.player, sees = m.state !== 'nap' && canSee(m);
  if(sees){
    if(m.state !== 'chase'){ m.state = 'chase'; SFX.spot(); toast(m.pal.name + ' شافك! اركض وتخبّى 📦', 1600); }
    m.last = playerTile();
  }
  const dx = p.px - m.px, dy = p.py - m.py, dl = Math.hypot(dx, dy) || 1;
  m.look = m.state === 'chase' ? { x:dx / dl, y:dy / dl } : (m.moving ? { x:(m.tx - m.fx), y:(m.ty - m.fy) } : m.look);
  m.speed = m.state === 'chase' ? G.L.chase : G.L.patrol;

  if(m.state === 'nap'){
    if(m.timer <= 0){ m.state = 'patrol'; m.path = []; m.wasPatrolling = false; }
  } else if(!m.moving){
    if(m.state === 'chase'){
      if(m.x === m.last.x && m.y === m.last.y){ if(!sees){ m.state = 'search'; m.timer = 1.6; } }
      else m.path = bfs(m, m.last);
    } else if(m.state === 'search'){
      if(m.timer <= 0){ m.state = 'patrol'; m.path = []; m.wasPatrolling = false; }
    } else if(m.state === 'patrol' && !m.path.length){
      if(m.wasPatrolling && Math.random() < 0.35){ m.state = 'nap'; m.timer = 2.5 + Math.random() * 2; m.wasPatrolling = false; SFX.yawn(); }
      else {
        let target = null;
        for(let tries = 0; tries < 20 && !target; tries++){
          const f = G.floor[Math.floor(Math.random() * G.floor.length)];
          if(Math.abs(f.x - m.x) + Math.abs(f.y - m.y) > 4) target = f;
        }
        m.path = target ? bfs(m, target) : [];
        m.wasPatrolling = true;
      }
    }
    if((m.state === 'chase' || m.state === 'patrol') && m.path.length){
      const n = m.path.shift(); startMove(m, n.x - m.x, n.y - m.y);
    }
  }
  stepEnt(m, dt);

  // touching
  if(Math.hypot(m.px - p.px, m.py - p.py) < 0.65 && !p.hidden && G.invuln <= 0){
    if(m.state === 'nap'){ m.state = 'chase'; m.last = playerTile(); SFX.spot(); toast('أوبس! صحّيت ' + m.pal.name + ' 😮', 1500); }
    else caught(m);
  }
}

function caught(m){
  G.hearts--; G.caught++; SFX.tickle(); say('هههه، دغدغة!');
  m.state = 'tickle'; G.freeze = 1.3;
  toast('هههه! ' + m.pal.name + ' دغدغك 🤭', 1500);
  updateHud();
  G.afterFreeze = () => {
    if(G.hearts <= 0){ SFX.lose(); showLose(); return; }
    const p = G.player; Object.assign(p, ent(G.start.x, G.start.y, 5));
    G.monsters.forEach((mm, i) => Object.assign(mm, ent(mm.home.x, mm.home.y, 2), { state:'nap', timer:1.8 + i, path:[], last:null, wasPatrolling:false }));
    G.invuln = 1.5;
  };
}

function onPlayerArrive(){
  const p = G.player;
  for(const k of G.keys){
    if(!k.got && k.x === p.x && k.y === p.y){
      k.got = true; G.got++; SFX.key(); updateHud();
      if(G.got === G.keys.length){ G.open = true; SFX.door(); toast('الباب انفتح! اركض لبرّا 🚪', 2200); say('الباب انفتح! اركض'); }
      else toast('لقيت مفتاح! ' + AR(G.got) + ' من ' + AR(G.keys.length) + ' 🔑', 1400);
    }
  }
  if(G.teddy && !G.teddy.got && G.teddy.x === p.x && G.teddy.y === p.y){
    G.teddy.got = true; G.gotTeddy = true; SFX.teddy(); toast('لقيت الدبدوب! نجمة زيادة 🧸', 1600);
  }
  if(G.exit && p.x === G.exit.x && p.y === G.exit.y) winLevel();
}

function update(dt){
  if(!G) return;
  G.t += dt;
  if(G.freeze > 0){
    G.freeze -= dt;
    if(G.freeze <= 0 && G.afterFreeze){ const f = G.afterFreeze; G.afterFreeze = null; f(); }
    return;
  }
  if(G.invuln > 0) G.invuln -= dt;
  const p = G.player;
  if(!p.moving && held){
    const [dx, dy] = DIRS[held], nx = p.x + dx, ny = p.y + dy;
    if(canPlayer(nx, ny)) startMove(p, dx, dy);
    else { if(dx) p.face = dx; if(!p.bumped){ p.bumped = true; if(G.exit && nx === G.exit.x && ny === G.exit.y && !G.open){ toast('الباب مقفول 🔒 لازم كل المفاتيح', 1400); SFX.bump(); } } }
  }
  if(p.moving) p.bumped = false;
  if(stepEnt(p, dt)) onPlayerArrive();
  p.hidden = !p.moving && G.grid[p.y][p.x] === 'B';
  if(paused) return;
  G.monsters.forEach(m => updateMonster(m, dt));
}

/* ---------- Drawing ---------- */
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function draw(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, COLS * T, ROWS * T);
  if(!G) return;
  const g = G, t = g.t;
  // floor + walls
  for(let y = 0; y < ROWS; y++) for(let x = 0; x < COLS; x++){
    const c = g.grid[y][x];
    if(c === '#'){
      ctx.fillStyle = '#4a4082'; ctx.fillRect(x * T, y * T, T, T);
      const below = y + 1 < ROWS ? g.grid[y + 1][x] : '#';
      if(below !== '#'){ ctx.fillStyle = '#2f2858'; ctx.fillRect(x * T, y * T + T * 0.7, T, T * 0.3); }
      ctx.fillStyle = '#6a5fb0'; ctx.fillRect(x * T, y * T, T, Math.max(2, T * 0.12));
    } else {
      ctx.fillStyle = (x + y) % 2 ? '#f4ddb2' : '#ecd2a2'; ctx.fillRect(x * T, y * T, T, T);
      ctx.fillStyle = 'rgba(160,110,60,.12)'; ctx.fillRect(x * T, y * T + T - 1, T, 1);
    }
  }
  // furniture, boxes, door
  for(let y = 0; y < ROWS; y++) for(let x = 0; x < COLS; x++){
    const c = g.grid[y][x], cx = x * T + T / 2, cy = y * T + T / 2;
    if(FURN[c]) drawEmo(FURN[c], cx, cy, T * 0.9);
    else if(c === 'B'){
      ctx.fillStyle = 'rgba(95,227,177,.25)'; rr(x * T + 1, y * T + 1, T - 2, T - 2, T * 0.2); ctx.fill();
      drawEmo('📦', cx, cy, T * 0.82);
    } else if(c === 'E'){
      if(g.open){ ctx.fillStyle = 'rgba(95,227,177,' + (0.45 + Math.sin(t * 6) * 0.25) + ')'; rr(x * T, y * T, T, T, T * 0.2); ctx.fill(); }
      else { ctx.fillStyle = '#e8c9a0'; ctx.fillRect(x * T, y * T, T, T); }
      drawEmo('🚪', cx, cy, T * 0.9);
      if(!g.open) drawEmo('🔒', cx + T * 0.28, cy - T * 0.25, T * 0.42);
    }
  }
  // items
  for(const k of g.keys) if(!k.got) drawEmo('🔑', k.x * T + T / 2, k.y * T + T / 2 + Math.sin(t * 4 + k.x) * T * 0.08, T * 0.78);
  if(g.teddy && !g.teddy.got) drawEmo('🧸', g.teddy.x * T + T / 2, g.teddy.y * T + T / 2 + Math.sin(t * 3) * T * 0.06, T * 0.82);
  // monster sight
  for(const m of g.monsters){
    if(m.state === 'nap' || m.state === 'tickle') continue;
    const cx = m.px * T + T / 2, cy = m.py * T + T / 2, R = g.L.vision * T;
    const grad = ctx.createRadialGradient(cx, cy, T * 0.5, cx, cy, R);
    const col = m.state === 'chase' ? '255,107,107' : '255,214,102';
    grad.addColorStop(0, 'rgba(' + col + ',.28)'); grad.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  }
  // actors sorted by depth
  const p = g.player;
  const actors = g.monsters.map(m => ({ y:m.py, d:() => drawMonster(m, t) }));
  actors.push({ y:p.py, d:() => drawPlayer(p, t) });
  actors.sort((a, b) => a.y - b.y).forEach(a => a.d());
}
function drawPlayer(p, t){
  const cx = p.px * T + T / 2, cy = p.py * T + T / 2;
  if(p.hidden){ drawEmo('👀', cx, cy - T * 0.12, T * 0.5); return; }
  if(G.invuln > 0 && Math.floor(G.t * 10) % 2) return;
  const hop = p.moving ? Math.abs(Math.sin(p.p * Math.PI)) * T * 0.15 : 0;
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(cx, cy + T * 0.4, T * 0.3, T * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  drawEmo('🧒', cx, cy - hop, T * 0.92, p.face > 0);
}
function drawMonster(m, t){
  const cx = m.px * T + T / 2, cy = m.py * T + T / 2 - T * 0.05;
  const bob = m.moving ? Math.abs(Math.sin(t * 12)) * T * 0.06 : 0;
  drawBobo(ctx, cx, cy - bob, T * 0.5, t + m.idx, m.look, m.state, m.pal);
  // bubble
  let txt = null, bg = '#fff7e8', fg = '#1c1838';
  if(m.state === 'chase'){ txt = '!'; bg = '#ff6b6b'; fg = '#fff'; }
  else if(m.state === 'search') txt = '؟';
  else if(m.state === 'nap') txt = 'z' + (Math.floor(t * 2) % 2 ? 'z' : '');
  else if(m.state === 'tickle') txt = 'هههه';
  if(txt){
    ctx.font = '800 ' + Math.round(T * 0.5) + 'px ' + getComputedStyle(document.body).getPropertyValue('--display');
    const w = Math.max(T * 0.6, ctx.measureText(txt).width + T * 0.3), h = T * 0.58;
    const bx = cx - w / 2, by = cy - T * 1.15 + Math.sin(t * 5) * 2;
    ctx.fillStyle = bg; rr(bx, by, w, h, h / 2); ctx.fill();
    ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, cx, by + h / 2 + 1);
  }
}

/* ---------- HUD + toast ---------- */
function updateHud(){
  if(!G) return;
  $('#hudLevel').textContent = 'المرحلة ' + AR(G.i + 1);
  $('#hudSub').textContent = G.L.name;
  $('#hudKeys').textContent = '🔑 ' + AR(G.got) + ' من ' + AR(G.keys.length);
  $('#hudHearts').textContent = '❤️'.repeat(Math.max(0, G.hearts)) + '🤍'.repeat(3 - Math.max(0, G.hearts));
}
function toast(text, ms){
  const el = $('#toast'); el.textContent = text; el.hidden = false;
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, ms || 1500);
}
function setSoundIcon(){ $('#btnSound').textContent = muted ? '🔇' : '🔊'; }

/* ---------- Screens ---------- */
const overlay = $('#overlay'), card = $('#card');
function openOverlay(html){ card.innerHTML = html; overlay.hidden = false; paused = true; held = null; }
function closeOverlay(){ overlay.hidden = true; paused = false; }
function starsHtml(n){ let s = ''; for(let i = 0; i < 3; i++) s += '<i class="' + (i < n ? '' : 'off') + '" style="animation-delay:' + (i * .18) + 's">⭐</i>'; return s; }

function showHome(){
  const lv = LEVELS.map((L, i) => {
    const locked = i + 1 > unlocked, b = best[i] || 0;
    return '<button class="lvl" data-lvl="' + i + '"' + (locked ? ' disabled' : '') + '>' +
      '<b>' + (locked ? '🔒' : AR(i + 1)) + '</b><small>' + L.name + '</small>' +
      '<span class="st">' + '⭐'.repeat(b) + '<span style="opacity:.3">' + '⭐'.repeat(3 - b) + '</span></span></button>';
  }).join('');
  openOverlay(
    '<canvas id="boboCv" width="340" height="300"></canvas>' +
    '<h1>بيت بوبو</h1>' +
    '<p>إنت بالبيت مع بوبو، الوحش البنفسجي النعسان. اجمع المفاتيح واطلع من الباب قبل ما يمسكك ويدغدغك!</p>' +
    '<button class="big-btn" id="btnPlay">العب</button>' +
    '<div class="levels">' + lv + '</div>' +
    '<ul class="how">' +
      '<li><span>🔑</span><span>اجمع كل المفاتيح لينفتح الباب</span></li>' +
      '<li><span>📦</span><span>ادخل جوّا الصندوق لتتخبّى، بوبو ما بيشوفك</span></li>' +
      '<li><span>💤</span><span>لما بوبو نايم مرّ جنبه بهدوء</span></li>' +
      '<li><span>🧸</span><span>الدبدوب بيعطيك نجمة زيادة</span></li>' +
    '</ul>' +
    '<span class="note">حرّك الولد بالأسهم أو اسحب إصبعك عالخريطة</span>' +
    '<a class="ghost-btn" href="../" style="text-decoration:none">⬅ كل الألعاب</a>'
  );
  $('#btnPlay').onclick = () => play(Math.min(unlocked, LEVELS.length) - 1);
  card.querySelectorAll('[data-lvl]').forEach(b => b.onclick = () => play(+b.dataset.lvl));
}
function play(i){ ac(); loadLevel(i); closeOverlay(); }
function winLevel(){
  const stars = 1 + (G.caught === 0 ? 1 : 0) + (G.gotTeddy ? 1 : 0);
  best[G.i] = Math.max(best[G.i] || 0, stars); store.set('best', best);
  if(G.i + 2 > unlocked){ unlocked = Math.min(LEVELS.length, G.i + 2); store.set('unlocked', unlocked); }
  SFX.win(); say('برافو! هربت');
  const last = G.i === LEVELS.length - 1, i = G.i;
  const tips = [];
  if(G.caught > 0) tips.push('اهرب بدون ما ينمسك');
  if(!G.gotTeddy) tips.push('جيب الدبدوب 🧸');
  openOverlay(
    '<div class="stars">' + starsHtml(stars) + '</div>' +
    '<h2>' + (last ? 'إنت بطل! خلصت كل البيوت 🏆' : 'برافو! هربت من البيت 🎉') + '</h2>' +
    (tips.length ? '<p>لتاخد نجوم أكتر: ' + tips.join(' و') + '</p>' : '<p>ثلاث نجوم! ما حدا متلك 😎</p>') +
    '<div class="row">' + (last ? '' : '<button class="big-btn" id="bNext">المرحلة الجاية</button>') + '</div>' +
    '<div class="row"><button class="ghost-btn" id="bAgain">عيدها</button><button class="ghost-btn" id="bHome">القائمة</button></div>'
  );
  if(!last) $('#bNext').onclick = () => play(i + 1);
  $('#bAgain').onclick = () => play(i);
  $('#bHome').onclick = showHome;
}
function showLose(){
  const i = G.i;
  openOverlay(
    '<canvas id="boboCv" width="340" height="300"></canvas>' +
    '<h2>' + G.monsters[0].pal.name + ' مسكك ٣ مرات! 🤭</h2>' +
    '<p>ولا يهمك، تخبّى بالصناديق 📦 لما تشوف الضو الأحمر.</p>' +
    '<button class="big-btn" id="bAgain">جرّب كمان مرة</button>' +
    '<button class="ghost-btn" id="bHome">القائمة</button>'
  );
  $('#bAgain').onclick = () => play(i);
  $('#bHome').onclick = showHome;
}

/* ---------- Input ---------- */
document.querySelectorAll('#pad [data-dir]').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); ac(); try{ b.setPointerCapture(e.pointerId); }catch(_){} held = b.dataset.dir; b.classList.add('on'); });
  const up = () => { if(held === b.dataset.dir) held = null; b.classList.remove('on'); };
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev => b.addEventListener(ev, up));
});
let drag = null;
stage.addEventListener('pointerdown', e => { ac(); drag = { x:e.clientX, y:e.clientY, id:e.pointerId }; try{ stage.setPointerCapture(e.pointerId); }catch(_){} });
stage.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if(Math.hypot(dx, dy) < 16) return;
  held = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  if(Math.hypot(dx, dy) > 60){ drag.x = e.clientX - dx * 0.5; drag.y = e.clientY - dy * 0.5; }
});
const endDrag = e => { if(drag && e.pointerId === drag.id){ drag = null; held = null; } };
['pointerup','pointercancel'].forEach(ev => stage.addEventListener(ev, endDrag));
const KEYS = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right' };
addEventListener('keydown', e => { if(KEYS[e.key]){ e.preventDefault(); ac(); held = KEYS[e.key]; } });
addEventListener('keyup', e => { if(KEYS[e.key] === held) held = null; });
addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if(document.hidden && overlay.hidden) showHome(); });
$('#btnHome').onclick = showHome;
$('#btnSound').onclick = () => { muted = !muted; store.set('muted', muted); setSoundIcon(); if(!muted){ ac(); SFX.key(); } else { try{ speechSynthesis.cancel(); }catch(e){} } };

/* ---------- Loop ---------- */
let last = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  if(!paused) update(dt); else if(G) G.t += dt;
  draw();
  const bc = document.getElementById('boboCv');
  if(bc && !overlay.hidden){
    const c = bc.getContext('2d'); c.clearRect(0, 0, bc.width, bc.height);
    const tt = now / 1000;
    drawBobo(c, bc.width / 2, bc.height * 0.56, bc.height * 0.36, tt, { x:Math.sin(tt * 0.9) * 0.8, y:0.2 }, Math.floor(tt / 4) % 3 === 2 ? 'nap' : 'idle', MONSTERS[0]);
  }
  requestAnimationFrame(frame);
}

function start(){
  if(running) return; running = true;
  setSoundIcon();
  fit();
  if('ResizeObserver' in window) new ResizeObserver(fit).observe(stage); else addEventListener('resize', fit);
  loadLevel(0); showHome();
  requestAnimationFrame(frame);
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    navigator.serviceWorker.register('../sw.js').catch(() => {});
  }
}
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
})();
</script>
