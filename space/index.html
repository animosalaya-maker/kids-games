<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="../i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title data-en="Bobo Space" data-tr="Bobo Uzay">فضاء بوبو</title>
<meta name="description" content="طير بصاروخك الحلو وفرقع الكائنات الزعلانة بفقاعات لامعة، اجمع المصاري والقوى، وتغلّب على الزعيم!" data-en="Fly your cute rocket, pop the grumpy space blobs with sparkly bubbles, grab coins and powers, and beat the boss!" data-tr="Sevimli roketinle uç, huysuz uzay yaratıklarını parlak baloncuklarla patlat, altın ve güç topla, patronu yen!">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bobo Land">
<meta name="theme-color" content="#120d33">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Bobo Space («فضاء بوبو 🚀»): a portrait fixed-formation shooter. Drag anywhere to fly, the rocket fires sparkly bubbles
   by itself; grumpy space blobs fly in along curves, sway in formation and dive; a boss every 5 waves; 15 waves in all. */
:root{
  --night:#120d33; --night-2:#1e1650; --night-3:#2d2370; --ink:#fff7ec; --muted:#c7bdf2; --gold:#ffcd4d; --gold-d:#c48f12;
  --pink:#ff6fae; --mint:#4fe3a6; --sky:#5cc8ff;
  --sa-t:env(safe-area-inset-top,0px); --sa-r:env(safe-area-inset-right,0px); --sa-b:env(safe-area-inset-bottom,0px); --sa-l:env(safe-area-inset-left,0px);
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#sa{position:fixed;visibility:hidden;pointer-events:none;padding:var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l)}

.tbtn{position:fixed;z-index:15;top:calc(10px + var(--sa-t));width:48px;height:48px;border-radius:16px;border:3px solid rgba(255,255,255,.9);
  background:rgba(45,35,112,.85);display:grid;place-items:center;padding:0;box-shadow:0 4px 0 rgba(0,0,0,.35);touch-action:manipulation}
.tbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.tbtn svg{width:26px;height:26px}
#btnMute{right:calc(10px + var(--sa-r))}
#btnPause{right:calc(66px + var(--sa-r))}

.overlay{position:fixed;inset:0;z-index:20;display:flex;overflow-y:auto;touch-action:auto;background:rgba(10,6,34,.35);
  padding-left:max(16px,var(--sa-l));padding-right:max(16px,var(--sa-r));padding-block:calc(70px + var(--sa-t)) calc(16px + var(--sa-b))}
.overlay.dim{background:rgba(10,6,34,.66)}
.card{width:100%;max-width:420px;margin:auto;border-radius:30px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  background:linear-gradient(180deg,rgba(46,34,122,.92),rgba(26,18,74,.94));
  box-shadow:0 0 0 3px rgba(255,255,255,.16),0 0 40px rgba(130,90,255,.35),0 24px 60px rgba(0,0,0,.5);animation:cardIn .3s ease-out}
@keyframes cardIn{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.card h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;margin:0;
  background:linear-gradient(180deg,#fff3b0,#ffcd4d 55%,#ff9d3d);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #5a2e9e) drop-shadow(0 0 18px rgba(255,190,80,.35))}
.card h2{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1;margin:0;color:var(--gold);text-shadow:0 4px 0 #4a2a90}
.card p{margin:0;color:var(--muted);line-height:1.5;font-size:16px;font-weight:700;text-wrap:balance}
.label{font-weight:700;font-size:14px;color:var(--muted)}
.pilots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:330px}
.pilot{aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.25);background-color:#3b2f8a;background-repeat:no-repeat;padding:0;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);transition:transform .12s}
.pilot[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,205,77,.35),0 0 16px rgba(255,205,77,.6);transform:scale(1.07);background-color:#5a47c4}
.big-btn{border:0;border-radius:22px;background:linear-gradient(180deg,#ffe07a,#ffbf2e);color:#4a2800;font-family:var(--display);font-weight:800;font-size:28px;
  padding:10px 34px;min-width:210px;box-shadow:0 6px 0 var(--gold-d),0 10px 24px rgba(255,190,60,.3)}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-d)}
.ghost-btn{border:0;background:rgba(255,255,255,.12);border-radius:18px;padding:10px 20px;font-weight:700;font-size:17px;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.ghost-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.best{font-family:var(--display);font-weight:800;font-size:18px;color:var(--gold)}
.how{list-style:none;margin:0;padding:10px 14px;background:rgba(0,0,0,.22);border-radius:18px;display:grid;gap:6px;text-align:start;width:100%}
.how li{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:700;line-height:1.35}
.how li span:first-child{font-size:22px;width:30px;text-align:center;flex:none}
.stars{display:flex;gap:6px;font-size:54px;line-height:1;direction:ltr}
.stars span{color:rgba(255,255,255,.16);text-shadow:none}
.stars span.on{color:var(--gold);text-shadow:0 0 18px rgba(255,205,77,.7),0 4px 0 #b8781a;animation:starPop .45s cubic-bezier(.3,1.6,.5,1) both}
.stars span.on:nth-child(2){animation-delay:.18s}.stars span.on:nth-child(3){animation-delay:.36s}
@keyframes starPop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.res div{background:rgba(0,0,0,.22);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.res b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;direction:ltr}
.res small{font-size:13px;font-weight:700;color:var(--muted)}
.newbest{background:var(--pink);color:#fff;border-radius:12px;padding:2px 12px;font-weight:800;font-size:15px;animation:starPop .5s .5s both}
@media (max-height:640px){.card{gap:8px;padding:14px}.card h1{font-size:38px}.how{display:none}.stars{font-size:44px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv" aria-label="ساحة اللعب" data-en-aria="Play area" data-tr-aria="Oyun alanı"></canvas>
<div id="sa"></div>
<button class="tbtn" id="btnPause" hidden aria-label="استراحة" data-en-aria="Pause" data-tr-aria="Duraklat"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="2" fill="#fff"/><rect x="14" y="4" width="5" height="16" rx="2" fill="#fff"/></svg></button>
<button class="tbtn" id="btnMute" aria-label="الصوت" data-en-aria="Sound" data-tr-aria="Ses"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path id="muteWave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path id="muteX" d="M16 9l6 6M22 9l-6 6" stroke="#ff6f8f" stroke-width="2.6" stroke-linecap="round" hidden/></svg></button>

<div class="overlay" id="menu">
  <div class="card">
    <h1 data-en="Bobo Space" data-tr="Bobo Uzay">فضاء بوبو</h1>
    <p data-en="Pop the grumpy space blobs and save the stars!" data-tr="Huysuz uzay yaratıklarını patlat, yıldızları kurtar!">فرقع الكائنات الزعلانة وخلّص النجوم!</p>
    <div class="label" data-en="Pick your pilot" data-tr="Pilotunu seç">اختار الطيّار</div>
    <div class="pilots" id="pilots"></div>
    <button class="big-btn" id="btnPlay"><span data-en="Play" data-tr="Oyna">العب</span> 🚀</button>
    <div class="best" id="bestLine"></div>
    <ul class="how">
      <li><span>👆</span><span data-en="Drag to move — the rocket shoots by itself" data-tr="Hareket için sürükle — roket kendi ateş eder">اسحب لتتحرك — الصاروخ بيطلق لحالو</span></li>
      <li><span>🫧</span><span data-en="Catch the bubbles for super powers" data-tr="Süper güçler için baloncukları yakala">التقط الفقاعات لتاخد قوى خارقة</span></li>
      <li><span>💖</span><span data-en="Dodge the pink shots — you have 3 hearts" data-tr="Pembe atışlardan kaç — 3 kalbin var">ابعد عن الطلقات الوردية — معك 3 قلوب</span></li>
    </ul>
  </div>
</div>

<div class="overlay dim" id="pause" hidden>
  <div class="card">
    <h2 data-en="Paused" data-tr="Mola">استراحة</h2>
    <p id="pauseInfo"></p>
    <button class="big-btn" id="btnResume"><span data-en="Resume" data-tr="Devam">كمّل</span> ▶</button>
    <button class="ghost-btn" id="btnRestart" data-en="Start over" data-tr="Baştan başla">ابدأ من جديد</button>
    <button class="exit-btn" id="btnExit" data-en="Exit" data-tr="Çıkış">خروج</button>
  </div>
</div>

<div class="overlay dim" id="end" hidden>
  <div class="card">
    <h2 id="endTitle"></h2>
    <div class="stars" id="endStars"><span>★</span><span>★</span><span>★</span></div>
    <span class="newbest" id="newBest" hidden data-en="New best!" data-tr="Yeni rekor!">رقم قياسي جديد!</span>
    <div class="res">
      <div><b id="rScore">0</b><small data-en="Score" data-tr="Puan">النتيجة</small></div>
      <div><b id="rBest">0</b><small data-en="Best" data-tr="En iyi">الأحسن</small></div>
      <div><b id="rWave">0</b><small data-en="Waves" data-tr="Dalgalar">الموجات</small></div>
      <div><b id="rCoins">0</b><small data-en="Coins" data-tr="Altın">مصاري</small></div>
    </div>
    <div class="row">
      <button class="big-btn" id="btnAgain"><span data-en="Play again" data-tr="Tekrar oyna">العب كمان</span> 🔁</button>
    </div>
    <button class="ghost-btn" id="btnMenu" data-en="Menu" data-tr="Menü">القائمة</button>
  </div>
</div>

<script src="../world.js"></script>
<script src="./game.js"></script>
<script src="../back.js"></script>
<script>BoboBack.init({
  visible: () => { const s = window.__space && window.__space.state; return s === 'menu' || s === 'pause'; },
  onBack: () => { const h = window.__space; if(!h || h.state === 'menu') location.href = '../'; else h.toMenu(); }
});</script>
<script src="../friends.js"></script>
<script src="../invitepop.js"></script>
</body>
</html>
