<!doctype html>

<head>
<meta charset="utf-8">
<script src="../i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title data-en="Two-Player Challenge" data-tr="İki Kişilik Düello">تحدّي الاثنين</title>
<meta name="description" content="ألعاب لاعبين اثنين على نفس الجوال: واحد من تحت وواحد من فوق.">

<link rel="manifest" href="../manifest.webmanifest">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: a grid of bright game tiles (menu), then a full-screen canvas split in two halves (play). */
:root{
  --night:#1c1838; --night-2:#2a2452; --night-3:#362e68; --face:#2f2858; --ink:#fff7e8; --muted:#bdb4e6; --gold:#ffcd4d;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif; --body:"Tajawal",system-ui,sans-serif; color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#menu{height:100%;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.head{max-width:720px;margin:0 auto 16px;display:flex;align-items:center;gap:12px}
.head h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,44px);margin:0;line-height:1;color:var(--gold);text-shadow:0 4px 0 var(--face);flex:1;min-width:0}
.head .back{border-radius:14px;background:var(--night-3);padding:10px 14px;font-weight:700;color:var(--ink);text-decoration:none;flex:none}
.sub{max-width:720px;margin:-6px auto 16px;color:var(--muted);line-height:1.5}
#grid{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (min-width:560px){#grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{aspect-ratio:1;max-width:100%;border:0;border-radius:22px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;
  box-shadow:inset 0 0 0 4px rgba(28,24,56,.85),0 6px 0 var(--face)}
.tile:active{transform:translateY(4px);box-shadow:inset 0 0 0 4px rgba(28,24,56,.85),0 2px 0 var(--face)}
.tile .em{font-size:clamp(34px,11vw,52px);line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.tile .nm{font-family:var(--display);font-weight:800;font-size:clamp(13px,3.6vw,17px);line-height:1.1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);text-align:center}
#play{position:fixed;inset:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#quit{position:absolute;top:50%;right:max(8px,env(safe-area-inset-right,0px));transform:translateY(-50%);width:42px;height:42px;border-radius:14px;border:0;background:rgba(54,46,104,.9);font-size:18px;z-index:3}
#champ{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(18,14,40,.9);padding:16px}
#champ .card{background:var(--night-2);border-radius:28px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:360px;width:100%;box-shadow:0 0 0 3px var(--night-3)}
#champ.flip .card{transform:rotate(180deg)}
#champ .cup{font-size:72px;line-height:1}
#champ h2{font-family:var(--display);font-weight:800;font-size:30px;margin:0}
#champ .sc{font-family:var(--display);font-weight:800;font-size:28px;color:var(--muted)}
.big-btn{border:0;border-radius:20px;background:var(--gold);color:#3a2a00;font-family:var(--display);font-weight:800;font-size:22px;padding:10px 26px;box-shadow:0 6px 0 #c48f12}
.ghost-btn{border:0;background:var(--night-3);border-radius:16px;padding:10px 18px;font-weight:700}
</style>
</head>
<body>
<section id="menu">
  <div class="head"><h1 data-en="Two-Player Challenge" data-tr="İki Kişilik Düello">تحدّي الاثنين</h1><a class="back" href="../" data-en="⬅ All games" data-tr="⬅ Tüm oyunlar">⬅ كل الألعاب</a></div>
  <p class="sub"><span data-en="One player at the bottom, one at the top, on the same phone. Win 3 rounds to get the cup. " data-tr="Bir oyuncu altta, biri üstte, aynı telefonda. 3 tur kazanan kupayı alır. ">لاعب من تحت ولاعب من فوق، على نفس الجوال. اللي بيربح ٣ جولات بياخد الكاس. </span><b id="count"></b></p>
  <div id="grid"></div>
</section>
<section id="play" hidden>
  <canvas id="cv" aria-label="ساحة اللعب" data-en-aria="Play area" data-tr-aria="Oyun alanı"></canvas>
  <button id="quit" aria-label="رجوع للقائمة" data-en-aria="Back to menu" data-tr-aria="Menüye dön">✕</button>
</section>
<div id="champ" hidden><div class="card">
  <div class="cup">🏆</div><h2></h2><div class="sc"></div><div class="coins" style="color:var(--gold);font-weight:700"></div>
  <button class="big-btn" id="again" data-en="Play again" data-tr="Tekrar oyna">مرة كمان</button><button class="ghost-btn" id="toMenu" data-en="All games" data-tr="Tüm oyunlar">كل الألعاب</button>
</div></div>
