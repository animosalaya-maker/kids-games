<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="../../i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title data-en="Toy Castle" data-tr="Oyuncak Kalesi">قلعة الألعاب</title>
<meta name="description" content="خريطة مميزة ثلاثية الأبعاد: قلعة ألعاب كبيرة فيها تحديات وكنز مخبّى." data-en="A premium 3D map: a big toy castle with challenges and hidden treasure." data-tr="Premium 3D harita: meydan okumalar ve gizli hazinelerle dolu büyük bir oyuncak kalesi.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bobo Land">
<meta name="theme-color" content="#2b2350">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icon-192.png">
<link rel="apple-touch-icon" href="../../icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* «قلعة الألعاب» — the first premium map. Always landscape (rotated layer like heist/worlds). */
:root{
  --night:#2b2350; --night-2:#3a2f68; --night-3:#4a3d80; --wall-face:#231c45;
  --ink:#fff7e8; --muted:#d6cdf2; --gold:#ffcd4d; --mint:#5fe3b1; --pink:#ff8fb8; --sun:#ffb070;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif; --body:"Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0;
  --sa-t:env(safe-area-inset-top,0px);--sa-r:env(safe-area-inset-right,0px);--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px);--sw:100vw;--sh:100vh}
#stage.rot{--sa-t:env(safe-area-inset-right,0px);--sa-r:env(safe-area-inset-bottom,0px);--sa-b:env(safe-area-inset-left,0px);--sa-l:env(safe-area-inset-top,0px)}
#saProbe{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;width:var(--sa-l);height:var(--sa-b)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#touch{position:absolute;inset:0;z-index:2;touch-action:none}

.hud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;gap:8px;pointer-events:none;
  padding:calc(8px + var(--sa-t)) max(12px,var(--sa-r)) 0 max(12px,var(--sa-l));direction:ltr}
.hud > *{pointer-events:auto}
.hud-l{display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none}
.hud-l > *{pointer-events:auto}
.hud-row{display:flex;gap:8px}
.icon-btn{width:50px;height:50px;flex:none;border:0;border-radius:16px;background:rgba(43,35,80,.8);font-size:23px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25);position:relative;padding:0}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.icon-btn .badge{position:absolute;bottom:-6px;right:-8px;background:var(--gold);color:#3a2a00;border-radius:999px;font:800 13px/1 var(--display);padding:3px 6px;direction:ltr}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.hud-mid > *{pointer-events:auto}
.chip{background:rgba(43,35,80,.82);border-radius:999px;padding:5px 12px;font-weight:800;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;direction:ltr;font-family:var(--display);line-height:1.2}
.chip.toys{box-shadow:inset 0 0 0 3px var(--gold)}
.chip.timer{font-size:24px;padding:2px 10px 2px 16px;min-width:110px;justify-content:center;box-shadow:inset 0 0 0 3px var(--gold)}
.chip.timer button{border:0;background:rgba(255,255,255,.14);border-radius:50%;width:32px;height:32px;font-size:15px;display:grid;place-items:center;padding:0}
.chip.prev{background:rgba(255,143,184,.92);color:#4a0f2a;font-size:17px}
.chip.prev.low{animation:blink 1s ease-in-out infinite}
.chip.room{font-size:16px;box-shadow:inset 0 0 0 3px var(--mint)}
@keyframes blink{50%{opacity:.55}}
#mini{width:118px;height:118px;flex:none;border-radius:50%;background:rgba(43,35,80,.55);box-shadow:0 0 0 3px rgba(255,247,232,.75),0 4px 0 rgba(0,0,0,.25);pointer-events:none}
.mpbar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;direction:ltr;pointer-events:none}
.chip.ps{box-shadow:inset 0 0 0 3px var(--c);padding:3px 10px 3px 3px;gap:5px;font-size:15px}
.chip.ps img{width:28px;height:28px;border-radius:50%;display:block;background:var(--night);object-fit:cover;object-position:top}
.chip.ps.me{background:rgba(74,63,140,.95)}

.joy{position:absolute;z-index:4;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,247,232,.16);border:3px solid rgba(255,247,232,.45);pointer-events:none;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.joy.on{background:rgba(255,247,232,.24)}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,247,232,.85);box-shadow:0 4px 0 rgba(0,0,0,.25)}
#stage.short .joy{width:110px;height:110px;margin:-55px 0 0 -55px}
.jump{position:absolute;z-index:4;right:max(18px,calc(var(--sa-r) + 8px));bottom:calc(18px + var(--sa-b));--s:min(calc(var(--sh) * .27),112px);width:var(--s);height:var(--s);border-radius:50%;
  border:4px solid #fff7e8;background:#5b8cff;display:grid;place-items:center;font-size:calc(var(--s) * .42);box-shadow:0 7px 0 rgba(0,0,0,.28);touch-action:none;padding:0}
.jump:active,.jump.on{transform:translateY(4px) scale(.96);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.act{position:absolute;z-index:4;right:calc(max(18px,calc(var(--sa-r) + 8px)) + min(calc(var(--sh) * .27),112px) + 14px);bottom:calc(30px + var(--sa-b));--s:min(calc(var(--sh) * .25),104px);width:var(--s);height:var(--s);
  border-radius:50%;border:4px solid #fff7e8;background:var(--ac,#ffcd4d);color:#2a1a00;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 7px 0 rgba(0,0,0,.28),0 0 0 6px rgba(255,255,255,.18);touch-action:none;font-family:var(--display);line-height:1;padding:0;animation:actIn .25s cubic-bezier(.2,1.5,.4,1)}
.act i{font-style:normal;font-size:calc(var(--s) * .36);line-height:1}
.act b{font-weight:800;font-size:calc(var(--s) * .19);margin-top:2px;white-space:nowrap}
.act.pulse{animation:actPulse 1s ease-in-out infinite}
.act:active,.act.on{transform:translateY(4px) scale(.96);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.act.big{right:max(18px,calc(var(--sa-r) + 8px));bottom:calc(18px + var(--sa-b));--s:min(calc(var(--sh) * .34),140px)}
@keyframes actIn{from{transform:scale(.4)}to{transform:scale(1)}}
@keyframes actPulse{50%{box-shadow:0 7px 0 rgba(0,0,0,.28),0 0 0 14px rgba(255,255,255,.28)}}

.guide{position:absolute;z-index:6;left:50%;bottom:calc(14px + var(--sa-b));transform:translateX(-50%);display:flex;align-items:flex-end;gap:6px;pointer-events:none;
  max-width:min(540px,calc(var(--sw) - 340px));animation:gIn .35s cubic-bezier(.2,1.4,.4,1)}
.guide img{width:74px;height:96px;object-fit:contain;object-position:bottom;flex:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.guide p{margin:0 0 18px;background:#fff7e8;color:#2a1f4a;font-family:var(--display);font-weight:800;font-size:18px;line-height:1.3;padding:9px 15px;border-radius:20px;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.guide p::before{content:"";position:absolute;bottom:10px;inset-inline-start:-9px;border:9px solid transparent;border-inline-end-color:#fff7e8;border-inline-start:0}
[dir=rtl] .guide p::before{inset-inline-start:auto;inset-inline-end:-9px;border-inline-end-color:transparent;border-inline-start:9px solid #fff7e8;border-inline-end:0}
.guide.menu{z-index:25;left:auto;right:max(14px,var(--sa-r));transform:none;bottom:calc(10px + var(--sa-b));max-width:min(360px,calc(var(--sw) * .38));animation:gIn2 .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes gIn{from{opacity:0;transform:translateX(-50%) translateY(30px) scale(.8)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes gIn2{from{opacity:0;transform:translateY(30px) scale(.8)}to{opacity:1;transform:none}}
#stage.short .guide img{width:58px;height:76px} #stage.short .guide p{font-size:16px;padding:7px 12px;margin-bottom:12px}
.pop{position:absolute;z-index:7;left:50%;top:34%;transform:translate(-50%,-50%);pointer-events:none;font-family:var(--display);font-weight:800;font-size:36px;color:var(--gold);
  text-shadow:0 4px 0 var(--wall-face),0 0 18px rgba(0,0,0,.35);white-space:nowrap;opacity:0}
.pop.go{animation:popUp 1.2s ease-out}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
.cd{position:absolute;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none;font-family:var(--display);font-weight:800;font-size:120px;line-height:1;color:var(--gold);text-shadow:0 7px 0 var(--wall-face),0 0 30px rgba(0,0,0,.35)}
.cd span{animation:pop2 .35s ease-out}
@keyframes pop2{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.banner{position:absolute;z-index:8;left:50%;top:calc(76px + var(--sa-t));transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--gold);color:#3a2a00;border-radius:22px;
  padding:6px 18px 6px 8px;font-family:var(--display);font-weight:800;font-size:22px;box-shadow:0 6px 0 #c48f12,0 12px 30px rgba(0,0,0,.35);animation:cardIn .35s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
.banner img{width:44px;height:44px;border-radius:14px;object-fit:cover;object-position:top;background:#fff3d6}
.banner button{border:0;border-radius:14px;background:#3a2a00;color:var(--gold);font:800 18px/1 var(--display);padding:9px 14px}
.banner.inv{background:var(--mint);color:#063d2a;box-shadow:0 6px 0 #2a9c74,0 12px 30px rgba(0,0,0,.35)}

.overlay{position:absolute;inset:0;z-index:20;display:flex;background:rgba(30,22,60,.5);overflow-y:auto;
  padding-left:max(16px,var(--sa-l));padding-right:max(16px,var(--sa-r));padding-block:calc(14px + var(--sa-t)) calc(14px + var(--sa-b))}
.overlay.dim{background:rgba(30,22,60,.8)}
.overlay.clear{background:linear-gradient(90deg,rgba(30,22,60,.05),rgba(30,22,60,.5) 55%,rgba(30,22,60,.68))}
[dir=ltr] .overlay.clear{background:linear-gradient(270deg,rgba(30,22,60,.05),rgba(30,22,60,.5) 55%,rgba(30,22,60,.68))}
.card{width:100%;max-width:470px;margin:auto;background:rgba(58,47,104,.95);border-radius:28px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  box-shadow:0 0 0 3px var(--night-3),0 24px 60px rgba(0,0,0,.5);animation:cardIn .3s ease-out}
.card.wide{max-width:900px}
.card.bare{background:none;box-shadow:none;max-width:none;padding:0;animation:none}
@keyframes cardIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card h1{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.1;margin:0;color:var(--gold);text-shadow:0 4px 0 var(--wall-face)}
.card h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;margin:0}
.card p{margin:0;color:var(--muted);line-height:1.5;font-size:16px;text-wrap:balance}
.big-btn{border:0;border-radius:20px;background:var(--gold);color:#3a2a00;font-family:var(--display);font-weight:800;font-size:24px;padding:11px 26px;min-width:190px;box-shadow:0 6px 0 #c48f12}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c48f12}
.big-btn.alt{background:var(--pink);color:#4a0f2a;box-shadow:0 6px 0 #c45a83}
.big-btn.alt:active{box-shadow:0 2px 0 #c45a83}
.big-btn.mint{background:var(--mint);color:#063d2a;box-shadow:0 6px 0 #2a9c74}
.big-btn.mint:active{box-shadow:0 2px 0 #2a9c74}
.big-btn:disabled{opacity:.45;transform:none}
.ghost-btn{border:0;background:var(--night-3);border-radius:16px;padding:11px 18px;font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--wall-face);text-decoration:none;color:var(--ink);display:inline-block}
.ghost-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wall-face)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.tally{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;direction:ltr}
.tally span{background:var(--night);border-radius:16px;padding:7px 14px;font-weight:700;font-size:18px}
.bigstar{font-size:66px;line-height:1;animation:spin .7s ease-out;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.stars{font-size:46px;letter-spacing:4px;direction:ltr;line-height:1}
.stars i{font-style:normal;display:inline-block;animation:spin .6s ease-out backwards}
.stars i.off{filter:grayscale(1) brightness(.6);opacity:.55}
@keyframes spin{from{transform:scale(0) rotate(-200deg)}to{transform:scale(1) rotate(0)}}
.hero-btn{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:20px;background:rgba(58,47,104,.92);padding:4px 14px 4px 4px;box-shadow:0 0 0 3px var(--c,var(--gold)),0 5px 0 rgba(0,0,0,.3);font-family:var(--display);font-weight:800;font-size:18px}
.hero-btn img{width:46px;height:46px;border-radius:14px;object-fit:cover;object-position:top;background:var(--night-3)}
.rothint{display:flex;align-items:center;gap:10px;background:var(--gold);color:#3a2a00;border-radius:18px;padding:6px 16px 6px 12px;font-family:var(--display);font-weight:800;font-size:18px;box-shadow:0 4px 0 #c48f12}
.rothint i{font-style:normal;font-size:30px;line-height:1;display:inline-block;animation:rotphone 2.6s ease-in-out infinite}
@keyframes rotphone{0%,20%{transform:rotate(-90deg)}55%,85%{transform:rotate(-180deg)}100%{transform:rotate(-90deg)}}

/* title menu */
.menu{width:min(560px,100%);margin:auto 0;margin-inline-start:auto;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.menu .top{display:flex;align-items:center;gap:10px}
.menu .logo{font-size:58px;line-height:1;animation:wob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-6px)}}
.menu h1{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;margin:0;color:var(--gold);text-shadow:0 5px 0 var(--wall-face)}
.menu .sub{margin:0;font-weight:700;font-size:17px;color:var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.45)}
.prem{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(#ffe08a,#ffc83a);color:#4a3000;border-radius:999px;padding:4px 14px;font-family:var(--display);font-weight:800;font-size:16px;box-shadow:0 3px 0 #c48f12}
.menu .mine{display:flex;gap:8px;direction:ltr;flex-wrap:wrap;justify-content:center}
.menu .mine span{background:rgba(43,35,80,.85);border-radius:999px;padding:5px 14px;font-weight:800;font-family:var(--display);font-size:18px}
#stage.short .menu{gap:8px} #stage.short .menu .logo{font-size:46px} #stage.short .menu h1{font-size:38px}
#stage.short .big-btn{font-size:20px;padding:8px 20px;min-width:150px} #stage.short .ghost-btn{padding:8px 14px;font-size:16px}
#stage.short .card{gap:8px;padding:12px 16px} #stage.short .card h2{font-size:24px} #stage.short .bigstar{font-size:46px} #stage.short .stars{font-size:36px}
/* hero picker */
.heroes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;width:100%}
.hero{border:0;border-radius:20px;background:var(--night);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 0 0 3px var(--night-3),0 5px 0 rgba(0,0,0,.3);transition:transform .15s}
.hero img{width:100%;aspect-ratio:3/4;object-fit:contain;object-position:bottom;display:block;border-radius:14px;background:radial-gradient(circle at 50% 70%,var(--c),transparent 70%)}
.hero b{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.15}
.hero.on{background:#5a4b9c;box-shadow:0 0 0 4px var(--gold),0 5px 0 rgba(0,0,0,.3);transform:translateY(-5px)}
.hero.on b{color:var(--gold)}
/* stations list */
.st-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;width:100%}
.st{display:flex;align-items:center;gap:10px;background:var(--night);border-radius:20px;padding:8px 10px;text-align:start;box-shadow:inset 0 0 0 3px var(--night-3)}
.st.done{box-shadow:inset 0 0 0 3px var(--mint)}
.st .ic{font-size:36px;flex:none;line-height:1}
.st .tx{flex:1;min-width:0}
.st .tx b{display:block;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.2}
.st .tx small{display:block;color:var(--muted);font-weight:700;font-size:14px}
.st .ok{font-size:24px;flex:none}
.st .go{border:0;border-radius:14px;background:var(--gold);color:#3a2a00;font:800 16px/1 var(--display);padding:9px 10px;box-shadow:0 4px 0 #c48f12;flex:none}
.st .go:active{transform:translateY(3px);box-shadow:0 1px 0 #c48f12}
.outfits{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.of{border:0;border-radius:16px;background:var(--night);padding:8px 14px;font:800 17px/1.2 var(--display);box-shadow:inset 0 0 0 3px var(--night-3)}
.of.on{box-shadow:inset 0 0 0 3px var(--gold);background:#5a4b9c}
.of:disabled{opacity:.45}
.lock-art{width:min(300px,60vw);aspect-ratio:16/9;border-radius:22px;overflow:hidden;box-shadow:0 0 0 4px var(--gold),0 8px 0 rgba(0,0,0,.3);position:relative;background:#f4a774}
.lock-art img{width:100%;height:100%;object-fit:cover;display:block}
.lock-art .tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--pink);color:#4a0f2a;border-radius:999px;padding:3px 12px;font:800 15px/1.2 var(--display)}
.price{display:inline-flex;align-items:center;gap:6px;background:var(--night);border-radius:999px;padding:5px 14px;font:800 20px/1.2 var(--display);color:var(--gold);direction:ltr}
/* online */
.mp-code{display:flex;gap:8px;direction:ltr;justify-content:center;align-items:center}
.mp-code b{width:54px;height:66px;border-radius:16px;background:var(--night);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--gold);box-shadow:inset 0 0 0 3px var(--night-3),0 4px 0 rgba(0,0,0,.3)}
.mp-code b.cur{box-shadow:inset 0 0 0 3px var(--gold),0 4px 0 rgba(0,0,0,.3)}
.mp-cols{display:flex;gap:18px;width:100%;align-items:center;justify-content:center;flex-wrap:wrap}
.mp-col{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1 1 250px;min-width:0}
.mp-msg{min-height:1.4em;font-weight:700;color:var(--pink)!important}
.keypad{display:grid;grid-template-columns:repeat(3,68px);gap:8px;direction:ltr;flex:none}
.keypad button{height:56px;border:0;border-radius:16px;background:var(--night-3);font-family:var(--display);font-weight:800;font-size:30px;line-height:1;box-shadow:0 4px 0 var(--wall-face)}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wall-face)}
.keypad .ok{background:var(--mint);color:#063d2a;box-shadow:0 4px 0 #2a9c74}
.spin{display:inline-block;animation:spinL 1.2s linear infinite}

const PMAX = 400, parts = [], pMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.1, 0), new THREE.MeshBasicMaterial({ fog:false }), PMAX);
pMesh.frustumCulled = false; scene.add(pMesh);

function burst(x, y, z, n, colors, speed = 4, size = 1, grav = 12, life = .6){

    const p = parts[pNext], i = pNext; pNext = (pNext + 1) % PMAX;

   ====================================================================== */

  } else if(look.id == null){ look.id = e.pointerId; look.x = p.x; look.y = p.y; }
  try{ touch.setPointerCapture(e.pointerId); }catch(err){}
});
function moveJoy(x, y){
  let dx = x - joy.ox, dy = y - joy.oy; const d = Math.hypot(dx, dy), m = 52;
  if(d > m){ dx *= m / d; dy *= m / d; }

}

const cam = { yaw:0, pitch:.42, dist:8.5, tx:0, ty:0, tz:0 };

let walkOverride = null;
function readInput(dt){
  if(walkOverride){ walkOverride.t -= dt; inp.x = walkOverride.x; inp.z = walkOverride.z; inp.m = 1; inp.sx = walkOverride.sx || 0; if(walkOverride.t <= 0) walkOverride = null; return; }
  let ix = joy.x + (keys.r ? 1 : 0) - (keys.l ? 1 : 0), iy = joy.y + (keys.b ? 1 : 0) - (keys.f ? 1 : 0);
  let m = Math.hypot(ix, iy); if(m > 1){ ix /= m; iy /= m; m = 1; } if(m < .12){ ix = iy = 0; m = 0; }
  if(keys.cl) cam.yaw += 2.2 * dt; if(keys.cr) cam.yaw -= 2.2 * dt;
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  inp.x = rx * ix - fx * iy; inp.z = rz * ix - fz * iy; inp.m = m; inp.sx = ix;
}

/* ======================================================================
   Player movement (walk + jump + bounce), boat, zipline
   ====================================================================== */
let landedOn = null;
function stepWalk(dt){
  const frozen = run && T < run.cdEnd;
  const sp = SPEED;
  P.vx += ((frozen ? 0 : inp.x * sp) - P.vx) * Math.min(1, (P.ground ? 14 : 5) * dt); P.vz += ((frozen ? 0 : inp.z * sp) - P.vz) * Math.min(1, (P.ground ? 14 : 5) * dt);
  P.x += P.vx * dt; P.z += P.vz * dt; pushOut(P);
  if(jumpQ > 0){ jumpQ -= dt; if(P.ground && !frozen){ P.vy = JUMP_V; P.ground = false; jumpQ = 0; P.sq = -.18; SFX.jump(); } }
  P.vy -= GRAV * dt; P.y += P.vy * dt;
  const f = floorAt(P.x, P.y, P.z);
  landedOn = null;
  if(P.y <= f){ const was = P.ground; P.y = f; if(!was && P.vy < -6) P.sq = .22; P.vy = 0; P.ground = true; landedOn = floorSolid; }
  else if(P.ground && P.y - f < .5 && P.vy <= 0){ P.y = f; P.vy = 0; landedOn = floorSolid; }
  else P.ground = false;
  if(landedOn && landedOn.bounce){ P.vy = BOUNCE_V; P.ground = false; P.sq = -.25; SFX.boing(); burst(P.x, P.y + .3, P.z, 6, ['#ffffff', '#5fe3b1'], 3); }
  if(P.y < -3){ respawnSafe(); }
  if(inp.m > 0 && !frozen) P.face += angDiff(Math.atan2(inp.x, inp.z), P.face) * Math.min(1, 12 * dt);
  P.move = Math.min(1, Math.hypot(P.vx, P.vz) / SPEED);
}
function respawnSafe(){ tp(SPOTS.spawn.x, 0, SPOTS.spawn.z); }
function tp(x, y, z, face){ P.x = x; P.z = z; P.y = y == null ? floorAt(x, groundAt(x, z) + 1.2, z) : y; P.vx = P.vz = P.vy = 0; P.ground = true; if(face != null) P.face = face; snapCam = true; }

let run = null;              // { id, t0, cdEnd, cp, got, rid, race }
const hudTimer = $('#hudTimer');
function startRun(id, o = {}){
  if(run) endRun(false, true);
  const cd = o.cd != null ? o.cd : 0;
  run = { id, t0:T + cd, cdEnd:T + cd, cp:0, got:new Set(), rid:o.rid || null, race:!!o.rid };
  if(id === 'tower'){ const s = W.checkpoints[0]; tp(STN.tower.x, null, STN.tower.z, Math.atan2(s.x - STN.tower.x, s.z - STN.tower.z)); cam.yaw = P.face + Math.PI; say(LINE.towerGo, 3200); }
  if(id === 'bounce'){ tp(STN.bounce.x, null, STN.bounce.z, Math.atan2(PARK.x - STN.bounce.x, PARK.z - STN.bounce.z)); cam.yaw = P.face + Math.PI; bStars.forEach(m => m.visible = true); say(LINE.bounceGo, 3200); }
  if(id === 'boat'){ startBoat(); say(LINE.boatGo, 3200); }
  hudTimer.hidden = false;
  if(cd <= 0){ popText(L('يلّا!', 'Go!', 'Başla!')); SFX.go(); }
  if(o.send && mpOthers() > 0){ const rid = run.rid = mpNewId(); run.race = true; mpSend('race', { rid, k:id }); }
  updateTimer(true);
}
function endRun(ok, quiet){
  if(!run) return;
  const r = run; run = null; hudTimer.hidden = true; $('#cd').hidden = true;
  if(r.id === 'boat') stopBoat();
  if(r.id === 'bounce') bStars.forEach(m => m.visible = true);
  if(!quiet && !ok){ SFX.fail(); }
  return r;
}
function runTime(){ return run ? Math.max(0, T - run.t0) : 0; }
let lastTimer = '';
function updateTimer(force){
  if(!run) return;
  let txt;
  if(run.id === 'bounce') txt = '⭐ ' + N(run.got.size) + '/' + N(W.bounceStars.length) + '  ⏳ ' + fmtSec(60 - runTime());
  else if(run.id === 'boat') txt = '🚤 ' + N(Math.min(2, Math.floor((P.boat ? P.boat.prog : 0) / (Math.PI * 2)) + 1)) + '/' + N(2) + '  ⏱️ ' + fmtSec(runTime());
  else txt = '⏱️ ' + fmtSec(runTime());
  if(force || txt !== lastTimer){ lastTimer = txt; $('#timerT').textContent = txt; }
  const cd = run.cdEnd - T, el = $('#cd');
  if(cd > 0){ const n = Math.ceil(cd); if(el.dataset.n !== String(n)){ el.dataset.n = String(n); el.hidden = false; el.innerHTML = `<span>${N(n)}</span>`; tone(520, .1, 'square', .06); } }
  else if(!el.hidden && el.dataset.n !== 'go'){ el.dataset.n = 'go'; el.innerHTML = `<span>${L('يلّا!', 'Go!', 'Başla!')}</span>`; SFX.go(); setTimeout(() => { if(el.dataset.n === 'go') el.hidden = true; }, 700); }
}

/* tower */
function towerStep(){
  if(!run || run.id !== 'tower' || T < run.cdEnd) return;
  const cps = W.checkpoints;
  if(landedOn && landedOn.plat != null){ const nx = cps[run.cp + 1]; if(nx && !nx.top && landedOn.plat >= nx.i){ run.cp++; SFX.cp(); burst(P.x, P.y + 1, P.z, 16, ['#ffcd4d', '#ffffff'], 4); popText('🚩 ' + L('نقطة حفظ!', 'Checkpoint!', 'Kontrol noktası!')); } }
  if(P.ground && P.y > KEEP.top - .2 && Math.hypot(P.x - KEEP.x, P.z - KEEP.z) < KEEP.r + .6){ finishStation('tower', runTime()); return; }
  if(P.ground && P.y < .5 && runTime() > .6){
    if(run.cp > 0){ const c = cps[run.cp]; tp(c.x, c.y, c.z); popText('😅 ' + L('رجعنا للعلم', 'Back to the flag', 'Bayrağa dönüldü')); SFX.bonk(); }
    else if(Math.hypot(P.x - KEEP.x, P.z - KEEP.z) > 18){ endRun(false); say(LINE.leftRun); }
  }
}
/* bounce */
function bounceStep(){

/* boat: the boat goes round the moat by itself, the joystick steers in and out; 2 laps */
function startBoat(){
  const a = BOAT_A0; P.mode = 'boat'; P.boat = { a, r:MOAT_MID, v:0, boost:0, prog:0, slow:0 }; myBoat.visible = true;
  RINGS.forEach(r => r.t = -9);
  const [x, z] = polar(a, MOAT_MID); P.x = x; P.z = z; P.y = WATER_Y + .55; cam.yaw = Math.atan2(-Math.cos(a), Math.sin(a)); cam.pitch = .32; snapCam = true;
}
function stopBoat(){ P.mode = 'walk'; P.boat = null; myBoat.visible = false; tp(STN.boat.x, null, STN.boat.z, BOAT_A0); }
function boatStep(dt){
  const B = P.boat; if(!B) return;
  const go = !run || T >= run.cdEnd;
  const target = !go ? 0 : B.boost > T ? 16 : B.slow > T ? 4 : 10.5;
  B.v += (target - B.v) * Math.min(1, (target > B.v ? 1.6 : 4) * dt);
  B.r = clamp(B.r + (inp.sx || 0) * 6 * dt, MOAT_IN + 1.3, MOAT_OUT - 1.3);
  const da = B.v * dt / B.r; B.a += da; B.prog += da;
  const [x, z] = polar(B.a, B.r); P.x = x; P.z = z; P.y = WATER_Y + .55 + Math.sin(T * 3) * .05;
  P.face = Math.atan2(Math.cos(B.a), -Math.sin(B.a)); P.move = 0;
  if(go){
    for(const d of DUCKS){ if(d.hit > T) continue; const [dx, dz] = polar(d.a, d.r); if(Math.hypot(dx - x, dz - z) < 1.5){ d.hit = T + 1; B.slow = T + 1; B.v = Math.min(B.v, 4); SFX.quack(); burst(dx, WATER_Y + .5, dz, 10, ['#ffffff', '#bfe8ff'], 3); } }
    for(const r of RINGS){ if(T - r.t < 2) continue; const [rx, rz] = polar(r.a, r.r); if(Math.hypot(rx - x, rz - z) < 1.8){ r.t = T; B.boost = T + 1.4; SFX.boost(); burst(rx, WATER_Y + 1.5, rz, 14, ['#ffd23f', '#ffffff'], 4); } }
  }
  if(Math.random() < dt * 20 * B.v / 10) burst(x - Math.cos(B.a) * 1.4, WATER_Y + .2, z + Math.sin(B.a) * 1.4, 1, ['#ffffff', '#d8f0ff'], 1.2, .8, 6, .3);
  myBoat.position.set(x, WATER_Y + .1 + Math.sin(T * 3) * .05, z); myBoat.rotation.set(0, P.face, Math.sin(T * 2) * .04 - (inp.sx || 0) * .12);

/* zipline from the top of the keep down to the south */
function startZip(){ P.mode = 'zip'; P.zip = { t:0 }; SFX.zip(); hush(); }
function zipStep(dt){
  const Z = P.zip; Z.t = Math.min(1, Z.t + dt * 15 / W.zip.len * (.6 + Z.t * .8));
  const p = W.zip.at(Z.t); P.x = p.x; P.y = p.y - 2.05; P.z = p.z; P.face = Math.atan2(W.zip.b.x - W.zip.a.x, W.zip.b.z - W.zip.a.z); P.move = 0;

/* cake stacking at «طاولة الحلويات» */
const CAKE = { on:false, layers:[], cur:null, dir:0, speed:2, w:1.6, d:1.6, x:0, z:0, fall:[], over:false };
const LAYER_H = .26, cakeMats = [new THREE.MeshLambertMaterial({ color:0xf3cf96 }), new THREE.MeshLambertMaterial({ color:0xfff3e0 })];
const cakeGroup = new THREE.Group(); scene.add(cakeGroup);
function cakeLayer(w, d, x, y, z){
  const g = new THREE.Group(); const body = new THREE.Mesh(new THREE.BoxGeometry(w, LAYER_H * .8, d), cakeMats[0]); body.position.y = LAYER_H * .4; g.add(body);
  const icing = new THREE.Mesh(new THREE.BoxGeometry(w + .02, LAYER_H * .2, d + .02), cakeMats[1]); icing.position.y = LAYER_H * .9; g.add(icing);
  g.position.set(x, y, z); cakeGroup.add(g); return g;
}
function startCake(){
  P.mode = 'cake'; CAKE.on = true; STN.cake.sign.visible = false; CAKE.over = false; CAKE.layers.forEach(l => cakeGroup.remove(l.g)); CAKE.layers = []; CAKE.fall.forEach(f => cakeGroup.remove(f.g)); CAKE.fall = [];
  CAKE.w = CAKE.d = 1.6; CAKE.x = W.cakeTable.x; CAKE.z = W.cakeTable.z; CAKE.speed = 2.2; CAKE.dir = 0;
  CAKE.layers.push({ g:cakeLayer(CAKE.w, CAKE.d, CAKE.x, W.cakeTable.y, CAKE.z), w:CAKE.w, d:CAKE.d, x:CAKE.x, z:CAKE.z });
  cakeNext(); tp(STN.cake.x, null, STN.cake.z + .4, Math.PI); hudTimer.hidden = false; updateCakeHud(); say(LINE.cakeGo, 3200);
}
function cakeNext(){
  const n = CAKE.layers.length, y = W.cakeTable.y + n * LAYER_H; CAKE.dir = n % 2; CAKE.ph = 0;
  CAKE.cur = { g:cakeLayer(CAKE.w, CAKE.d, CAKE.x, y, CAKE.z), off:0, t:Math.random() < .5 ? 0 : Math.PI };
}
function cakeStep(dt){
  if(!CAKE.on || CAKE.over || !CAKE.cur) return;
  const c = CAKE.cur; c.t += dt * CAKE.speed; c.off = Math.sin(c.t) * 2.1;
  c.g.position.x = CAKE.x + (CAKE.dir === 0 ? c.off : 0); c.g.position.z = CAKE.z + (CAKE.dir === 1 ? c.off : 0);
}
function cakeDrop(perfect){
  if(!CAKE.on || CAKE.over || !CAKE.cur) return;
  const c = CAKE.cur; if(perfect){ c.off = 0; c.g.position.set(CAKE.x, c.g.position.y, CAKE.z); }
  const size = CAKE.dir === 0 ? CAKE.w : CAKE.d, off = Math.abs(c.off) < .07 ? 0 : c.off, keep = size - Math.abs(off);
  SFX.drop();
  if(keep <= .05){ // missed: the layer falls off
    CAKE.fall.push({ g:c.g, vy:0, vx:(CAKE.dir === 0 ? Math.sign(off) : 0) * 1.5, vz:(CAKE.dir === 1 ? Math.sign(off) : 0) * 1.5, life:1.6 }); CAKE.cur = null; CAKE.over = true;
    setTimeout(() => endCake(false), 900); return;
  }
  if(off === 0){ SFX.perfect(); burst(c.g.position.x, c.g.position.y + .3, c.g.position.z, 12, ['#fff3e0', '#ff8fb8', '#ffd23f'], 3); popText('✨ ' + L('تمام!', 'Perfect!', 'Mükemmel!')); }
  else { // trim the overhang, the cut piece falls
    const nx = CAKE.dir === 0 ? CAKE.x + off / 2 : CAKE.x, nz = CAKE.dir === 1 ? CAKE.z + off / 2 : CAKE.z;
    const cw = CAKE.dir === 0 ? Math.abs(off) : CAKE.w, cd = CAKE.dir === 1 ? Math.abs(off) : CAKE.d;
    const cx = CAKE.dir === 0 ? CAKE.x + off / 2 + Math.sign(off) * size / 2 : CAKE.x, cz = CAKE.dir === 1 ? CAKE.z + off / 2 + Math.sign(off) * size / 2 : CAKE.z;
    cakeGroup.remove(c.g);
    if(CAKE.dir === 0) CAKE.w = keep; else CAKE.d = keep;
    CAKE.x = nx; CAKE.z = nz;
    c.g = cakeLayer(CAKE.w, CAKE.d, nx, c.g.position.y, nz);
    CAKE.fall.push({ g:cakeLayer(cw, cd, cx, c.g.position.y, cz), vy:0, vx:(CAKE.dir === 0 ? Math.sign(off) : 0) * 1.2, vz:(CAKE.dir === 1 ? Math.sign(off) : 0) * 1.2, life:1.4 });
  }
  CAKE.layers.push({ g:c.g, w:CAKE.w, d:CAKE.d, x:CAKE.x, z:CAKE.z });
  CAKE.speed = Math.min(5.2, CAKE.speed + .14);
  const n = CAKE.layers.length - 1;
  if(n === 10 && !SAVE.st.cake.done){ popText('🎉 ' + N(10)); }
  updateCakeHud();
  if(n >= 20){ CAKE.cur = null; CAKE.over = true; setTimeout(() => endCake(false), 600); return; }
  cakeNext();
}
function updateCakeHud(){ $('#timerT').textContent = '🍰 ' + N(CAKE.layers.length - 1) + ' / ' + N(10); }
function cakeFallStep(dt){
  for(const f of CAKE.fall){ f.vy -= 14 * dt; f.g.position.x += f.vx * dt; f.g.position.z += f.vz * dt; f.g.position.y += f.vy * dt; f.g.rotation.z += f.vx * dt; f.g.rotation.x += f.vz * dt; f.life -= dt; if(f.life <= 0) cakeGroup.remove(f.g); }
  CAKE.fall = CAKE.fall.filter(f => f.life > 0);
}
function endCake(quit){
  if(!CAKE.on) return;
  const n = CAKE.layers.length - 1;
  CAKE.on = false; CAKE.over = true; if(CAKE.cur){ cakeGroup.remove(CAKE.cur.g); CAKE.cur = null; }
  P.mode = 'walk'; hudTimer.hidden = true; STN.cake.sign.visible = true;
  setTimeout(() => { if(!CAKE.on){ CAKE.layers.slice(1).forEach(l => cakeGroup.remove(l.g)); } }, quit ? 0 : 4000);
  if(quit) return;
  if(n >= 10) finishStation('cake', n); else showResult({ id:'cake', fail:true, score:n });
}

/* ======================================================================
   Camera, context action
   ====================================================================== */
function updateCamera(dt){
  let tx = P.x, ty = P.y, tz = P.z, dist = cam.dist, pitch = cam.pitch;
  if(P.mode === 'boat' && P.boat){ const a = P.boat.a, want = Math.atan2(-Math.cos(a), Math.sin(a)); if(look.id == null) cam.yaw += angDiff(want, cam.yaw) * Math.min(1, 3 * dt); dist = 9; pitch = .3; }
  if(P.mode === 'zip'){ dist = 9; }
  if(P.mode === 'cake'){
    const top = W.cakeTable.y + CAKE.layers.length * LAYER_H;
    const cx = W.cakeTable.x, cz = W.cakeTable.z, want = new THREE.Vector3(cx + .6, top + 1.15, cz + 3.7);
    camPos.lerp(want, snapCam ? 1 : 1 - Math.exp(-4 * dt)); snapCam = false; camera.position.copy(camPos); camera.lookAt(cx, top - .3, cz); return;
  }
  const k = snapCam ? 1 : 1 - Math.exp(-9 * dt);
  cam.tx = lerp(cam.tx, tx, k); cam.ty = lerp(cam.ty, ty, P.mode === 'walk' && P.ground ? k : Math.min(1, k * .6)); cam.tz = lerp(cam.tz, tz, k);
  const dx = Math.sin(cam.yaw) * Math.cos(pitch), dy = Math.sin(pitch), dz = Math.cos(cam.yaw) * Math.cos(pitch);
  let x = cam.tx + dx * dist, y = cam.ty + 1.2 + dy * dist, z = cam.tz + dz * dist;
  // keep the camera outside the keep and the big towers
  const kd = Math.hypot(x - KEEP.x, z - KEEP.z); if(kd < KEEP.r + 1 && y < KEEP.top + .5){ x = KEEP.x + (x - KEEP.x) / kd * (KEEP.r + 1); z = KEEP.z + (z - KEEP.z) / kd * (KEEP.r + 1); }
  y = Math.max(y, groundAt(x, z) + .6);
  if(snapCam){ camPos.set(x, y, z); snapCam = false; } else camPos.lerp(_v.set(x, y, z), 1 - Math.exp(-10 * dt));
  camera.position.copy(camPos); camera.lookAt(cam.tx, cam.ty + 1.1, cam.tz);
}
let ctxNow = null;
function context(){
  if(state !== 'play') return null;
  if(P.mode === 'cake') return CAKE.over ? null : { k:'cakeDrop' };
  if(P.mode !== 'walk') return null;
  if(run) return null;
  if(P.ground && P.y > KEEP.top - .3 && Math.hypot(P.x - SPOTS.zipTop.x, P.z - SPOTS.zipTop.z - .2) < 1.8) return { k:'zip' };
  for(const id of STN_IDS){ const s = STN[id]; if(Math.hypot(P.x - s.x, P.z - s.z) < 1.6 && P.y < groundAt(s.x, s.z) + 1) return { k:'stn', id }; }
  return null;
}
function doAction(){
  const c = context(); if(!c) return;
  if(c.k === 'cakeDrop'){ cakeDrop(false); return; }

  }
}

    <div class="row"><button class="big-btn" id="bRetry">🔄 ${L('جرّب كمان مرة', 'Try again', 'Tekrar dene')}</button><button class="ghost-btn" id="bBack">↩️ ${L('رجوع', 'Back', 'Geri')}</button></div>`;
  $('#bRetry').onclick = () => { SFX.tap(); retry(); };
  $('#bBack').onclick = () => { SFX.tap(); mpMenu(); };
}
function mpInRoom(){
  MP.screen = 'room';
  if(!owned() && !preview){ preview = true; }
  enterPlay();
  if(state === 'play'){ say(L('رقم غرفتك ', 'Your room number is ', 'Oda numaran ') + [...MP.code].map(N).join('') + L(' — قوله لأصحابك 👫', ' — tell your friends 👫', ' — arkadaşlarına söyle 👫'), 5000); mpHud(); }
}
async function mpCreate(want){
  mpConnecting();
  try{
    for(let i = 0; i < 4; i++){
      const code = i === 0 && /^\d{4}$/.test(want || '') ? String(want) : String(1000 + Math.floor(Math.random() * 9000));
      const r = await mpOpen(code, 'create');
      if(r === 'ok'){ mpInRoom(); mpSendInvite(); return; }
    }
    throw new Error('busy');
  }catch(e){ if(MP.screen === 'connecting' && String(e && e.message) !== 'cancelled') mpError(mpCreate); }
}
async function mpJoin(code, until){
  mpConnecting();
  try{
    let r = await mpOpen(code, 'join');
    if(MP.screen !== 'connecting') return;
    while(r === 'nobody' && until && performance.now() < until){
      await new Promise(res => setTimeout(res, 700)); if(MP.screen !== 'connecting') return;
      r = await mpOpen(code, 'join'); if(MP.screen !== 'connecting') return;
    }
    if(r === 'ok') mpInRoom();
    else if(r === 'full') mpKeypad(L('الغرفة مليانة', 'The room is full', 'Oda dolu') + ' 🙈');
    else mpKeypad(L('ما لقينا هالغرفة، تأكّد من الرقم', "We couldn't find that room — check the number", 'Bu oda bulunamadı, numarayı kontrol et'));
  }catch(e){ if(MP.screen === 'connecting' && String(e && e.message) !== 'cancelled') mpError(() => mpJoin(code)); }
}
/* «تعا العب» from the friends page: ?host=1&invite=<friendCode> */
function mpSendInvite(){
  const who = MP.inviteFor; if(!who || !MP.code || !frOk()) return;
  MP.inviteFor = null;
  Friends.invite(who, MP.code, FR_GAME).then(r => {
    if(r && r.status === 'sent') say(L('✉️ بعتنا دعوة لصاحبك! استنّاه يفوت', '✉️ Invite sent! Wait for your friend to join', '✉️ Davet gönderildi! Arkadaşının gelmesini bekle'));
    else if(r && r.status === 'slow_down') say(L('بعتت دعوات كتير، استنّى شوي ⏳', 'Too many invites, wait a little ⏳', 'Çok fazla davet, biraz bekle ⏳'));
    else say(L('ما قدرنا نبعت الدعوة 🙈', "Couldn't send the invite 🙈", 'Davet gönderilemedi 🙈'));
  }, e => say(Friends.errText(e)));
}
function mpKeypad(msg){
  MP.screen = 'keypad'; MP.typed = ''; mpCard(); card.className = 'card wide';
  const keys9 = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button data-k="${d}">${N(d)}</button>`).join('');
  card.innerHTML = `<h2>🔢 ${L('اكتب رقم الغرفة', 'Type the room number', 'Oda numarasını yaz')}</h2>
    <div class="mp-cols"><div class="mp-col"><div class="mp-code" id="kpCode"></div><p class="mp-msg" id="kpMsg">${msg || ''}</p>
      <button class="ghost-btn" id="bBack">↩️ ${L('رجوع', 'Back', 'Geri')}</button></div>
    <div class="keypad" id="keypad">${keys9}<button data-k="del" aria-label="${L('امسح', 'Delete', 'Sil')}">⌫</button><button data-k="0">${N(0)}</button><button class="ok" data-k="ok" aria-label="${L('تمام', 'OK', 'Tamam')}">✅</button></div></div>`;
  card.querySelectorAll('#keypad button').forEach(b => b.onclick = () => mpKey(b.dataset.k));
  $('#bBack').onclick = () => { SFX.tap(); mpMenu(); };
  mpKeyDraw();
}
function mpKeyDraw(){ const el = $('#kpCode'); if(!el) return; el.innerHTML = [0, 1, 2, 3].map(i => `<b class="${i === MP.typed.length ? 'cur' : ''}">${MP.typed[i] != null ? N(MP.typed[i]) : ''}</b>`).join(''); }
function mpKey(k){
  if(MP.screen !== 'keypad') return;
  if(k === 'del'){ MP.typed = MP.typed.slice(0, -1); SFX.tap(); }
  else if(k === 'ok'){ if(MP.typed.length === 4) mpJoin(MP.typed); else SFX.bonk(); return; }
  else if(/^\d$/.test(k) && MP.typed.length < 4){ MP.typed += k; SFX.tap(); }
  const m = $('#kpMsg'); if(m) m.textContent = '';
  mpKeyDraw();
  if(MP.typed.length === 4){ const code = MP.typed; setTimeout(() => { if(MP.screen === 'keypad' && MP.typed === code) mpJoin(code); }, 300); }
}
addEventListener('keydown', e => {
  if(state !== 'mp' || MP.screen !== 'keypad') return;
  if(/^\d$/.test(e.key)) mpKey(e.key); else if(e.key === 'Backspace') mpKey('del'); else if(e.key === 'Enter') mpKey('ok');
});

/* ======================================================================
   Main loop
   ====================================================================== */
function tick(dt){
  T += dt;
  readInput(dt);
  if(P.mode === 'walk') stepWalk(dt);
  else if(P.mode === 'boat') boatStep(dt);
  else if(P.mode === 'zip') zipStep(dt);
  else if(P.mode === 'cake'){ P.vx = P.vz = 0; P.move = 0; cakeStep(dt); }
  if(P.mode === 'walk'){ towerStep(); bounceStep(); }
  toyStep();
  previewTick(dt);
}
function animMe(dt){
  me.grp.position.set(P.x, P.y, P.z); me.grp.rotation.y = P.face;
  P.sq += (0 - P.sq) * Math.min(1, 10 * dt);
  poseHero(me, { t:T, dt, run:P.mode === 'walk' ? P.move : 0, grounded:P.mode !== 'walk' || P.ground, vy:P.vy, sq:P.sq, flip:0 });
  if(P.mode === 'boat') me.legs.forEach(l => l.rotation.x = -1.3);
  if(P.mode === 'zip') me.arms.forEach(a => { a.rotation.x = -3; a.rotation.z = 0; });
  if(me.acc && me.acc.cape.visible) me.acc.cape.rotation.x = .18 + P.move * .6 + (P.ground ? 0 : .4);
  me.blob.visible = P.mode === 'walk' || P.mode === 'cake'; const f = floorAt(P.x, P.y + .1, P.z); me.blob.position.set(P.x, f + .03, P.z); const bs = clamp(1 - (P.y - f) * .12, .35, 1); me.blob.scale.set(bs, 1, bs);
  poseHero(laila, { t:T + 1, dt, run:0, grounded:true, vy:0, sq:0, flip:0 });
}
let last = performance.now(), fpsN = 0, fpsT = 0, fps = 60, slowT = 0, fastT = 0, menuT = 0, miniT = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if(dt > .05) dt = .05; if(dt <= 0) dt = .001;
  fpsN++; fpsT += dt;
  if(fpsT >= 1){
    fps = fpsN / fpsT; fpsN = 0; fpsT = 0;
    // adaptive resolution: DPR cap 1.5, step down when slow, back up a little when there is room
    if(state === 'play' && fps < 45 && dpr > .75){ slowT++; fastT = 0; if(slowT >= 2){ dpr = Math.max(.75, dpr - .25); renderer.setPixelRatio(dpr); renderer.setSize(SW, SH, false); slowT = 0; } }
    else if(state === 'play' && fps > 58 && dpr < Math.min(window.devicePixelRatio || 1, 1.5)){ fastT++; slowT = 0; if(fastT >= 6){ dpr = Math.min(Math.min(window.devicePixelRatio || 1, 1.5), dpr + .25); renderer.setPixelRatio(dpr); renderer.setSize(SW, SH, false); fastT = 0; } }
    else { slowT = 0; }
  }
  if(state === 'play'){ tick(dt); updateCamera(dt); hudFrame(); updateActBtn(); }
  else {
    T += dt;
    if(P.mode === 'boat' && state !== 'play') boatStep(0);
    if(['menu', 'locked', 'previewEnd', 'select', 'mp', 'boot'].includes(state) && !entered){
      menuT += dt; const a = menuT * .05 + .3;
      camera.position.set(Math.sin(a) * 62, 30, Math.cos(a) * 62); camera.lookAt(0, 6, -2);
    }
  }
  if(camOverride){ camera.position.set(camOverride[0], camOverride[1], camOverride[2]); camera.lookAt(camOverride[3], camOverride[4], camOverride[5]); }
  cakeFallStep(dt); fireworks(dt);
  animMe(dt); animRemotes(dt);
  W.animate(T, camera.position); drawToys(T); drawMoat(T); drawDrops(T);
  bStars.forEach((m, i) => { m.rotation.y = T * 2 + i; });
  if(waterTex) waterTex.offset.set(T * .008, T * .005);
  updateParts(dt);
  miniT += dt; if(state === 'play' && miniT > .1){ miniT = 0; drawMini(); }
  sky.position.copy(camera.position); sunSpr.position.copy(camera.position).addScaledVector(SUN_DIR, 560);
  renderer.render(scene, camera);
}
let camOverride = null;

/* ---------- test hook ---------- */
window.__castle = {
  get state(){ return state; }, get mode(){ return P.mode; }, P, get preview(){ return preview; }, get owned(){ return owned(); }, get fps(){ return fps; }, get dpr(){ return dpr; }, get rot(){ return ROT; },
  get ctx(){ const c = context(); return c ? c.k + (c.id ? ':' + c.id : '') : null; }, act:() => doAction(), jump(){ jumpQ = .15; },
  save:() => JSON.parse(JSON.stringify(MapSave.load())), get run(){ return run ? { id:run.id, cp:run.cp, got:run.got.size, t:runTime(), rid:run.rid } : null; },
  get previewLeft(){ return Trial.left(MAP); }, skipPreview(sec){ Trial.use(MAP, sec); }, trialInfo:() => trialInfo,
  tp(x, y, z){ tp(x, y, z); }, tpStation(id){ const s = STN[id]; tp(s.x, null, s.z); }, goStation:id => goStation(id), STN:Object.fromEntries(STN_IDS.map(k => [k, { x:STN[k].x, z:STN[k].z }])),
  sim(sec, n = 30){ const k = Math.round(sec * n); for(let i = 0; i < k; i++){ tick(1 / n); } },
  walk(dirx, dirz, sec){ const l = Math.hypot(dirx, dirz) || 1; walkOverride = { x:dirx / l, z:dirz / l, t:sec }; },
  toys:TOYS.map(t => ({ x:t.x, y:t.y, z:t.z })), spiral:W.spiral.map(s => ({ x:s.x, y:s.y, z:s.z })), checkpoints:W.checkpoints, bounceStars:W.bounceStars, KEEP, SPOTS,
  startStation(id){ if(id === 'cake') startCake(); else startRun(id, {}); }, cakeDrop:p => cakeDrop(!!p), cakeAt(off){ if(CAKE.cur){ CAKE.cur.off = off; cakeDrop(false); } }, cakeMiss(){ this.cakeAt(5); }, get cake(){ return { on:CAKE.on, layers:CAKE.layers.length - 1, over:CAKE.over }; },
  boatProg(v){ if(P.boat) P.boat.prog = v; }, get boat(){ return P.boat ? { a:P.boat.a, r:P.boat.r, v:P.boat.v, prog:P.boat.prog } : null; },
  steer(v){ walkOverride = { x:0, z:0, t:1, sx:v }; },
  get result(){ return lastResult; }, menu:() => showMenu(), pause:() => showPause(), resume:() => resume(), list:() => showList(), locked:() => showLocked(), enter:() => enterPlay(),
  deco:() => ({ flag:W.deco.flag.visible, crown:W.deco.crown.visible, balloons:W.deco.balloons.visible, fireworks:W.deco.fireworks.on, statue:!!statue }),
  camAt(...a){ camOverride = a.length ? a : null; }, info:() => renderer.info.render, setHero:id => setHero(id),
  remotes:() => [...remotes.values()].map(r => ({ id:r.id, hero:r.hero, c:r.c, x:r.x, z:r.z, seen:r.seen, md:r.md, visible:r.h.grp.visible })),
  mp:{ get screen(){ return MP.screen; }, get code(){ return MP.code; }, get id(){ return MP.id; }, get players(){ return MP.players.map(p => ({ id:p.id, hero:p.hero, c:p.c })); }, races:() => JSON.parse(JSON.stringify(MP.races)), menu:() => mpMenu() },
  get banner(){ const b = $('#banner'); return b.hidden ? null : b.textContent; },
  tris(){ const out = []; scene.traverse(o => { if(!(o.isMesh || o.isInstancedMesh) || !o.visible) return; const g = o.geometry, n = (g.index ? g.index.count : g.attributes.position.count) / 3 * (o.isInstancedMesh ? o.count : 1); out.push([Math.round(n), o.isInstancedMesh ? "inst" + o.count : (o.parent === scene ? "mesh" : "child"), o.material.type]); }); return out.sort((a, b) => b[0] - a[0]).slice(0, 25); }
};

/* ---------- boot ---------- */
resize();
applyDeco();
renderer.shadowMap.needsUpdate = true;
requestAnimationFrame(frame);
setTimeout(() => { $('#loading').hidden = true; }, 60);
if(owned()) showMenu(); else showLocked();
/* links from the friends page: ?join=<room> joins that room, ?host=1&invite=<friendCode> creates a room and invites the friend */
(function(){
  const q = new URLSearchParams(location.search), join = q.get('join'), host = q.get('host') === '1', inv = q.get('invite'), room = q.get('room');
  if(!/^\d{4}$/.test(join || '') && !host) return;
  ['join', 'host', 'invite', 'room'].forEach(k => q.delete(k));
  try{ history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash); }catch(e){}
  const go = () => { if(/^\d{4}$/.test(join || '')) mpJoin(join, performance.now() + 20000); else { MP.inviteFor = /^[A-Z2-9]{6}$/.test(inv || '') ? inv : null; mpCreate(room); } };
  if(owned()) go();
  else Trial.fetch(MAP).then(r => { trialInfo = r; if(r.left > 0){ preview = true; go(); } else showPreviewEnd(); });
})();
