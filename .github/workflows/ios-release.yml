name: ios-release
# Builds «بوبو لاند / Bobo Land» for iPhone (Capacitor wrapper around the web games, all files inside the app,
# works offline) and sends it to TestFlight. Manual only. This repo is public, so macOS minutes are free.
# Needs repo secrets (GitHub → Settings → Secrets and variables → Actions), the same values as the SAHL repo:
#   APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_KEY_P8 (App Store Connect API key, role Admin), APPLE_TEAM_ID.
# The app record «Bobo Land» with bundle id com.boboland.kids must exist in App Store Connect before uploading.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the App Store"
        default: "1.0.0"
      upload:
        description: "Send to TestFlight"
        type: boolean
        default: true
      test_only:
        description: "Test build only, without Apple keys (not signed, not uploaded)"
        type: boolean
        default: false

concurrency: { group: ios-release, cancel-in-progress: true }

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE: com.boboland.kids
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 (App Store Connect only accepts the iOS 26 SDK or later)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::No Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - if: ${{ !inputs.test_only }}
        name: Check Apple secrets
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          miss=""
          [ -n "$ISSUER" ] || miss="$miss APPSTORE_ISSUER_ID"
          [ -n "$KEY_ID" ] || miss="$miss APPSTORE_KEY_ID"
          [ -n "$KEY_P8" ] || miss="$miss APPSTORE_KEY_P8"
          [ -n "$TEAM" ] || miss="$miss APPLE_TEAM_ID"
          if [ -n "$miss" ]; then echo "::error::Missing secrets:$miss"; exit 1; fi
          mkdir -p ~/private_keys
          printf '%s\n' "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$KEY_ID.p8" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Web files into the app (offline)
        run: |
          mkdir -p "$RUNNER_TEMP/app/www"
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' --exclude 'store' --exclude '.well-known' \
            --exclude 'README.md' --exclude '*.webmanifest' --exclude 'sw.js' ./ "$RUNNER_TEMP/app/www/"
          ls "$RUNNER_TEMP/app/www"
      - name: Capacitor iOS project
        working-directory: ${{ runner.temp }}/app
        run: |
          cat > package.json <<'JS'
          { "name": "bobo-land", "version": "1.0.0", "private": true }
          JS
          npm i --no-audit --no-fund @capacitor/core@7.4.2 @capacitor/cli@7.4.2 @capacitor/ios@7.4.2
          cat > capacitor.config.json <<'JS'
          { "appId": "com.boboland.kids", "appName": "Bobo Land", "webDir": "www",
            "ios": { "contentInset": "never", "backgroundColor": "#1c1838", "scrollEnabled": false } }
          JS
          npx cap add ios
          npx cap sync ios
      - if: ${{ !inputs.test_only }}
        name: Distribution certificate + App Store profile (App Store Connect API, no device needed)
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/ios/ios-signing.py create
      - if: ${{ !inputs.test_only }}
        name: Keychain with the distribution certificate
        run: |
          KC="$RUNNER_TEMP/bobo.keychain-db"; KP=$(uuidgen)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$P12_PATH" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          rm -f "$P12_PATH"
      - if: ${{ !inputs.test_only }}
        name: Name, signing, version, icon
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APP_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/ios/prepare.sh "$RUNNER_TEMP/app/ios/App"
      - if: ${{ !inputs.test_only }}
        name: Archive
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cd "$RUNNER_TEMP/app/ios/App"
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            -quiet
          test -d "$RUNNER_TEMP/App.xcarchive"
      - if: ${{ !inputs.test_only }}
        name: Export and send to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          DEST=export; [ "$UPLOAD" = "true" ] && DEST=upload
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          ls -la "$RUNNER_TEMP/ipa" || true
      - name: Test build (unsigned)
        if: ${{ inputs.test_only }}
        run: |
          cd "$RUNNER_TEMP/app/ios/App"
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -quiet build
          echo "Unsigned iPhone build OK"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.upload && !inputs.test_only }}
        with:
          name: bobo-land-ios
          path: ${{ runner.temp }}/ipa
          retention-days: 14
      - name: Revoke this run's certificate (its key is thrown away with the keychain)
        if: always() && env.CERT_ID != '' && !inputs.test_only
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/ios/ios-signing.py revoke-run'
      - name: Remove the CI keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/bobo.keychain-db" || true
