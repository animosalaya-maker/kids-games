name: granny-live-test
on:
  push:
    branches: [claude/mp-test]
    paths: ['scripts/granny-live.js', '.github/workflows/granny-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: claude/granny-coop, path: site }
      - run: (cd site && python3 -m http.server 8765 &) && sleep 2
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scripts/granny-live.js
        env: { SITE: 'http://localhost:8765/' }
