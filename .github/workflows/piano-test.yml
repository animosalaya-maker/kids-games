name: piano-live-test
on:
  push:
    branches: [claude/mp-test-piano]
    paths: ['scripts/piano-live.js', '.github/workflows/piano-test.yml', 'piano/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: (python3 -m http.server 8765 &) && sleep 2
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scripts/piano-live.js
        env: { SITE: 'http://localhost:8765/' }
