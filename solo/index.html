<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ألعاب بوبو</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ألعاب لاعب واحد مع بوبو.">
<meta name="theme-color" content="#1c1838">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: menu grid of tiles; a full-screen canvas while playing; a big start card and a result card on top. */
:root{
  --night:#1c1838; --night-2:#2a2452; --night-3:#362e68; --face:#2f2858; --ink:#fff7e8; --muted:#bdb4e6; --gold:#ffcd4d;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif; --body:"Tajawal",system-ui,sans-serif; color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#menu{height:100%;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.head{max-width:720px;margin:0 auto 16px;display:flex;align-items:center;gap:12px}
.head h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,42px);margin:0;line-height:1;color:var(--gold);text-shadow:0 4px 0 var(--face);flex:1;min-width:0}
.head .back{border-radius:14px;background:var(--night-3);padding:10px 14px;font-weight:700;color:var(--ink);text-decoration:none;flex:none}
#grid{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{aspect-ratio:1;max-width:100%;border:0;border-radius:22px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;box-shadow:inset 0 0 0 4px rgba(28,24,56,.85),0 6px 0 var(--face)}
.tile .em{font-size:clamp(34px,11vw,52px);line-height:1}
.tile .nm{font-family:var(--display);font-weight:800;font-size:clamp(13px,3.6vw,17px);line-height:1.1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);text-align:center}
#play{position:fixed;inset:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#quit{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));width:44px;height:44px;border-radius:14px;border:0;background:rgba(54,46,104,.9);font-size:18px;z-index:3}
.over{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(18,14,40,.86);padding:16px;overflow-y:auto}
.card{background:var(--night-2);border-radius:28px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:380px;width:100%;box-shadow:0 0 0 3px var(--night-3),0 24px 60px rgba(0,0,0,.5)}
#intro .card{background:var(--bg)}
.i-emo,.r-emo{font-size:86px;line-height:1;filter:drop-shadow(0 5px 0 rgba(0,0,0,.25))}
.card h2{font-family:var(--display);font-weight:800;font-size:34px;margin:0;line-height:1.1;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.card p{margin:0;line-height:1.55;font-size:17px;color:#fff;text-wrap:balance}
.i-best,.r-best{font-weight:700;color:rgba(255,255,255,.85)}
.r-score{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--gold)}
.r-coins{font-family:var(--display);font-weight:800;font-size:26px;color:var(--gold)}
.big-btn{border:0;border-radius:20px;background:var(--gold);color:#3a2a00;font-family:var(--display);font-weight:800;font-size:26px;padding:10px 40px;box-shadow:0 6px 0 #c48f12}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c48f12}
.ghost-btn{border:0;background:rgba(28,24,56,.55);border-radius:16px;padding:10px 18px;font-weight:700}
</style>
</head>
<body>
<section id="menu">
  <div class="head"><h1>ألعاب بوبو</h1><a class="back" href="../">⬅ كل الألعاب</a></div>
  <div id="grid"></div>
</section>
<section id="play" hidden>
  <canvas id="cv" aria-label="ساحة اللعب"></canvas>
  <button id="quit" aria-label="رجوع">✕</button>
</section>
<div class="over" id="intro" hidden><div class="card">
  <div class="i-emo"></div><h2></h2><p></p><div class="i-best"></div>
  <button class="big-btn" id="goBtn">العب</button><a class="ghost-btn" href="../" style="text-decoration:none;color:#fff">⬅ كل الألعاب</a>
</div></div>
<div class="over" id="result" hidden><div class="card">
  <div class="r-emo"></div><h2></h2><div class="r-score"></div><div class="r-best"></div><div class="r-coins"></div>
  <button class="big-btn" id="again">مرة كمان</button><a class="ghost-btn" href="../" style="text-decoration:none;color:#fff">⬅ كل الألعاب</a>
  <button class="ghost-btn" id="toMenu" hidden>القائمة</button>
</div></div>
<script src="../world.js"></script>
<script src="engine.js"></script>
<!-- GAMES:START -->
<script src="games/memory.js"></script>
<script src="games/letters.js"></script>
<script src="games/math.js"></script>
<script src="games/colors.js"></script>
<script src="games/jumper.js"></script>
<script src="games/runner.js"></script>
<script src="games/stack.js"></script>
<script src="games/fishing.js"></script>
<script src="games/puzzle.js"></script>
<script src="games/shapes.js"></script>
<script src="games/catch.js"></script>
<script src="games/peek.js"></script>
<!-- GAMES:END -->
<script>Solo.boot();</script>
</body>
</html>
