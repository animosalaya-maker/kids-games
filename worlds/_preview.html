<!doctype html><html><body style="margin:0;background:#334"><canvas id="c" width="1400" height="420"></canvas>
<script type="module">
import * as THREE from '../adventure3d/three.module.min.js';
import { makeKit } from './kit.js';
const K = makeKit(THREE);
const r = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x8fc8ff);
sc.add(new THREE.HemisphereLight(0xeef8ff,0x7a6cb0,2.0)); const d=new THREE.DirectionalLight(0xfff0d0,2); d.position.set(2,4,3.5); sc.add(d);
const hs = K.HERO_IDS.map((id,i)=>{const h=K.HEROES[id](); h.grp.position.x=(i-3)*1.3; sc.add(h.grp); K.poseHero(h,{t:.5,dt:0,run:0,grounded:true,vy:0,sq:0,flip:0}); return h;});
const cam = new THREE.PerspectiveCamera(30,1400/420,.1,100); cam.position.set(0,1.6,7); cam.lookAt(0,.6,0);
const ry = +(new URLSearchParams(location.search).get('ry')||0); hs.forEach(h=>h.grp.rotation.y=ry);
r.render(sc,cam); window.done=1;
</script></body></html>
