<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="../i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title data-en="Bobo Worlds" data-tr="Bobo Dünyaları">عوالم بوبو</title>
<meta name="description" content="عوالم ثلاثية الأبعاد للأطفال: سباقات حواجز، قفز ومنصّات، والعب مع أصحابك." data-en="3D worlds for kids: obstacle courses, jumping and platforms, and racing with friends." data-tr="Çocuklar için 3D dünyalar: engelli parkurlar, zıplama, platformlar ve arkadaşlarla yarış.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bobo Land">
<meta name="theme-color" content="#1c1838">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Bobo Worlds: full-screen WebGL obby worlds. Always landscape (rotated layer like the 3D adventure).
   Hub of world cards → world sheet → play (HUD, joystick, jump) → finish card. */
:root{
  --night:#1c1838; --night-2:#2a2452; --night-3:#362e68; --wall-face:#2f2858;
  --ink:#fff7e8; --muted:#bdb4e6; --gold:#ffcd4d; --mint:#5fe3b1; --pink:#ff8fb8;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0;
  --sa-t:env(safe-area-inset-top,0px);--sa-r:env(safe-area-inset-right,0px);--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px);--sw:100vw;--sh:100vh}
#stage.rot{--sa-t:env(safe-area-inset-right,0px);--sa-r:env(safe-area-inset-bottom,0px);--sa-b:env(safe-area-inset-left,0px);--sa-l:env(safe-area-inset-top,0px)}
#saProbe{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;width:var(--sa-l);height:var(--sa-b)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#touch{position:absolute;inset:0;z-index:2;touch-action:none}
#flash{position:absolute;inset:0;z-index:3;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s ease-out}
#flash.on{opacity:.75;transition:none}

.hud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;gap:8px;pointer-events:none;
  padding:calc(8px + var(--sa-t)) max(12px,var(--sa-r)) 0 max(12px,var(--sa-l))}
.hud > *{pointer-events:auto}
.icon-btn{width:48px;height:48px;flex:none;border:0;border-radius:16px;background:rgba(28,24,56,.78);font-size:22px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.chips{display:flex;gap:6px;flex:none;direction:ltr;flex-wrap:wrap;justify-content:flex-end;max-width:calc(var(--sw) * .4)}
.chip{background:rgba(28,24,56,.78);border-radius:999px;padding:6px 12px;font-weight:700;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.chip.timer{direction:ltr;unicode-bidi:isolate;font-family:var(--display);font-size:22px;background:rgba(28,24,56,.85);padding:2px 16px;min-width:96px;justify-content:center;box-shadow:inset 0 0 0 3px var(--gold)}
.mpbar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;direction:ltr;pointer-events:none}
.chip.ps{box-shadow:inset 0 0 0 3px var(--c);padding:3px 10px 3px 3px;gap:5px}
.chip.ps img{width:30px;height:30px;border-radius:50%;display:block;background:var(--night);object-fit:cover;object-position:top}
.chip.ps.me{background:rgba(74,63,140,.95)}
.chip.ps.done{background:rgba(40,120,80,.95)}

.joy{position:absolute;z-index:4;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,247,232,.16);border:3px solid rgba(255,247,232,.45);pointer-events:none;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.joy.on{background:rgba(255,247,232,.24)}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,247,232,.85);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.jump{position:absolute;z-index:4;right:max(18px,calc(var(--sa-r) + 8px));bottom:calc(22px + var(--sa-b));--s:min(calc(var(--sw) * .27),110px);width:var(--s);height:var(--s);
  border-radius:50%;border:3px solid rgba(255,224,140,.9);background:rgba(255,205,77,.55);display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.25);touch-action:none}
.jump svg{width:46%;height:46%;fill:#fff7e8}
.jump.on{transform:translateY(4px) scale(.96);background:rgba(255,205,77,.85);box-shadow:0 1px 0 rgba(0,0,0,.25)}
#stage.short .jump{--s:min(calc(var(--sh) * .25),104px)}
#stage.short .joy{width:110px;height:110px;margin:-55px 0 0 -55px}

/* Aunt Laila's speech bubble */
.guide{position:absolute;z-index:6;left:50%;bottom:calc(14px + var(--sa-b));transform:translateX(-50%);display:flex;align-items:flex-end;gap:6px;pointer-events:none;
  max-width:min(520px,calc(var(--sw) - 300px));animation:gIn .35s cubic-bezier(.2,1.4,.4,1)}
.guide img{width:74px;height:96px;object-fit:contain;object-position:bottom;flex:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.guide p{margin:0 0 18px;background:#fff7e8;color:#2a1f4a;font-family:var(--display);font-weight:800;font-size:18px;line-height:1.3;padding:9px 15px;border-radius:20px;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.guide p::before{content:"";position:absolute;bottom:10px;inset-inline-start:-9px;border:9px solid transparent;border-inline-end-color:#fff7e8;border-inline-start:0}
[dir=rtl] .guide p::before{inset-inline-start:auto;inset-inline-end:-9px;border-inline-end-color:transparent;border-inline-start:9px solid #fff7e8;border-inline-end:0}
.guide.hub{z-index:25;left:auto;right:max(14px,var(--sa-r));transform:none;bottom:calc(10px + var(--sa-b));max-width:min(380px,calc(var(--sw) * .44))}
@keyframes gIn{from{opacity:0;transform:translateX(-50%) translateY(30px) scale(.8)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.guide.hub{animation:gIn2 .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes gIn2{from{opacity:0;transform:translateY(30px) scale(.8)}to{opacity:1;transform:none}}
#stage.short .guide img{width:58px;height:76px} #stage.short .guide p{font-size:16px;padding:7px 12px;margin-bottom:12px}

.overlay{position:absolute;inset:0;z-index:20;display:flex;background:rgba(18,14,40,.55);overflow-y:auto;
  padding-left:max(16px,var(--sa-l));padding-right:max(16px,var(--sa-r));padding-block:calc(14px + var(--sa-t)) calc(14px + var(--sa-b))}
.overlay.dim{background:rgba(18,14,40,.8)}
.overlay.clear{background:linear-gradient(180deg,rgba(18,14,40,.55),rgba(18,14,40,.15) 40%,rgba(18,14,40,.35))}
.card{width:100%;max-width:460px;margin:auto;background:rgba(42,36,82,.94);border-radius:28px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  box-shadow:0 0 0 3px var(--night-3),0 24px 60px rgba(0,0,0,.5);animation:cardIn .3s ease-out}
.card.wide{max-width:880px}
.card.bare{background:none;box-shadow:none;max-width:none;padding:0;animation:none}
@keyframes cardIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card h1{font-family:var(--display);font-weight:800;font-size:38px;line-height:1.1;margin:0;color:var(--gold);text-shadow:0 4px 0 var(--wall-face)}
.card h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;margin:0}
.card p{margin:0;color:var(--muted);line-height:1.5;font-size:16px;text-wrap:balance}
.big-btn{border:0;border-radius:20px;background:var(--gold);color:#3a2a00;font-family:var(--display);font-weight:800;font-size:24px;padding:11px 26px;min-width:190px;box-shadow:0 6px 0 #c48f12}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c48f12}
.big-btn.alt{background:var(--pink);color:#4a0f2a;box-shadow:0 6px 0 #c45a83}
.big-btn.alt:active{box-shadow:0 2px 0 #c45a83}
.big-btn.mint{background:var(--mint);color:#063d2a;box-shadow:0 6px 0 #2a9c74}
.big-btn.mint:active{box-shadow:0 2px 0 #2a9c74}
.big-btn:disabled{opacity:.45;transform:none}
.ghost-btn{border:0;background:var(--night-3);border-radius:16px;padding:11px 18px;font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--wall-face);text-decoration:none;color:var(--ink);display:inline-block}
.ghost-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wall-face)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tally{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;direction:ltr}
.tally span{background:var(--night);border-radius:16px;padding:7px 14px;font-weight:700;font-size:18px}
.bigstar{font-size:70px;line-height:1;animation:spin .7s ease-out;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
@keyframes spin{from{transform:scale(0) rotate(-200deg)}to{transform:scale(1) rotate(0)}}
.rothint{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:10px;background:var(--gold);color:#3a2a00;border-radius:18px;padding:6px 16px 6px 12px;font-family:var(--display);font-weight:800;font-size:18px;box-shadow:0 4px 0 #c48f12}
.rothint i{font-style:normal;font-size:30px;line-height:1;display:inline-block;animation:rotphone 2.6s ease-in-out infinite}
@keyframes rotphone{0%,20%{transform:rotate(-90deg)}55%,85%{transform:rotate(-180deg)}100%{transform:rotate(-90deg)}}

/* hub */
.hub{width:100%;display:flex;flex-direction:column;gap:10px;margin:auto 0}
.hub-top{display:flex;align-items:center;gap:12px;padding-left:128px;min-height:52px}
.hub-top h1{flex:1 0 auto;white-space:nowrap;margin:0;font-family:var(--display);font-weight:800;font-size:36px;line-height:1;color:var(--gold);text-shadow:0 4px 0 var(--wall-face)}
.hub-top h1 small{display:block;font-size:16px;color:var(--ink);text-shadow:none;font-weight:700;margin-top:4px;opacity:.9}
.hero-btn{flex:none;display:flex;align-items:center;gap:8px;border:0;border-radius:20px;background:rgba(42,36,82,.92);padding:4px 14px 4px 4px;box-shadow:0 0 0 3px var(--c,var(--gold)),0 5px 0 rgba(0,0,0,.3);font-family:var(--display);font-weight:800;font-size:18px}
.hero-btn img{width:46px;height:46px;border-radius:14px;object-fit:cover;object-position:top;background:var(--night-3)}
.coins{flex:none;background:rgba(42,36,82,.92);border-radius:999px;padding:8px 14px;font-family:var(--display);font-weight:800;font-size:20px;direction:ltr;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.worlds{display:flex;gap:14px;overflow-x:auto;padding:14px 6px 18px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.worlds::-webkit-scrollbar{display:none}
.wcard{flex:none;width:clamp(150px,calc(var(--sw) * .19),200px);aspect-ratio:3/4;border:0;border-radius:26px;position:relative;overflow:hidden;scroll-snap-align:center;padding:0;
  background:linear-gradient(170deg,var(--a),var(--b));box-shadow:0 0 0 4px rgba(255,255,255,.85),0 8px 0 var(--d),0 14px 26px rgba(0,0,0,.35);
  animation:wfloat 4s ease-in-out infinite;animation-delay:calc(var(--i) * -.7s);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:10px 8px 12px}
.wcard:active{transform:translateY(5px)!important;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 3px 0 var(--d)}
@keyframes wfloat{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-6px) rotate(.6deg)}}
.wcard::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:shine 5s ease-in-out infinite;animation-delay:calc(var(--i) * .8s);pointer-events:none}
@keyframes shine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.wcard .wem{position:absolute;top:10%;left:50%;transform:translateX(-50%);font-size:clamp(54px,calc(var(--sw) * .07),76px);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.2))}
.wcard .wnm{font-family:var(--display);font-weight:800;font-size:clamp(17px,calc(var(--sw) * .022),22px);line-height:1.1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);text-align:center}
.wcard .wst{font-size:20px;letter-spacing:1px;direction:ltr;line-height:1}
.wcard .wst i{font-style:normal}.wcard .wst i.off{filter:grayscale(1) brightness(1.4);opacity:.45}
.wcard .wbt{font-size:13px;font-weight:700;background:rgba(0,0,0,.28);color:#fff;border-radius:999px;padding:2px 10px;direction:ltr}
.wcard .wnew{position:absolute;top:10px;inset-inline-end:-30px;transform:rotate(35deg);background:#ff4d6d;color:#fff;font-weight:800;font-size:13px;padding:3px 34px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
[dir=rtl] .wcard .wnew{transform:rotate(-35deg)}
.wcard.locked{filter:saturate(.25) brightness(.75)}
.wcard .wlock{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;background:rgba(20,16,40,.35)}
.wcard.sel{box-shadow:0 0 0 5px var(--gold),0 8px 0 var(--d),0 14px 26px rgba(0,0,0,.35)}
#stage.short .hub-top h1{font-size:28px} #stage.short .hub-top h1 small{font-size:14px}
#stage.short .worlds{padding:10px 6px 14px} #stage.short .wcard{width:clamp(140px,calc(var(--sh) * .42),180px)}
/* world sheet */
.sheet{display:flex;gap:18px;align-items:center;width:100%;text-align:start}
.sheet .wbig{flex:none;width:170px;aspect-ratio:3/4;border-radius:26px;background:linear-gradient(170deg,var(--a),var(--b));display:grid;place-items:center;font-size:84px;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 8px 0 var(--d)}
.sheet .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.goals{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.goals li{display:flex;gap:8px;align-items:center;font-weight:700;font-size:16px}
.goals li i{font-style:normal;font-size:20px}.goals li.off i{filter:grayscale(1);opacity:.4}
#stage.short .sheet .wbig{width:120px;font-size:60px} #stage.short .card{gap:8px;padding:12px 16px} #stage.short .card h2{font-size:24px}
#stage.short .big-btn{font-size:20px;padding:8px 20px;min-width:160px} #stage.short .ghost-btn{padding:8px 14px;font-size:16px} #stage.short .goals li{font-size:14px}
#stage.short .bigstar{font-size:46px} #stage.short .tally span{padding:5px 12px;font-size:16px}
/* hero picker */
.heroes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;width:100%}
.hero{border:0;border-radius:20px;background:var(--night);padding:6px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 0 0 3px var(--night-3),0 5px 0 rgba(0,0,0,.3);transition:transform .15s}
.hero img{width:100%;aspect-ratio:3/4;object-fit:contain;object-position:bottom;display:block;border-radius:14px;background:radial-gradient(circle at 50% 70%,var(--c),transparent 70%)}
.hero b{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.15}
.hero.on{background:#4a3f8c;box-shadow:0 0 0 4px var(--gold),0 5px 0 rgba(0,0,0,.3);transform:translateY(-5px)}
.hero.on b{color:var(--gold)}
#stage.short .hero b{font-size:14px}
/* finish */
.stars3{display:flex;gap:10px;direction:ltr;font-size:58px;line-height:1}
.stars3 i{font-style:normal;transform:scale(0);animation:starPop .5s cubic-bezier(.2,1.6,.4,1) forwards;filter:drop-shadow(0 5px 0 rgba(0,0,0,.25))}
.stars3 i.off{filter:grayscale(1) brightness(.6);opacity:.5}
@keyframes starPop{to{transform:scale(1)}}
#stage.short .stars3{font-size:42px}
.newbest{color:var(--mint)!important;font-weight:800}
/* online */
.mp-cols{display:flex;gap:18px;width:100%;align-items:center;justify-content:center;flex-wrap:wrap}
.mp-col{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1 1 250px;min-width:0}
.mp-code{display:flex;gap:8px;direction:ltr;justify-content:center;align-items:center}
.mp-code b{width:54px;height:66px;border-radius:16px;background:var(--night);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--gold);box-shadow:inset 0 0 0 3px var(--night-3),0 4px 0 rgba(0,0,0,.3)}
.mp-code b.cur{box-shadow:inset 0 0 0 3px var(--gold),0 4px 0 rgba(0,0,0,.3)}
.mp-code .copy{width:54px;height:54px;border:0;border-radius:16px;background:var(--night-3);font-size:24px;box-shadow:0 4px 0 var(--wall-face);margin-inline-start:4px}
.mp-lbl{font-weight:700;color:var(--muted);font-size:15px}
.mp-msg{min-height:1.4em;font-weight:700;color:var(--pink)!important}
.keypad{display:grid;grid-template-columns:repeat(3,68px);gap:8px;direction:ltr;flex:none}
.keypad button{height:56px;border:0;border-radius:16px;background:var(--night-3);font-family:var(--display);font-weight:800;font-size:30px;line-height:1;box-shadow:0 4px 0 var(--wall-face)}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wall-face)}
.keypad .ok{background:var(--mint);color:#063d2a;box-shadow:0 4px 0 #2a9c74}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:360px}
.slot{background:var(--night);border-radius:18px;padding:7px;display:flex;align-items:center;gap:8px;box-shadow:inset 0 0 0 3px var(--c);min-height:66px;position:relative;text-align:start}
.slot img{width:52px;height:52px;border-radius:12px;flex:none;display:block;object-fit:cover;object-position:top;background:var(--night-3)}
.slot b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.15;color:var(--c);display:block}
.slot small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.slot .crown{position:absolute;top:-12px;inset-inline-end:-4px;font-size:22px}
.slot.empty{box-shadow:none;outline:3px dashed var(--night-3);outline-offset:-3px;justify-content:center;opacity:.7;font-size:26px}
.mpcd{position:absolute;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none;font-family:var(--display);font-weight:800;font-size:120px;line-height:1;color:var(--gold);text-shadow:0 7px 0 var(--wall-face),0 0 30px rgba(0,0,0,.35)}
.mpcd span{animation:pop2 .35s ease-out}
@keyframes pop2{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;direction:ltr;width:100%}
.pod{display:flex;flex-direction:column;align-items:center;gap:3px;width:112px;min-width:0}
.pod img{width:62px;height:62px;border-radius:16px;box-shadow:0 0 0 3px var(--c);display:block;object-fit:cover;object-position:top;background:var(--night-3)}
.pod b{font-family:var(--display);font-weight:800;font-size:17px;color:var(--c);line-height:1.2}
.pod span{font-weight:700;font-size:16px;direction:ltr}
.pod .blk{width:100%;border-radius:14px 14px 6px 6px;background:var(--c);display:grid;place-items:center;font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.rest{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:ltr}
.spin{display:inline-block;animation:spinL 1.2s linear infinite}

<script src="../world.js"></script>
<script type="module">
import * as THREE from '../adventure3d/three.module.min.js';
import { makeKit } from './kit.js';
import { WORLDS } from './levels.js';

const $ = s => document.querySelector(s);
{ const md = document.querySelector('meta[name="description"]'), dl = window.I18N && md && md.getAttribute('data-' + I18N.lang); if(dl) md.setAttribute('content', dl); }
const N = n => window.I18N ? I18N.num(n) : String(n);
const rawGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const rawSet = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
const K = makeKit(THREE);
const { Merge, G, canvasTex, glowTex, blobTex, HEROES, HERO_IDS, HERO_NAME, HERO_COLOR, poseHero } = K;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = a - b; while(d > Math.PI) d -= Math.PI * 2; while(d < -Math.PI) d += Math.PI * 2; return d; };
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const charImg = id => 'chars/' + (HEROES[id] ? id : 'sara') + '.png';

/* ---------- progress (this device) ---------- */
const SAVE_KEY = 'bobo_worlds';
let SAVE = (() => { try{ const v = JSON.parse(rawGet(SAVE_KEY)); if(v && typeof v === 'object' && v.w) return v; }catch(e){} return { w:{}, seen:{} }; })();
if(!SAVE.seen) SAVE.seen = {};
function persist(){ rawSet(SAVE_KEY, JSON.stringify(SAVE)); }
const rec = id => SAVE.w[id] || (SAVE.w[id] = { done:false, best:0, stars:[0, 0, 0], plays:0 });
const isUnlocked = i => i === 0 || !!(SAVE.w[WORLDS[i - 1].id] && SAVE.w[WORLDS[i - 1].id].done);
const starCount = id => { const r = SAVE.w[id]; return r ? r.stars.reduce((a, b) => a + (b ? 1 : 0), 0) : 0; };
function fmtTime(ms){ const s = Math.max(0, ms) / 1000, m = Math.floor(s / 60), r = s - m * 60; const rs = r.toFixed(1); return N(m) + ':' + N((r < 10 ? '0' : '') + rs); }
function fmtSec(s){ const m = Math.floor(s / 60), r = Math.round(s % 60); return N(m) + ':' + N((r < 10 ? '0' : '') + r); }

/* ---------- Always-landscape stage (same approach as the 3D adventure) ---------- */
const stage = $('#stage'), saProbe = $('#saProbe');
let ROT = false, VW = innerWidth, SW = innerWidth, SH = innerHeight, SAL = 0, SAB = 0;
function layout(){
  VW = innerWidth; const vh = innerHeight; ROT = vh > VW;
  SW = ROT ? vh : VW; SH = ROT ? VW : vh;
  const st = stage.style;
  st.width = SW + 'px'; st.height = SH + 'px';
  st.transform = ROT ? `translateX(${VW}px) rotate(90deg)` : 'none';
  st.setProperty('--sw', SW + 'px'); st.setProperty('--sh', SH + 'px');
  stage.classList.toggle('rot', ROT); stage.classList.toggle('short', SH <= 520);
  SAL = saProbe.offsetWidth; SAB = saProbe.offsetHeight;
}
function toLayer(cx, cy){ return ROT ? { x:cy, y:VW - cx } : { x:cx, y:cy }; }
function tryLandscapeLock(){ /* no system rotation: the game rotates itself inside the page, so the screen never flips back and forth */ }
layout(); tryLandscapeLock();

/* ---------- Sound (tiny synth, no files) ---------- */
let actx = null, muted = rawGet('adv3d_muted') === 'true';
function ac(){
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; } }
  if(actx && actx.state === 'suspended') actx.resume().catch(() => {});
  return actx;
}
function tone(freq, dur, type, vol, delay, toFreq){
  if(muted) return; const a = ac(); if(!a) return;
  const t0 = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if(toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
const SFX = {
  jump(){ tone(360, .16, 'sine', .1, 0, 720); }, djump(){ tone(520, .16, 'sine', .1, 0, 1040); },
  gem(){ [1046, 1318, 1568, 2093].forEach((f, i) => tone(f, .1, 'triangle', .09, i * .05)); },
  spring(){ tone(220, .35, 'sine', .13, 0, 990); }, bonk(){ tone(300, .14, 'square', .06, 0, 140); },
  splash(){ tone(600, .3, 'sine', .07, 0, 90); tone(300, .25, 'triangle', .05, .05, 80); },
  sizzle(){ tone(900, .25, 'sawtooth', .03, 0, 200); tone(200, .3, 'sine', .07, .02, 80); },
  poof(){ tone(500, .2, 'sine', .06, 0, 1200); },
  flag(){ [523, 659, 784].forEach((f, i) => tone(f, .16, 'triangle', .12, i * .08)); },
  crack(){ tone(180, .12, 'square', .04, 0, 90); },
  go(){ [440, 440, 880].forEach((f, i) => tone(f, .14, 'square', .07, i * .16)); },
  win(){ [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, .2, 'triangle', .14, i * .11)); },
  star(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, .14, 'triangle', .13, i * .07)); },
  help(){ [660, 880, 1100].forEach((f, i) => tone(f, .18, 'sine', .1, i * .1)); },
  wind(){ tone(200, .5, 'sine', .04, 0, 420); },
  tap(){ tone(520, .05, 'triangle', .08); }
};

/* ---------- Renderer ---------- */
const canvas = $('#cv');
let renderer;
try{ renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' }); }
catch(e){ $('#nogl').hidden = false; $('#overlay').hidden = true; throw e; }
let dpr = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(dpr);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc8ecff, 60, 210);
const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 800);
function resize(){
  layout();
  renderer.setSize(SW, SH, false);
  camera.aspect = SW / SH; camera.fov = SW < SH ? 70 : 58; camera.updateProjectionMatrix();
  placeJoyHome();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
const hemi = new THREE.HemisphereLight(0xe4f6ff, 0x6a7a9c, 1.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d0, 2.0); sun.position.set(30, 60, 20); scene.add(sun);
const sky = (() => {
  const g = new THREE.SphereGeometry(600, 24, 16), col = new Float32Array(g.attributes.position.count * 3);
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide, fog:false, depthWrite:false }));
  m.renderOrder = -1; scene.add(m); return m;
})();
function paintSky(top, hor, bot){
  const pa = sky.geometry.attributes.position, c = sky.geometry.attributes.color, a = new THREE.Color(top), h = new THREE.Color(hor), b = new THREE.Color(bot), t = new THREE.Color();
  for(let i = 0; i < pa.count; i++){ const y = pa.getY(i) / 600; if(y >= 0) t.copy(h).lerp(a, clamp(Math.pow(y, .7) * 1.4, 0, 1)); else t.copy(h).lerp(b, clamp(-y * 2.2, 0, 1)); c.setXYZ(i, t.r, t.g, t.b); }
  c.needsUpdate = true;
}
const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, fog:false, depthWrite:false, transparent:true, blending:THREE.AdditiveBlending, color:0xfff2c0 }));
sunGlow.scale.set(140, 140, 1); scene.add(sunGlow);

/* ---------- Particles + confetti (instanced) ---------- */
const PMAX = 220, parts = [], pMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.1, 0), new THREE.MeshBasicMaterial(), PMAX);
pMesh.frustumCulled = false; scene.add(pMesh);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _v = new THREE.Vector3(), _c = new THREE.Color();
for(let i = 0; i < PMAX; i++){ parts.push({ life:0, x:0, y:0, z:0, vx:0, vy:0, vz:0, s:1, g:12 }); pMesh.setColorAt(i, _c.set(0xffffff)); _m.makeScale(0, 0, 0); pMesh.setMatrixAt(i, _m); }
let pNext = 0;
const pick = a => a[Math.floor(Math.random() * a.length)];
function burst(x, y, z, n, colors, speed = 4, size = 1, grav = 12, up = 2){
  for(let k = 0; k < n; k++){
    const p = parts[pNext], i = pNext; pNext = (pNext + 1) % PMAX;
    const a = Math.random() * 6.28, u = Math.random() * 2 - 1, r = Math.sqrt(1 - u * u);
    p.life = .6 + Math.random() * .5; p.x = x; p.y = y; p.z = z; p.vx = Math.cos(a) * r * speed; p.vz = Math.sin(a) * r * speed; p.vy = Math.abs(u) * speed + up; p.s = size * (.7 + Math.random() * .8); p.g = grav;
    pMesh.setColorAt(i, _c.set(pick(colors)));
  }
  pMesh.instanceColor.needsUpdate = true;
}
function updateParts(dt){
  for(let i = 0; i < PMAX; i++){
    const p = parts[i]; if(p.life <= 0) continue;
    p.life -= dt; p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    const s = p.life > 0 ? p.s * Math.min(1, p.life * 3) : 0;
    _m.compose(_v.set(p.x, p.y, p.z), _q.identity(), _s.set(s, s, s)); pMesh.setMatrixAt(i, _m);
  }
  pMesh.instanceMatrix.needsUpdate = true;
}
const CMAX = 160, confetti = [], cMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(.22, .13), new THREE.MeshBasicMaterial({ side:THREE.DoubleSide }), CMAX);
cMesh.frustumCulled = false; scene.add(cMesh);
for(let i = 0; i < CMAX; i++){ confetti.push({ life:0 }); cMesh.setColorAt(i, _c.set(0xffffff)); _m.makeScale(0, 0, 0); cMesh.setMatrixAt(i, _m); }
const CONF_COL = [0xff5d73, 0xffcd4d, 0x5fe3b1, 0x5fb8ff, 0xb28dff, 0xffffff];
function confettiAt(x, y, z, n = CMAX){
  for(let i = 0; i < Math.min(n, CMAX); i++){
    const c = confetti[i], a = Math.random() * 6.28, sp = 2 + Math.random() * 5;
    Object.assign(c, { life:3 + Math.random() * 2, x, y, z, vx:Math.cos(a) * sp, vz:Math.sin(a) * sp, vy:6 + Math.random() * 7, rx:Math.random() * 6, ry:Math.random() * 6, sp:4 + Math.random() * 8 });
    cMesh.setColorAt(i, _c.set(pick(CONF_COL)));
  }
  cMesh.instanceColor.needsUpdate = true;
}
function updateConfetti(dt){
  for(let i = 0; i < CMAX; i++){
    const c = confetti[i];
    if(c.life <= 0){ continue; }
    c.life -= dt; c.vy = Math.max(c.vy - 9 * dt, -2.2); c.vx *= 1 - dt * .8; c.vz *= 1 - dt * .8;
    c.x += c.vx * dt + Math.sin(c.life * 3 + i) * dt; c.y += c.vy * dt; c.z += c.vz * dt; c.rx += c.sp * dt; c.ry += c.sp * .7 * dt;
    const s = c.life > 0 ? Math.min(1, c.life) : 0;
    _m.compose(_v.set(c.x, c.y, c.z), _q.setFromEuler(_e.set(c.rx, c.ry, 0)), _s.set(s, s, s)); cMesh.setMatrixAt(i, _m);
  }
  cMesh.instanceMatrix.needsUpdate = true;
}

/* ---------- Blob shadow ---------- */
const blobGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
const blobMat = new THREE.MeshBasicMaterial({ map:blobTex, transparent:true, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-4 });
const pShadow = new THREE.Mesh(blobGeo, blobMat); pShadow.renderOrder = 2; scene.add(pShadow);

/* ---------- Heroes ---------- */
const heroes = {};
function heroModel(id){ if(!heroes[id]){ heroes[id] = HEROES[id](); scene.add(heroes[id].grp); } return heroes[id]; }
let heroId = HERO_IDS.includes(rawGet('worlds_hero')) ? rawGet('worlds_hero') : 'sara', hero = null;
function setHero(id, save){
  if(!HEROES[id]) return;
  heroId = id; if(save) rawSet('worlds_hero', id);
  for(const k in heroes) heroes[k].grp.visible = false;
  hero = heroModel(id); hero.grp.visible = true;
}
setHero(heroId, false);

/* ======================================================================
   World building. Every world (levels.js) is built with this small kit:
   platforms (box / round), movers, crumbling + blinking tiles, springs,
   spinning bars, swinging logs, fans, conveyor belts, checkpoints, gems,
   the finish pad. Platforms on the main route are "path" nodes, in order.
   ====================================================================== */
let WG = null;                 // THREE.Group with everything of the current world
let WD = null;                 // world data (colliders, path, hazards…)
let worldIdx = 0;
const PR = .42;
function blankWorld(){ return { cols:[], path:[], movers:[], tiles:[], bars:[], logs:[], fans:[], belts:[], cps:[], gems:[], signs:[], finish:null, start:null, sections:0, helps:[], anim:[], dispose:[] }; }

function makeBuilder(def){
  const W = new Merge(), B = { section:0, G, THREE, rnd, def, W };
  const D = WD;
  const theme = def.theme;
  const capOf = c => new THREE.Color(c).lerp(new THREE.Color(0xffffff), .28).getHex();
  function addCol(c){ c.solid = true; c.section = B.section; D.cols.push(c); return c; }
  function pathNode(c, o){ if(o.path === false) return; c.pi = D.path.length; D.path.push(c); }
  function boxMesh(M, x, top, z, w, d, h, col, cap){
    M.add(G.box, x, top - h / 2 - .06, z, w, h - .12, d, 0, 0, 0, col);
    M.add(G.box, x, top - .07, z, w + .12, .14, d + .12, 0, 0, 0, cap);
  }
  function roundMesh(M, x, top, z, r, h, col, cap){
    M.add(G.cyl, x, top - h / 2 - .06, z, r, h - .12, r, 0, 0, 0, col);
    M.add(G.cyl, x, top - .07, z, r + .07, .14, r + .07, 0, 0, 0, cap);
  }
  B.add = (geo, x, y, z, sx, sy, sz, rx, ry, rz, col) => { W.add(typeof geo === 'string' ? G[geo] : geo, x, y, z, sx, sy, sz, rx, ry, rz, col); return B; };
  /* static platforms */
  B.box = (x, top, z, w, d, o = {}) => {
    const h = o.h || 1.2, col = o.col != null ? o.col : theme.plat, cap = o.cap != null ? o.cap : (o.kind === 'ice' ? 0xdff6ff : theme.cap != null ? theme.cap : capOf(col));
    if(!o.invisible) boxMesh(W, x, top, z, w, d, h, col, cap);
    const c = addCol({ type:'box', x0:x - w / 2, x1:x + w / 2, z0:z - d / 2, z1:z + d / 2, y0:top - h, y1:top, cx:x, cz:z, w, d, kind:o.kind || null, cam:!!o.cam });
    pathNode(c, o); return c;
  };
  B.round = (x, top, z, r, o = {}) => {
    const h = o.h || 1.2, col = o.col != null ? o.col : theme.plat, cap = o.cap != null ? o.cap : (theme.cap != null ? theme.cap : capOf(col));
    if(!o.invisible) roundMesh(W, x, top, z, r, h, col, cap);
    const c = addCol({ type:'cyl', x, z, cx:x, cz:z, r, y0:top - h, y1:top, kind:o.kind || null, cam:!!o.cam });
    pathNode(c, o); return c;
  };
  /* moving platform: axis 'x' | 'y' | 'z', amp, speed (rad/s), ph */
  B.mover = (x, top, z, w, d, o = {}) => {
    const h = o.h || .7, col = o.col != null ? o.col : theme.mover, M = new Merge();
    if(o.round) roundMesh(M, 0, 0, 0, w / 2, h, col, capOf(col)); else boxMesh(M, 0, 0, 0, w, d, h, col, capOf(col));
    const mesh = new THREE.Mesh(M.geometry(), new THREE.MeshLambertMaterial({ vertexColors:true })); WG.add(mesh);
    const c = addCol(o.round ? { type:'cyl', x, z, r:w / 2, y0:top - h, y1:top } : { type:'box', x0:0, x1:0, z0:0, z1:0, y0:top - h, y1:top, w, d });
    Object.assign(c, { cx:x, cz:z, dx:0, dy:0, dz:0, moving:true, h, base:[x, top, z] });
    const m = { c, mesh, axis:o.axis || 'x', amp:o.amp || 2, speed:o.speed || 1, ph:o.ph || 0, a:0, section:B.section, mult:1 };
    D.movers.push(m); placeMover(m, true); pathNode(c, o); return c;
  };
  /* crumbling tile: shakes when stepped on, drops, comes back. blinking tile: on/off on a timer */
  B.crumble = (x, top, z, w, d, o = {}) => {
    const c = addCol({ type:'box', x0:x - w / 2, x1:x + w / 2, z0:z - d / 2, z1:z + d / 2, y0:top - .6, y1:top, cx:x, cz:z, w, d });
    D.tiles.push({ c, kind:'crumble', x, top, z, w, d, st:0, t:0, col:o.col != null ? o.col : theme.crumble, section:B.section, mult:1 });
    pathNode(c, o); return c;
  };
  B.blink = (x, top, z, w, d, o = {}) => {
    const c = addCol({ type:'box', x0:x - w / 2, x1:x + w / 2, z0:z - d / 2, z1:z + d / 2, y0:top - .6, y1:top, cx:x, cz:z, w, d });
    D.tiles.push({ c, kind:'blink', x, top, z, w, d, period:o.period || 4, on:o.on || 2.6, off:o.offset || 0, a:0, col:o.col != null ? o.col : theme.blink, section:B.section, mult:1 });
    pathNode(c, o); return c;
  };
  /* bouncy pad (mushroom, jelly…): power = jump speed */
  B.spring = (x, top, z, r, power, o = {}) => {
    const M = new Merge(), col = o.col != null ? o.col : theme.spring, h = o.h || 1;
    if(o.mushroom){
      M.add(G.cyl, 0, -h * .5 - .2, 0, r * .32, h + .6, r * .32, 0, 0, 0, 0xfff1dc);
      M.add(G.hemi, 0, -.36, 0, r, .62, r, 0, 0, 0, col);
      for(let i = 0; i < 6; i++){ const a = i * 1.05 + .3, rr = r * (i % 2 ? .55 : .75); M.add(G.sph, Math.cos(a) * rr, -.36 + Math.sqrt(Math.max(0, 1 - (rr / r) ** 2)) * .62 - .02, Math.sin(a) * rr, .2 * r / 1.6, .07, .2 * r / 1.6, 0, 0, 0, 0xffffff); }
      M.add(G.sph, 0, .2, 0, .25 * r / 1.6, .06, .25 * r / 1.6, 0, 0, 0, 0xffffff);
    } else { roundMesh(M, 0, 0, 0, r, h, col, capOf(col)); }
    const mesh = new THREE.Mesh(M.geometry(), new THREE.MeshLambertMaterial({ vertexColors:true })); mesh.position.set(x, top, z); WG.add(mesh);
    const c = addCol({ type:'cyl', x, z, cx:x, cz:z, r, y0:top - h, y1:top, kind:'spring', power, mesh });
    D.anim.push({ c, mesh, sq:0, sqv:0 });
    pathNode(c, o); return c;
  };
  /* spinning bar hazard around (cx, cz) at height y; len = arm length; both = two arms */
  B.bar = (cx, y, cz, len, speed, o = {}) => {
    const grp = new THREE.Group(); grp.position.set(cx, y, cz); WG.add(grp);
    const M = new Merge(), col = o.col != null ? o.col : theme.hazard;
    M.add(G.cyl8, 0, -.25, 0, .35, .7, .35, 0, 0, 0, 0x5a5470);
    const both = o.both !== false;
    M.add(G.cyl, both ? 0 : len / 2, 0, 0, .26, both ? len * 2 : len, .26, 0, 0, Math.PI / 2, col);

function step(dt){
  T += dt;
  updateDyn(dt);
  const SPEED = PHYS.speed;
  const ice = P.ground && P.ground.kind === 'ice';
  const acc = P.grounded ? (ice ? PHYS.accIce : PHYS.accG) : PHYS.accA;
  const wx = inp.x, wz = inp.z, m = inp.m;
  if(P.knock > 0){ P.knock -= dt; }
  else {
    P.vx += (wx * SPEED - P.vx) * Math.min(1, acc * dt);
    P.vz += (wz * SPEED - P.vz) * Math.min(1, acc * dt);
  }
  P.move = m;
  if(m > 0) P.face += angDiff(Math.atan2(wx, wz), P.face) * Math.min(1, 12 * dt);
  if(m > 0 || jumpQueued){ if(!run.started && state === 'play' && !mpActive()){ run.started = true; } }
  // ride moving platforms + belts
  if(P.ground && P.ground.moving){ P.x += P.ground.dx; P.y += P.ground.dy; P.z += P.ground.dz; }
  if(P.grounded && P.ground && P.ground.kind === 'belt'){ P.x += P.ground.belt[0] * dt; P.z += P.ground.belt[1] * dt; }
  P.x += P.vx * dt; P.z += P.vz * dt;
  pushOut();
  // jump: buffered, coyote time, double jump
  P.coyote -= dt; P.buf -= dt;
  if(jumpQueued){ P.buf = PHYS.buffer; jumpQueued = false; }
  if(P.buf > 0){
    if(P.grounded || (P.coyote > 0 && P.jumps === 0)){ P.vy = PHYS.jump; P.jumps = 1; P.grounded = false; P.ground = null; P.coyote = 0; P.buf = 0; P.sq = .25; P.sqv = 0; SFX.jump(); }
    else if(P.jumps < 2){ P.vy = PHYS.djump; P.jumps = 2; P.buf = 0; P.flip = 1; P.usedDouble = true; SFX.djump(); burst(P.x, P.y + .2, P.z, 6, [0xffffff, 0xfff2b0], 2.5, .8); }
  }
  // fans
  for(const f of WD.fans){
    const dx = P.x - f.x, dz = P.z - f.z;
    if(dx * dx + dz * dz < f.r * f.r && P.y > f.y - .5 && P.y < f.top){
      P.vy = Math.min(P.vy + f.power * dt + PHYS.grav * dt, 8.5);
      if(P.jumps === 0) P.jumps = 1;
      if(!P.inFan){ P.inFan = true; SFX.wind(); }
    } else if(P.inFan && !(dx * dx + dz * dz < f.r * f.r)) P.inFan = false;
  }
  const prevY = P.y;
  P.vy = Math.max(P.vy - PHYS.grav * dt, -30);
  P.y += P.vy * dt;
  ceiling(prevY);
  const gi = groundInfo(P.x, P.z, Math.max(prevY, P.y), PR), wasG = P.grounded;
  if(P.vy <= 0 && (P.y <= gi.h || (wasG && P.y - gi.h < .5 && !(P.ground && P.ground.kind === 'spring')))){
    if(!wasG && P.vy < -5){ P.sq = -clamp(-P.vy / 40, .1, .3); P.sqv = 0; }
    P.y = gi.h; P.vy = 0; P.grounded = true; P.jumps = 0; P.ground = gi.ref; P.coyote = PHYS.coyote; P.usedDouble = false;
    const g = gi.ref; P.landed = g;
    if(g.kind === 'spring'){
      P.vy = g.power + (jumpHeld || P.buf > 0 ? 2.5 : 0); P.buf = 0; P.grounded = false; P.jumps = 1; P.ground = null; P.sq = .35; SFX.spring();
      burst(P.x, P.y, P.z, 10, [0xff5d8f, 0xffffff], 4);
      const a = WD.anim.find(a => a.c === g); if(a){ a.sq = -.35; a.sqv = 0; }
    }
    if(!SIM){
      if(g.cp != null && g.cp > cp) reachCp(g.cp);
      if(g.pi != null && g.pi > run.maxPi) run.maxPi = g.pi;
      if(g.finish) reachFinish();
    }
    for(const k of WD.tiles) if(k.c === g && k.kind === 'crumble' && k.st === 0){ k.st = 1; k.t = 0; SFX.crack(); }
  } else { P.grounded = false; P.ground = null; }
  // hazards: spinning bars, swinging logs
  hazards();
  // falling
  if(SIM) return;
  if(P.y < WD.killY || (WD.fallLimit && P.y < WD.cps[cp].top - WD.fallLimit)) respawn(WD.death);

}
function knock(dx, dz, up){
  const d = Math.hypot(dx, dz) || 1;
  P.vx = dx / d * 9; P.vz = dz / d * 9; P.vy = Math.max(P.vy, up || 6); P.grounded = false; P.ground = null; P.knock = .35; P.jumps = 1;
  SFX.bonk(); burst(P.x, P.y + .7, P.z, 8, [0xffffff, 0xffd23f], 3, .8);
}
function hazards(){
  for(const b of WD.bars){
    if(P.y > b.y + .3 || P.y + 1.05 < b.y - .3) continue;
    const ax = Math.cos(b.a), az = -Math.sin(b.a);   // arm direction (rotation.y = a rotates +x toward -z)
    const dx = P.x - b.cx, dz = P.z - b.cz;
    let t = dx * ax + dz * az; t = clamp(t, b.both ? -b.len : 0, b.len);
    const px = b.cx + ax * t, pz = b.cz + az * t, ex = P.x - px, ez = P.z - pz;
    if(ex * ex + ez * ez < (PR + .3) ** 2 && t !== 0){
      const s = Math.sign(b.speed) * Math.sign(t || 1);     // tangential push direction
      knock(-az * s * 1 + ex * .5, ax * s * 1 + ez * .5, 6.5);
    }
  }
  for(const l of WD.logs){
    const s = Math.sin(l.ang), c = Math.cos(l.ang);
    const lx = l.axis === 'x' ? l.px - s * l.rope : l.px, lz = l.axis === 'x' ? l.pz : l.pz + s * l.rope, ly = l.py - c * l.rope;
    if(P.y > ly + .5 || P.y + 1.05 < ly - .5) continue;
    if(l.axis === 'x'){
      if(Math.abs(P.z - lz) > l.len / 2 + PR || Math.abs(P.x - lx) > .45 + PR) continue;
      const v = Math.cos(l.a) * l.speed;                 // swing velocity sign
      knock(-(v === 0 ? 1 : Math.sign(v)) * 1, 0, 6);
    } else {
      if(Math.abs(P.x - lx) > l.len / 2 + PR || Math.abs(P.z - lz) > .45 + PR) continue;
      const v = Math.cos(l.a) * l.speed;
      knock(0, (v === 0 ? 1 : Math.sign(v)), 6);
    }
  }
}
function interact(){
  const cy = P.y + .6;
  WD.gems.forEach((g, i) => {
    if(g.got) return;
    const dx = g.x - P.x, dy = g.y - cy, dz = g.z - P.z;
    if(dx * dx + dy * dy + dz * dz < 1.5){ g.got = true; run.gems++; SFX.gem(); burst(g.x, g.y, g.z, 14, [0x59e0ff, 0xffffff, 0xb28dff], 4); hud(); if(!mpActive()) say(run.gems === 3 ? LINES.allGems : LINES.gem); }
  });
  if(!mpActive()) for(const s of WD.signs){
    if(s.done) continue;
    if((s.x - P.x) ** 2 + (s.z - P.z) ** 2 < s.r * s.r){ s.done = true; say(LINES[s.key] || s.key); }
  }
}
function reachCp(i){
  cp = i; const c = WD.cps[i];
  SFX.flag(); burst(c.x, c.top + 2.6, c.z, 14, [0xffcd4d, 0xffffff, 0x8ff0c4], 3);
  if(!mpActive()) say(i === 1 && worldIdx === 0 ? LINES.cp1 : pick(LINES.cp));

/* ---------- auto-help: after 5 falls in one section, golden stepping stones appear + a hint arrow ---------- */
function giveHelp(sec){
  run.helped[sec] = true;
  const nodes = WD.path.filter(c => c.section === sec);
  const next = WD.path.find(c => c.section === sec + 1); if(next) nodes.push(next);
  let made = 0;
  const M = new Merge();
  for(let k = 0; k + 1 < nodes.length; k++){
    const a = nodes[k], b = nodes[k + 1];
    const ax = a.moving ? a.base[0] : a.cx, az = a.moving ? a.base[2] : a.cz, at = a.moving ? a.base[1] : a.y1;
    const bx = b.moving ? b.base[0] : b.cx, bz = b.moving ? b.base[2] : b.cz, bt = b.moving ? b.base[1] : b.y1;
    const gap = Math.hypot(bx - ax, bz - az) - halfSize(a) - halfSize(b);
    if(gap < 1.0 && Math.abs(bt - at) < 1.2) continue;
    const n = gap > 4 ? 2 : 1;
    for(let j = 1; j <= n; j++){
      const t = j / (n + 1), x = lerp(ax, bx, t), z = lerp(az, bz, t), top = lerp(at, bt, t) - (a.kind === 'spring' ? 0 : 0);
      const w = 1.9;
      if(WD.cols.some(c => c.solid && Math.abs(c.y1 - top) < 1.2 && overlaps(c, x, z, w / 2))) continue;
      M.add(G.box, x, top - .25, z, w, .5, w, 0, 0, 0, 0xffffff);
      const c = { type:'box', x0:x - w / 2, x1:x + w / 2, z0:z - w / 2, z1:z + w / 2, y0:top - .5, y1:top, cx:x, cz:z, w, d:w, solid:true, section:sec, help:true };
      WD.cols.push(c); made++;
    }
  }
  if(made){ const mesh = new THREE.Mesh(M.geometry(), helpMat.clone()); WG.add(mesh); WD.helps.push({ mesh }); }
  [...WD.movers, ...WD.bars, ...WD.logs, ...WD.tiles].forEach(o => { if(o.section === sec) o.mult = .55; });
  run.hint = true;
  SFX.help(); say(LINES.help, 4200);
}
function halfSize(c){ return c.type === 'cyl' ? c.r : Math.min(c.w, c.d) / 2; }
function overlaps(c, x, z, h){
  if(c.type === 'box') return x + h > c.x0 && x - h < c.x1 && z + h > c.z0 && z - h < c.z1;
  return Math.hypot(clamp(c.x, x - h, x + h) - c.x, clamp(c.z, z - h, z + h) - c.z) < c.r && Math.hypot(x - c.x, z - c.z) < c.r + h;
}

/* ---------- Input ---------- */
const keys = {};
const joy = { x:0, y:0, id:null, ox:0, oy:0 }, look = { id:null, x:0, y:0 };
const joyEl = $('#joy'), knob = $('#knob'), jumpBtn = $('#btnJump');
let joyHome = [90, 0];
function placeJoyHome(){ joyHome = [Math.max(84, SAL + 78), SH - Math.max(92, SH * .16) - SAB * .5]; if(joy.id == null) setJoy(joyHome[0], joyHome[1]); }
function setJoy(x, y){ joyEl.style.left = x + 'px'; joyEl.style.top = y + 'px'; }
const touch = $('#touch');
touch.addEventListener('pointerdown', e => {
  if(state !== 'play') return;
  e.preventDefault();
  const p = toLayer(e.clientX, e.clientY);
  if(p.x < SW * .45 && joy.id == null){
    joy.id = e.pointerId; joy.ox = clamp(p.x, Math.max(70, SAL + 64), SW * .45); joy.oy = clamp(p.y, 140, SH - 70);
    setJoy(joy.ox, joy.oy); joyEl.classList.add('on'); moveJoy(p.x, p.y);
  } else if(look.id == null){ look.id = e.pointerId; look.x = p.x; look.y = p.y; }
  try{ touch.setPointerCapture(e.pointerId); }catch(err){}
});
function moveJoy(x, y){
  let dx = x - joy.ox, dy = y - joy.oy; const d = Math.hypot(dx, dy), m = 52;
  if(d > m){ dx *= m / d; dy *= m / d; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  joy.x = dx / m; joy.y = dy / m;
}
touch.addEventListener('pointermove', e => {
  const p = toLayer(e.clientX, e.clientY);
  if(e.pointerId === joy.id) moveJoy(p.x, p.y);
  else if(e.pointerId === look.id){ cam.yaw -= (p.x - look.x) * .0075; cam.pitch = clamp(cam.pitch + (p.y - look.y) * .004, .08, 1.1); look.x = p.x; look.y = p.y; cam.dragT = T; }
});
function endPtr(e){
  if(e.pointerId === joy.id){ joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; joyEl.classList.remove('on'); setJoy(...joyHome); }
  if(e.pointerId === look.id) look.id = null;
}
touch.addEventListener('pointerup', endPtr); touch.addEventListener('pointercancel', endPtr);
jumpBtn.addEventListener('pointerdown', e => { e.preventDefault(); jumpQueued = true; jumpHeld = true; jumpBtn.classList.add('on'); ac(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => jumpBtn.addEventListener(t, () => { jumpBtn.classList.remove('on'); jumpHeld = false; }));
const KEYMAP = { KeyW:'f', ArrowUp:'f', KeyS:'b', ArrowDown:'b', KeyA:'l', ArrowLeft:'l', KeyD:'r', ArrowRight:'r', KeyQ:'cl', KeyE:'cr' };
addEventListener('keydown', e => {
  if(KEYMAP[e.code]){ keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  if(e.code === 'Space'){ if(!e.repeat) jumpQueued = true; jumpHeld = true; e.preventDefault(); }
  if((e.code === 'Escape' || e.code === 'KeyP') && state === 'play') showPause();
});
addEventListener('keyup', e => { if(KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; if(e.code === 'Space') jumpHeld = false; });
addEventListener('blur', () => { for(const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if(document.hidden && state === 'play') showPause(); });
function clearInput(){ joy.id = null; joy.x = joy.y = 0; look.id = null; knob.style.transform = ''; joyEl.classList.remove('on'); for(const k in keys) keys[k] = false; jumpQueued = false; jumpHeld = false; }
function readInput(dt){
  let ix = joy.x + (keys.r ? 1 : 0) - (keys.l ? 1 : 0), iy = joy.y + (keys.b ? 1 : 0) - (keys.f ? 1 : 0);
  let m = Math.hypot(ix, iy); if(m > 1){ ix /= m; iy /= m; m = 1; } if(m < .12){ ix = iy = 0; m = 0; }
  if(keys.cl) cam.yaw += 2.2 * dt; if(keys.cr) cam.yaw -= 2.2 * dt;
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  inp.x = rx * ix - fx * iy; inp.z = rz * ix - fz * iy; inp.m = m;
}

/* ---------- Camera ---------- */
const cam = { yaw:0, pitch:.38, dist:7.6, dragT:-9, tx:0, ty:0, tz:0 };
let snapCam = true;
const camPos = new THREE.Vector3();
function orbitYaw(){ const o = WD.def.camOrbit; return Math.atan2(P.x - o.x, P.z - o.z) - (o.lead || .8); }
function rayBlock(ox, oy, oz, dx, dy, dz, max){
  let best = max;
  for(const c of WD.cols){
    if(!c.cam) continue;
    let lo, hi;
    if(c.type === 'box'){ lo = [c.x0, c.y0, c.z0]; hi = [c.x1, c.y1, c.z1]; } else { lo = [c.x - c.r * .8, c.y0, c.z - c.r * .8]; hi = [c.x + c.r * .8, c.y1, c.z + c.r * .8]; }
    let tmin = 0, tmax = best; const o = [ox, oy, oz], d = [dx, dy, dz]; let ok = true;
    for(let a = 0; a < 3; a++){
      if(Math.abs(d[a]) < 1e-8){ if(o[a] < lo[a] || o[a] > hi[a]){ ok = false; break; } }
      else { let t1 = (lo[a] - o[a]) / d[a], t2 = (hi[a] - o[a]) / d[a]; if(t1 > t2){ const s = t1; t1 = t2; t2 = s; } tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2); if(tmin > tmax){ ok = false; break; } }
    }
    if(ok && tmin > .05 && tmin < best) best = tmin;
  }
  return best;
}
function updateCamera(dt){
  if(T - cam.dragT > 1.4){
    if(WD.def.camOrbit){ cam.yaw += angDiff(orbitYaw(), cam.yaw) * Math.min(1, dt * 2.2); }
    else if(P.move > .3){
      const want = Math.atan2(-Math.sin(P.face), -Math.cos(P.face)), d = angDiff(want, cam.yaw);
      if(Math.abs(d) < 2.4) cam.yaw += d * Math.min(1, dt * 1.2 * P.move);
    }
  }
  const k = snapCam ? 1 : 1 - Math.exp(-10 * dt);
  cam.tx = lerp(cam.tx, P.x, k); cam.ty = lerp(cam.ty, P.y + 1.1, snapCam ? 1 : 1 - Math.exp(-6 * dt)); cam.tz = lerp(cam.tz, P.z, k);
  const pitch = cam.pitch, dist = cam.dist;
  const dx = Math.sin(cam.yaw) * Math.cos(pitch), dy = Math.sin(pitch), dz = Math.cos(cam.yaw) * Math.cos(pitch);
  const t = rayBlock(cam.tx, cam.ty, cam.tz, dx, dy, dz, dist), dd = Math.max(1.4, t - .35);
  const x = cam.tx + dx * dd, z = cam.tz + dz * dd, y = Math.max(cam.ty + dy * dd, P.y + .5, WD.def.theme.floor.y + .8);
  if(snapCam){ camPos.set(x, y, z); snapCam = false; } else camPos.lerp(_v.set(x, y, z), 1 - Math.exp(-12 * dt));
  camera.position.copy(camPos); camera.lookAt(cam.tx, cam.ty + .25, cam.tz);
}

function animate(dt){

    pShadow.position.set(P.x, gh + .03, P.z); pShadow.scale.set(ss, 1, ss); pShadow.visible = gh > -1e8 && hh < 30 && (state === 'play' || state === 'pause' || state === 'won');

   No names, no chat, no free text: a player is a hero + a colour badge.
   Events: pos (positions), start (host starts the race in a world), fin (a player

   ====================================================================== */
const MP_URL = 'https://vgpwtrzplggvlsuvqsas.supabase.co', MP_KEY = 'sb_publishable_D9thEhZlZnfn0t06j8h1Rw_H-LVF786';
const MP_EVENTS = ['pos', 'start', 'fin', 'end'];

const MP_COLORS = ['#ff5d73', '#5fb8ff', '#5fe3b1', '#ffd23f'];

function loadSupabase(){
  if(window.supabase && window.supabase.createClient) return Promise.resolve();
  if(loadSupabase.p) return loadSupabase.p;
  return (loadSupabase.p = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = '../supabase.js';
    s.onload = () => (window.supabase && window.supabase.createClient) ? res() : rej(new Error('no client'));
    s.onerror = () => { loadSupabase.p = null; s.remove(); rej(new Error('load')); };
    document.head.appendChild(s);
  }));
}
class SupabaseTransport{
  async open(code, id, h){
    if(navigator.onLine === false) throw new Error('offline');
    await loadSupabase();
    if(!SupabaseTransport.client) SupabaseTransport.client = window.supabase.createClient(MP_URL, MP_KEY, {
      auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false }, realtime:{ params:{ eventsPerSecond:40 } } });
    const sb = SupabaseTransport.client;
    const ch = this.ch = sb.channel('bobo-worlds-' + code, { config:{ broadcast:{ self:false, ack:false }, presence:{ key:id, enabled:true } } });
    ch.on('presence', { event:'sync' }, () => {
      const st = ch.presenceState(), list = [];
      for(const k in st){ const m = st[k]; if(m && m.length) list.push(Object.assign({}, m[m.length - 1], { id:k })); }
      h.presence(list);
    });
    MP_EVENTS.forEach(ev => ch.on('broadcast', { event:ev }, m => h.msg(ev, m && m.payload)));
    await new Promise((res, rej) => {
      let first = true;
      const to = setTimeout(() => { if(first){ first = false; rej(new Error('timeout')); } }, 9000);
      ch.subscribe(status => {
        if(status === 'SUBSCRIBED'){ if(first){ first = false; clearTimeout(to); res(); } else h.status('up'); }
        else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){
          if(first){ first = false; clearTimeout(to); rej(new Error(status)); } else if(!this.closed) h.status('down');
        }
      });

async function mpCreate(){

/* ---------- Main loop ---------- */
let last = performance.now(), fpsN = 0, fpsT = 0, fps = 60, slowT = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if(dt > .05) dt = .05; if(dt <= 0) dt = .001;
  fpsN++; fpsT += dt;
  if(fpsT >= 1){
    fps = fpsN / fpsT; fpsN = 0; fpsT = 0;
    if(state === 'play' && fps < 42 && dpr > 1){ slowT++; if(slowT >= 2){ dpr = Math.max(1, dpr - .25); renderer.setPixelRatio(dpr); renderer.setSize(SW, SH, false); slowT = 0; } } else slowT = 0;
  }
  if(!WD){ renderer.render(scene, camera); return; }
  if(state === 'play'){
    if(mpFrozen()){ P.move = 0; T += dt; updateDyn(dt); }
    else {
      readInput(dt);
      let rest = dt; while(rest > 0){ const h = Math.min(rest, 1 / 60); step(h); rest -= h; }
      if(run.started && !run.over) run.t += dt;
    }
    updateCamera(dt); hudFrame();
  } else if(state === 'won'){
    T += dt; updateDyn(dt);
    const f = WD.finish, a = T * .5;
    camPos.lerp(_v.set(f.x + Math.sin(a) * 9, f.top + 4.5, f.z + Math.cos(a) * 9), 1 - Math.exp(-3 * dt));
    camera.position.copy(camPos); camera.lookAt(P.x, P.y + 1, P.z);
  } else if(state === 'pause' || (state === 'select' && selFrom === 'pause') || (state === 'mp' && MP.screen === 'end')){
    // frozen game behind the menu
  } else {
    // hub / sheet / menus: slow fly-around of the world
    T += dt; updateDyn(dt); hubCamT += dt;
    const o = WD.def.view, a = hubCamT * .08 + (o.a || 0);
    camera.position.set(o.x + Math.sin(a) * o.r, o.y, o.z + Math.cos(a) * o.r); camera.lookAt(o.x, o.ly, o.z);
  }
  animate(dt);
  mpFrame(dt);
  sky.position.copy(camera.position);
  sunGlow.position.copy(camera.position).add(_v.set(160, 200, -280));
  renderer.render(scene, camera);
}

/* ---------- test hook ---------- */
function simJump(i, opts = {}){
  /* Bot check with the real physics: stand on path node i, walk toward node i+1, jump at the edge (double jump only if needed).
     Tries several start times (moving pieces). Returns { ok, wait, dbl } */
  const A = WD.path[i], Bn = WD.path[i + 1]; if(!A || !Bn) return { ok:false, err:'no node' };
  const saved = { st:state, T, cp, run:JSON.stringify(run), P:Object.assign({}, P) };
  state = 'sim'; SIM = true;
  const waits = opts.waits || [0, .4, .8, 1.2, 1.6, 2, 2.5, 3, 3.5, 4, 5, 6];
  let res = { ok:false };
  for(const w0 of waits){
    resetDynamics(0); T = 0;
    // stand on A
    const ac0 = A, prev = WD.path[i - 1];
    P.x = ac0.cx; P.z = ac0.cz;
    if(prev && !A.fanAssist && A.kind !== 'spring'){
      if(A.type === 'cyl'){ const dx = prev.cx - A.cx, dz = prev.cz - A.cz, d = Math.hypot(dx, dz) || 1, k = Math.max(0, A.r - .6); P.x = A.cx + dx / d * k; P.z = A.cz + dz / d * k; }
      else { P.x = clamp(prev.cx, A.x0 + .6, A.x1 - .6); P.z = clamp(prev.cz, A.z0 + .6, A.z1 - .6); }
    } P.y = ac0.y1 + .02; P.vx = P.vy = P.vz = 0; P.grounded = false; P.ground = null; P.jumps = 0; P.knock = 0; P.usedDouble = false; jumpQueued = false; P.landed = null;
    inp.x = inp.z = inp.m = 0;
    let t = 0, dbl = false, landed = false, fell = false;
    const dt = 1 / 60;
    const killed = () => P.y < WD.killY - .1;
    while(t < w0){ stepSim(dt); t += dt; if(killed()){ fell = true; break; } }
    if(fell) continue;
    let tt = 0;
    while(tt < 4.5){
      const bx = Bn.cx, bz = Bn.cz, dx = bx - P.x, dz = bz - P.z, d = Math.hypot(dx, dz);
      const inFan = WD.fans.some(f => (P.x - f.x) ** 2 + (P.z - f.z) ** 2 < f.r * f.r && P.y < Bn.y1 + .6 && P.y > f.y - .6);
      if(inFan && A.fanAssist){ const f = WD.fans.find(f => (P.x - f.x) ** 2 + (P.z - f.z) ** 2 < f.r * f.r); const fx = f.x - P.x, fz = f.z - P.z, fd = Math.hypot(fx, fz); inp.x = fd > .3 ? fx / fd : 0; inp.z = fd > .3 ? fz / fd : 0; inp.m = fd > .3 ? 1 : 0; }
      else if(d > .15){ inp.x = dx / d; inp.z = dz / d; inp.m = 1; } else { inp.x = inp.z = inp.m = 0; }
      if(P.grounded && P.ground === A && A.kind !== 'spring' && !A.fanAssist){
        const ex = P.x + inp.x * .55, ez = P.z + inp.z * .55;
        const off = !onTop(A, ex, ez, 0);
        const near = rectDist(Bn, P.x, P.z) < 1.6 && Bn.y1 > P.y + .35;
        if(off || near) jumpQueued = true;
      }
      if(!P.grounded && P.jumps === 1 && !dbl && P.vy < 1.5 && P.y < Bn.y1 + .25 && rectDist(Bn, P.x, P.z) > .2 && !A.fanAssist && A.kind !== 'spring'){ jumpQueued = true; dbl = true; }
      stepSim(dt); tt += dt;
      if(P.landed === Bn){ landed = true; break; }
      if(Bn.fanAssist && WD.fans.some(f => (P.x - f.x) ** 2 + (P.z - f.z) ** 2 < f.r * f.r && Math.abs(f.y - Bn.y1) < .5 && P.y > Bn.y1 - .2)){ landed = true; break; }
      if(P.landed && P.landed !== A && P.landed !== Bn && P.landed.pi != null && P.landed.pi < i) break;
      if(killed()) break;
    }
    if(landed){ res = { ok:true, wait:w0, dbl }; if(!dbl) break; }
  }
  SIM = false; state = saved.st; T = saved.T; cp = saved.cp; Object.assign(run, JSON.parse(saved.run)); Object.assign(P, saved.P); inp.x = inp.z = inp.m = 0; jumpQueued = false; resetDynamics(0);
  return res;
}
function stepSim(dt){ const st = state; state = 'sim'; step(dt); state = st; }
function rectDist(c, x, z){ if(c.type === 'box'){ const dx = Math.max(c.x0 - x, 0, x - c.x1), dz = Math.max(c.z0 - z, 0, z - c.z1); return Math.hypot(dx, dz); } return Math.max(0, Math.hypot(x - c.x, z - c.z) - c.r); }
window.__worlds = {
  get state(){ return state; }, get world(){ return WD ? WD.def.id : null; }, get worldIdx(){ return worldIdx; }, get hero(){ return heroId; }, get rot(){ return ROT; }, get stage(){ return [SW, SH]; },
  get fps(){ return fps; }, get dpr(){ return dpr; }, P, cam, PHYS, get cp(){ return cp; }, get run(){ return JSON.parse(JSON.stringify(run)); }, save:() => JSON.parse(JSON.stringify(SAVE)), toLayer,
  worlds:() => WORLDS.map((w, i) => ({ id:w.id, unlocked:isUnlocked(i), stars:starCount(w.id) })),
  state2:() => ({ state, world:WD && WD.def.id, cp, gems:run.gems, t:run.t, falls:run.falls, helped:run.helped.slice(), x:P.x, y:P.y, z:P.z, grounded:P.grounded }),
  go:i => startWorld(i), hub:i => showHub(i), sheet:i => showSheet(i), setHero:id => setHero(id, true),
  teleport(x, y, z){ P.x = x; P.z = z; P.y = y; P.vx = P.vz = P.vy = 0; P.grounded = false; snapCam = true; },
  teleportCp(i){ const c = WD.cps[i].c; this.teleport(c.cx, c.y1 + .3, c.cz); },
  finish(){ const f = WD.finish; this.teleport(f.x, f.top + .3, f.z); },
  path:() => WD.path.map((c, i) => ({ i, type:c.type, kind:c.kind, moving:!!c.moving, section:c.section, cp:c.cp, finish:!!c.finish, cx:c.cx, cz:c.cz, top:c.y1, w:c.w, d:c.d, r:c.r })),
  cps:() => WD.cps.map(c => ({ x:c.x, z:c.z, top:c.top })), gems:() => WD.gems.map(g => ({ x:g.x, y:g.y, z:g.z, got:g.got })),
  sim:(i, o) => simJump(i, o), fall(){ P.y = WD.killY - 1; }, takeGems(){ WD.gems.forEach((g, i) => { if(!g.got){ g.got = true; run.gems++; } }); hud(); },
  setTime(s){ run.t = s; run.started = true; }, unlockAll(){ WORLDS.forEach(w => { const r = rec(w.id); r.done = true; }); persist(); },
  reset(){ SAVE = { w:{}, seen:{} }; persist(); },
  info:() => renderer.info.render,
  mp:{ get screen(){ return MP.screen; }, get code(){ return MP.code; }, get id(){ return MP.id; }, get isHost(){ return MP.isHost; }, get players(){ return MP.players.map(p => ({ id:p.id, hero:p.hero, c:p.c })); },
    get active(){ return mpActive(); }, get end(){ return MP.lastEnd; }, skipCountdown(){ if(MP.match) MP.match.cdEnd = performance.now(); },
    remotes(){ return [...MP.remotes.values()].map(r => ({ id:r.id, hero:r.hero, visible:r.h.grp.visible, x:r.h.grp.position.x, z:r.h.grp.position.z })); } }
};

{

(function(){
