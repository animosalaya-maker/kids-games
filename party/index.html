<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="../i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title data-en="Friends Party" data-tr="Arkadaş Partisi">حفلة الأصحاب</title>
<meta name="description" content="ألعاب صغيرة لـ ٢ لـ ٤ أولاد على نفس الجوال." data-en="Little games for 2 to 4 kids on one phone." data-tr="Tek telefonda 2-4 çocuk için mini oyunlar.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bobo Land">
<meta name="theme-color" content="#1c1838">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: the phone lies flat between the kids. One big button in each corner, the mini-game in the middle, messages printed twice (one upside down for the far side). */
:root{
  --night:#1c1838; --night-2:#2a2452; --night-3:#362e68; --face:#2f2858;
  --ink:#fff7e8; --muted:#bdb4e6; --gold:#ffcd4d;
  --p0:#ff5a5f; --p1:#3fa9ff; --p2:#3fd47a; --p3:#ffc233;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

.pbtn{position:fixed;width:min(27vw,112px);height:min(27vw,112px);border-radius:50%;border:0;
  background:var(--c);box-shadow:0 7px 0 rgba(0,0,0,.35),inset 0 -8px 0 rgba(0,0,0,.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;z-index:5}
.pbtn.on{transform:translateY(5px) scale(.96);box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 -4px 0 rgba(0,0,0,.15)}
.pbtn.out{filter:grayscale(.85) brightness(.6)}
.pbtn .face{width:46%;height:30%;position:relative}
.pbtn .face::before,.pbtn .face::after{content:"";position:absolute;top:0;width:34%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 60% 55%,#1c1838 0 38%,#fff 40%)}
.pbtn .face::before{right:6%}.pbtn .face::after{left:6%}
.pbtn .sc{font-family:var(--display);font-weight:800;font-size:clamp(16px,5vw,24px);color:#1c1838;line-height:1}
.pbtn .lbl{font-weight:700;font-size:12px;color:rgba(28,24,56,.75);line-height:1}
.pos0{right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.pos1{left:max(14px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));rotate:180deg}
.pos2{left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.pos3{right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));rotate:180deg}

.msg{position:fixed;left:50%;width:min(64vw,420px);text-align:center;pointer-events:none;z-index:4;
  font-family:var(--display);font-weight:800;line-height:1.2;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.msg .big{display:block;font-size:clamp(26px,8vw,44px);text-wrap:balance}
.msg .small{display:block;font-family:var(--body);font-weight:700;font-size:clamp(14px,4vw,18px);color:var(--muted);text-shadow:none;margin-top:4px;text-wrap:balance}
#msgA{bottom:calc(20% + env(safe-area-inset-bottom,0px));transform:translateX(-50%)}
#msgB{top:calc(20% + env(safe-area-inset-top,0px));transform:translateX(-50%) rotate(180deg)}

.quit{position:fixed;top:50%;right:max(8px,env(safe-area-inset-right,0px));transform:translateY(-50%);z-index:6;
  width:40px;height:40px;border-radius:12px;border:0;background:var(--night-3);font-size:18px;display:grid;place-items:center;opacity:.8}

.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(18,14,40,.9);overflow-y:auto;touch-action:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.card{width:100%;max-width:420px;background:var(--night-2);border-radius:28px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
  box-shadow:0 0 0 3px var(--night-3),0 24px 60px rgba(0,0,0,.5)}
.card h1{font-family:var(--display);font-weight:800;font-size:42px;line-height:1;margin:0;color:var(--gold);text-shadow:0 4px 0 var(--face)}
.card h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.6;text-wrap:balance}
.card canvas{width:220px;height:120px}
.label{font-weight:700;font-size:14px;color:var(--muted);letter-spacing:.02em}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.choice button{border:0;border-radius:18px;background:var(--night-3);padding:10px 4px;font-family:var(--display);font-weight:800;font-size:26px;box-shadow:0 4px 0 var(--face);display:flex;flex-direction:column;align-items:center;gap:2px}
.choice button small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.choice button[aria-pressed="true"]{background:var(--gold);color:#3a2a00;box-shadow:0 4px 0 #c48f12}
.choice button[aria-pressed="true"] small{color:#6b5000}
.games{list-style:none;margin:0;padding:12px 14px;background:var(--night);border-radius:18px;display:grid;gap:8px;text-align:start;width:100%}
.games li{display:flex;gap:10px;align-items:center;font-size:15px;line-height:1.4}
.games li span:first-child{font-size:24px;width:32px;text-align:center;flex:none}
.big-btn{border:0;border-radius:20px;background:var(--gold);color:#3a2a00;font-family:var(--display);font-weight:800;font-size:24px;padding:12px 26px;min-width:200px;box-shadow:0 6px 0 #c48f12}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c48f12}
.ghost-btn{border:0;background:var(--night-3);border-radius:16px;padding:10px 18px;font-weight:700;font-size:16px;color:var(--ink);text-decoration:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.board{display:grid;gap:6px;width:100%}
.board div{display:flex;justify-content:space-between;align-items:center;background:var(--night);border-radius:12px;padding:8px 14px;font-weight:700}
.board i{font-style:normal;display:inline-block;width:14px;height:14px;border-radius:50%;margin-inline-end:8px;vertical-align:middle}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv" aria-label="ساحة اللعب" data-en-aria="Play area" data-tr-aria="Oyun alanı"></canvas>
<div class="msg" id="msgA"></div>
<div class="msg" id="msgB"></div>
<div id="buttons"></div>
<button class="quit" id="btnQuit" aria-label="القائمة" data-en-aria="Menu" data-tr-aria="Menü">✕</button>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

<script src="../world.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const AR = n => window.I18N ? I18N.num(n) : String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]); // digits for the current language
const LTR = !!(window.I18N && I18N.dir === 'ltr');
{ const md = document.querySelector('meta[name="description"]'), dl = window.I18N && md && md.getAttribute('data-' + I18N.lang); if(dl) md.setAttribute('content', dl); }
const store = {
  get(k, d){ try{ const v = localStorage.getItem('party_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('party_' + k, JSON.stringify(v)); }catch(e){} }
};
const PLAYERS = [
  { name:L('الأحمر', 'Red', 'Kırmızı'), color:'#ff5a5f', dark:'#c23a40' },
  { name:L('الأزرق', 'Blue', 'Mavi'), color:'#3fa9ff', dark:'#2276c4' },
  { name:L('الأخضر', 'Green', 'Yeşil'), color:'#3fd47a', dark:'#249c55' },
  { name:L('الأصفر', 'Yellow', 'Sarı'), color:'#ffc233', dark:'#c48f12' }
];

/* ---------- Sound ---------- */
let actx = null, muted = false;
function ac(){
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; } }
  if(actx && actx.state === 'suspended') actx.resume().catch(()=>{});
  return actx;
}
function tone(freq, dur, type, vol, delay, toFreq){
  if(muted) return; const a = ac(); if(!a) return;
  const t0 = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if(toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
const SFX = {
  tick(){ tone(660,.08,'triangle',.12); },
  go(){ tone(988,.3,'square',.1); },
  tap(i, n){ tone(300 + n * 18 + i * 40, .05, 'triangle', .08); },
  buzz(){ tone(140,.3,'sawtooth',.08,0,90); },
  turn(){ tone(520,.05,'sine',.08); },
  splash(){ tone(400,.4,'sawtooth',.07,0,80); },
  point(){ [659,784,988].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.09)); },
  win(){ [523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.22,'triangle',.15,i*.12)); }
};
function say(text){
  try{ if(muted || !('speechSynthesis' in window)) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = (window.I18N && I18N.speech) || 'ar-SA'; u.rate = 1; u.pitch = 1.2; speechSynthesis.speak(u); }catch(e){}
}

/* ---------- Canvas ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;
function fit(){ dpr = Math.min(2.5, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
addEventListener('resize', fit);

function drawBuddy(c, x, y, r, pl, t, mood, look){
  c.save(); c.translate(x, y);
  const sq = 1 + Math.sin(t * 9) * 0.04;
  c.fillStyle = 'rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(0, r * 0.95, r * 0.75, r * 0.2, 0, 0, Math.PI * 2); c.fill();
  c.scale(1 / sq, sq);
  // antenna
  c.strokeStyle = pl.dark; c.lineWidth = Math.max(2, r * 0.1); c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, -r * 0.85); c.quadraticCurveTo(r * 0.2, -r * 1.2, r * 0.05, -r * 1.35); c.stroke();
  c.fillStyle = pl.color; c.beginPath(); c.arc(r * 0.05, -r * 1.38, r * 0.15, 0, Math.PI * 2); c.fill();
  // body
  c.fillStyle = pl.dark; c.beginPath(); c.ellipse(0, r * 0.08, r * 0.92, r * 0.95, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = pl.color; c.beginPath(); c.ellipse(0, 0, r * 0.9, r * 0.9, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(255,255,255,.25)'; c.beginPath(); c.ellipse(-r * 0.35, -r * 0.45, r * 0.25, r * 0.14, -0.6, 0, Math.PI * 2); c.fill();
  // eyes
  const lx = (look && look.x) || 0, ly = (look && look.y) || 0;
  for(const s of [-1, 1]){
    if(mood === 'sad'){
      c.strokeStyle = '#1c1838'; c.lineWidth = Math.max(2, r * 0.09);
      c.beginPath(); c.moveTo(s * r * 0.42, -r * 0.3); c.lineTo(s * r * 0.18, -r * 0.08); c.moveTo(s * r * 0.18, -r * 0.3); c.lineTo(s * r * 0.42, -r * 0.08); c.stroke();
    } else {
      c.fillStyle = '#fff'; c.beginPath(); c.arc(s * r * 0.3, -r * 0.2, r * 0.22, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#1c1838'; c.beginPath(); c.arc(s * r * 0.3 + lx * r * 0.08, -r * 0.2 + ly * r * 0.08, r * 0.11, 0, Math.PI * 2); c.fill();
    }
  }
  // mouth
  c.strokeStyle = '#1c1838'; c.fillStyle = '#1c1838'; c.lineWidth = Math.max(2, r * 0.08); c.lineCap = 'round';
  if(mood === 'happy'){ c.beginPath(); c.arc(0, r * 0.18, r * 0.3, 0, Math.PI); c.fill(); }
  else if(mood === 'sad'){ c.beginPath(); c.arc(0, r * 0.45, r * 0.2, 1.15 * Math.PI, 1.85 * Math.PI); c.stroke(); }
  else { c.beginPath(); c.arc(0, r * 0.12, r * 0.22, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke(); }
  c.restore();
}

/* ---------- Messages + buttons ---------- */
function setMsg(big, small){
  const html = big ? '<span class="big">' + big + '</span>' + (small ? '<span class="small">' + small + '</span>' : '') : '';
  $('#msgA').innerHTML = html; $('#msgB').innerHTML = html;
}
let nPlayers = store.get('n', 2), target = store.get('target', 5);
let players = [];
function buildButtons(){
  const box = $('#buttons'); box.innerHTML = '';
  players.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'pbtn pos' + i; b.style.setProperty('--c', p.color); b.setAttribute('aria-label', L('زر ' + p.name, p.name + ' button', p.name + ' düğmesi'));
    b.innerHTML = '<span class="face"></span><b class="sc">' + AR(p.score) + '</b><span class="lbl">' + p.name + '</span>';
    b.addEventListener('pointerdown', e => { e.preventDefault(); ac(); b.classList.add('on'); press(i); });
    ['pointerup','pointercancel','pointerleave'].forEach(ev => b.addEventListener(ev, () => b.classList.remove('on')));
    box.appendChild(b); p.el = b;
  });
}
function refreshButtons(){ players.forEach(p => { p.el.querySelector('.sc').textContent = AR(p.score); p.el.classList.toggle('out', !!p.out); }); }

/* ---------- Mini-games ---------- */
function centerRect(){
  const pad = Math.min(W, H) * 0.06, btn = Math.min(W * 0.27, 112) + 24;
  return { x: pad, y: btn + 20, w: W - pad * 2, h: H - (btn + 20) * 2 };
}

const GAMES = {
  reaction: {
    title:L('مين الأسرع ⚡', 'Who is fastest? ⚡', 'En hızlı kim? ⚡'), help:L('لما تصير الدائرة خضرا، اكبس قبل الكل! إذا كبست بكير بتطلع', 'When the circle turns green, press first! Press too soon and you are out', 'Daire yeşil olunca herkesten önce bas! Erken basan elenir'),
    start(){ this.state = 'wait'; this.timer = 1.8 + Math.random() * 2.7; players.forEach(p => p.out = false); refreshButtons(); setMsg(L('استنى…', 'Wait…', 'Bekle…'), L('لا تكبس هلّق', 'Don\'t press yet', 'Daha basma')); },
    update(dt){
      if(this.state === 'wait'){ this.timer -= dt; if(this.timer <= 0){ this.state = 'go'; SFX.go(); setMsg(L('هلّق! اكبس!', 'Now! Press!', 'Şimdi! Bas!')); } }
    },
    press(i){
      const p = players[i]; if(p.out) return;
      if(this.state === 'wait'){
        p.out = true; SFX.buzz(); refreshButtons(); setMsg(L(p.name + ' كبس بكير 😅', p.name + ' pressed too soon 😅', p.name + ' erken bastı 😅'), L('استنوا الأخضر', 'Wait for green', 'Yeşili bekleyin'));
        if(players.every(q => q.out)){ this.start(); }
      } else if(this.state === 'go'){ finish(i); }
    },
    draw(t){
      const r = centerRect(), cx = W / 2, cy = H / 2, R = Math.min(r.w, r.h) * 0.3;
      const go = this.state === 'go', pulse = 1 + Math.sin(t * (go ? 14 : 4)) * 0.04;
      ctx.fillStyle = go ? '#3fd47a' : '#ff5a5f'; ctx.beginPath(); ctx.arc(cx, cy, R * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.beginPath(); ctx.arc(cx, cy, R * 0.75 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.font = Math.round(R * 0.9) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(go ? '👆' : '✋', cx, cy + R * 0.05);
    }
  },

  race: {
    title:L('سباق الكبس 🏁', 'Tap Race 🏁', 'Basma Yarışı 🏁'), help:L('اكبس زرك بسرعة بسرعة! أول واحد بيوصل العلم بيربح', 'Press your button fast, fast! First to the flag wins', 'Düğmene hızlı hızlı bas! Bayrağa ilk varan kazanır'),
    goal: 28,
    start(){ this.prog = players.map(() => 0); setMsg(''); },
    update(){},
    press(i){ this.prog[i]++; SFX.tap(i, this.prog[i]); if(this.prog[i] >= this.goal) finish(i); },
    draw(t){
      const r = centerRect(), n = players.length, lane = Math.min(r.h / n, 90), top = H / 2 - lane * n / 2;
      const x0 = LTR ? r.x + 30 : r.x + r.w - 30, x1 = LTR ? r.x + r.w - 40 : r.x + 40, fx = LTR ? 18 : -18;
      ctx.font = Math.round(lane * 0.5) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      players.forEach((p, i) => {
        const y = top + lane * i + lane / 2;
        ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(r.x, y - lane * 0.38, r.w, lane * 0.76, lane * 0.38) : ctx.rect(r.x, y - lane * 0.38, r.w, lane * 0.76); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.setLineDash([6, 8]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillText('🏁', x1 + fx, y);
        const k = Math.min(1, this.prog[i] / this.goal), x = x0 + (x1 - x0) * k;
        drawBuddy(ctx, x, y, lane * 0.28, p, t + i, k > 0.8 ? 'happy' : 'idle', { x:LTR ? 1 : -1, y:0 });
      });
    }
  },

  lava: {
    title:L('أرض الحمم 🌋', 'Lava Floor 🌋', 'Lav Zemini 🌋'), help:L('الأرض عم تصير حمم! كل كبسة بتلفّك. اللي بيضل واقف آخر شي بيربح', 'The floor is turning into lava! Each press turns you. The last one standing wins', 'Yer lava dönüşüyor! Her basış seni döndürür. En son ayakta kalan kazanır'),
    N: 7,
    start(){
      const N = this.N;
      this.tiles = Array.from({ length:N * N }, () => ({ s:0, t:0 }));
      const starts = [[N-1,N-1,-1,0],[0,0,1,0],[0,N-1,0,-1],[N-1,0,0,1]];
      this.bots = players.map((p, i) => { const s = starts[i]; return { x:s[0], y:s[1], px:s[0], py:s[1], fx:s[0], fy:s[1], dx:s[2], dy:s[3], alive:true, fall:0 }; });
      players.forEach(p => p.out = false); refreshButtons();
      this.step = 0; this.stepTime = 0.45; this.spawn = 1.2; this.spawnEvery = 1.0; this.elapsed = 0; this.done = false;
      setMsg('');
    },
    tile(x, y){ return this.tiles[y * this.N + x]; },
    update(dt){
      if(this.done) return;
      this.elapsed += dt;
      // lava spreading
      this.spawn -= dt;
      if(this.spawn <= 0){
        this.spawnEvery = Math.max(0.35, 1.0 - this.elapsed * 0.03);
        this.spawn = this.spawnEvery;
        const safe = this.tiles.filter(tl => tl.s === 0);
        for(let k = 0; k < 2 && safe.length; k++){ const tl = safe.splice(Math.floor(Math.random() * safe.length), 1)[0]; tl.s = 1; tl.t = 1.1; }
      }
      this.tiles.forEach(tl => { if(tl.s === 1){ tl.t -= dt; if(tl.t <= 0) tl.s = 2; } });
      // movement
      this.step += dt;
      const k = Math.min(1, this.step / this.stepTime);
      this.bots.forEach(b => { if(b.alive){ b.px = b.fx + (b.x - b.fx) * k; b.py = b.fy + (b.y - b.fy) * k; } else b.fall += dt; });
      if(this.step >= this.stepTime){
        this.step = 0;
        this.bots.forEach(b => {
          if(!b.alive) return;
          b.fx = b.x; b.fy = b.y;
          const nx = b.x + b.dx, ny = b.y + b.dy;
          if(nx >= 0 && ny >= 0 && nx < this.N && ny < this.N){ b.x = nx; b.y = ny; }
        });
      }
      // check lava
      this.bots.forEach((b, i) => {
        if(!b.alive) return;
        const tx = Math.round(b.px), ty = Math.round(b.py);
        if(this.tile(tx, ty).s === 2){ b.alive = false; players[i].out = true; refreshButtons(); SFX.splash(); setMsg(L(players[i].name + ' وقع بالحمم! 🔥', players[i].name + ' fell in the lava! 🔥', players[i].name + ' lava düştü! 🔥')); }
      });
      const alive = this.bots.map((b, i) => b.alive ? i : -1).filter(i => i >= 0);
      if(alive.length <= 1){ this.done = true; setTimeout(() => finish(alive.length ? alive[0] : null), 600); }
    },
    press(i){
      const b = this.bots[i]; if(!b || !b.alive) return;
      // turn clockwise on screen: right -> down -> left -> up
      const ndx = -b.dy, ndy = b.dx; b.dx = ndx; b.dy = ndy; SFX.turn();
    },
    draw(t){
      const r = centerRect(), N = this.N, S = Math.floor(Math.min(r.w, r.h) / N), ox = W / 2 - S * N / 2, oy = H / 2 - S * N / 2;
      // lava pool
      ctx.fillStyle = '#ff6a1a'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(ox - 10, oy - 10, S * N + 20, S * N + 20, 18) : ctx.rect(ox - 10, oy - 10, S * N + 20, S * N + 20); ctx.fill();
      for(let y = 0; y < N; y++) for(let x = 0; x < N; x++){
        const tl = this.tile(x, y), X = ox + x * S, Y = oy + y * S;
        if(tl.s === 2){
          ctx.fillStyle = 'rgba(255,214,0,' + (0.25 + Math.sin(t * 5 + x + y) * 0.15) + ')';
          ctx.beginPath(); ctx.arc(X + S / 2, Y + S / 2, S * 0.18, 0, Math.PI * 2); ctx.fill();
          continue;
        }
        const warn = tl.s === 1 && Math.floor(t * 10) % 2;
        ctx.fillStyle = warn ? '#ffb27a' : ((x + y) % 2 ? '#8d6e63' : '#7b5e55');
        ctx.fillRect(X + 2, Y + 2, S - 4, S - 4);
        ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(X + 2, Y + S - 7, S - 4, 5);
      }
      this.bots.forEach((b, i) => {
        if(!b.alive && b.fall > 0.8) return;
        const x = ox + b.px * S + S / 2, y = oy + b.py * S + S / 2, rr = S * 0.34 * (b.alive ? 1 : Math.max(0.01, 1 - b.fall / 0.8));
        drawBuddy(ctx, x, y, rr, players[i], t + i, b.alive ? 'idle' : 'sad', { x:b.dx, y:b.dy });
        if(b.alive){
          ctx.fillStyle = '#fff'; ctx.beginPath();
          const ax = x + b.dx * S * 0.55, ay = y + b.dy * S * 0.55;
          ctx.moveTo(ax + b.dx * 8, ay + b.dy * 8); ctx.lineTo(ax - b.dy * 7, ay + b.dx * 7); ctx.lineTo(ax + b.dy * 7, ay - b.dx * 7); ctx.fill();
        }
      });
    }
  },
  tug: {
    title:L('شد الحبل 🪢', 'Tug of War 🪢', 'Halat Çekme 🪢'), help:L('اللي تحت ضد اللي فوق! اكبسوا بسرعة لتسحبوا الحبل لعندكم', 'Bottom side against top side! Press fast to pull the rope to you', 'Alttakiler üsttekilere karşı! İpi kendinize çekmek için hızlı basın'),
    start(){
      this.pos = 0;
      this.teams = [players.map((p, i) => i).filter(i => i % 2 === 0), players.map((p, i) => i).filter(i => i % 2 === 1)];
      setMsg('');
    },
    update(dt){ this.pos *= (1 - dt * 0.05); },
    press(i){
      const team = i % 2, size = this.teams[team].length;
      this.pos += (team === 0 ? 1 : -1) * 0.045 / size; SFX.tap(i, Math.abs(this.pos) * 20);
      if(this.pos >= 1) finish(this.teams[0]); else if(this.pos <= -1) finish(this.teams[1]);
    },
    draw(t){
      const r = centerRect(), cx = W / 2, top = r.y, bot = r.y + r.h, mid = (top + bot) / 2, span = r.h / 2 - 40;
      const ky = mid + this.pos * span;
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.setLineDash([10, 10]); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(r.x, mid); ctx.lineTo(r.x + r.w, mid); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,90,95,.12)'; ctx.fillRect(r.x, bot - 30, r.w, 30);
      ctx.fillStyle = 'rgba(63,169,255,.12)'; ctx.fillRect(r.x, top, r.w, 30);
      ctx.strokeStyle = '#d9a35b'; ctx.lineWidth = 10; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, top + 10); ctx.lineTo(cx, bot - 10); ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 2;
      for(let y = top + 14; y < bot - 10; y += 14){ ctx.beginPath(); ctx.moveTo(cx - 5, y); ctx.lineTo(cx + 5, y + 7); ctx.stroke(); }
      ctx.fillStyle = '#ffcd4d'; ctx.beginPath(); ctx.moveTo(cx, ky - 18); ctx.lineTo(cx + 16, ky); ctx.lineTo(cx, ky + 18); ctx.lineTo(cx - 16, ky); ctx.fill();
      const pull = this.pos * span * 0.3;
      this.teams.forEach((tm, side) => tm.forEach((pi, k) => {
        const y = side === 0 ? bot - 60 + pull : top + 60 + pull, x = cx + (k === 0 ? -36 : 36);
        drawBuddy(ctx, x, y, 26, players[pi], t * 2 + pi, 'happy', { x:0, y: side === 0 ? -1 : 1 });
      }));
    }
  }
};
const ORDER = ['reaction','race','lava','tug'];

/* ---------- Match flow ---------- */
let phase = 'menu', game = null, phaseTime = 0, queue = [], lastGame = null, countdown = 0;
function nextGame(){
  if(!queue.length){ queue = ORDER.slice().sort(() => Math.random() - 0.5); if(queue[0] === lastGame) queue.push(queue.shift()); }
  lastGame = queue.shift(); game = GAMES[lastGame];
  players.forEach(p => p.out = false); refreshButtons();
  phase = 'intro'; phaseTime = 2.8; setMsg(game.title, game.help); say(game.title.replace(/[^\p{L}\p{M}\p{N} ]/gu, '').trim());
  if(game.start && lastGame !== 'reaction') game.start(); // show the board during intro
}
function press(i){ if(phase === 'play' && game) game.press(i); }
function finish(winner){
  if(phase !== 'play') return;
  phase = 'result'; phaseTime = 2.4;
  if(winner == null || (Array.isArray(winner) && !winner.length)){ setMsg(L('تعادل! 🤝', 'A tie! 🤝', 'Berabere! 🤝'), L('ما حدا ربح هالجولة', 'Nobody won this round', 'Bu turu kimse kazanmadı')); return; }
  const list = Array.isArray(winner) ? winner : [winner];
  list.forEach(i => players[i].score++); refreshButtons(); SFX.point();
  const names = list.map(i => players[i].name).join(L(' و', ' and ', ' ve '));
  if(list.length === 1){ const sc = players[list[0]].score; setMsg(L(names + ' ربح! 🎉', names + ' wins! 🎉', names + ' kazandı! 🎉'), L('صار معه ' + AR(sc) + ' من ' + AR(target), 'Now ' + sc + ' of ' + target + ' points', 'Puanı: ' + sc + '/' + target)); }
  else setMsg(L(names + ' ربحوا! 🎉', names + ' win! 🎉', names + ' kazandı! 🎉'), L('نقطة لكل واحد', 'One point each', 'Herkese bir puan'));
  say(L(names + (list.length > 1 ? ' ربحوا' : ' ربح'), names + (list.length > 1 ? ' win' : ' wins'), names + ' kazandı'));
}
function update(dt){
  if(phase === 'intro'){
    phaseTime -= dt;
    if(phaseTime <= 0){ phase = 'count'; countdown = 3; phaseTime = 0.7; setMsg(AR(3)); SFX.tick(); }
  } else if(phase === 'count'){
    phaseTime -= dt;
    if(phaseTime <= 0){
      countdown--;
      if(countdown > 0){ phaseTime = 0.7; setMsg(AR(countdown)); SFX.tick(); }
      else { phase = 'play'; game.start(); if(lastGame !== 'reaction') { setMsg(L('يلا!', 'Go!', 'Başla!')); setTimeout(() => { if(phase === 'play' && lastGame !== 'reaction') setMsg(''); }, 700); SFX.go(); } }
    }
  } else if(phase === 'play'){
    game.update(dt);
  } else if(phase === 'result'){
    phaseTime -= dt;
    if(phaseTime <= 0){
      const champ = players.filter(p => p.score >= target).sort((a, b) => b.score - a.score)[0];
      if(champ) showChampion(champ); else nextGame();
    }
  }
}

/* ---------- Drawing ---------- */
function draw(t){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#1c1838'; ctx.fillRect(0, 0, W, H);
  // confetti-dot background
  ctx.fillStyle = 'rgba(255,255,255,.04)';
  for(let i = 0; i < 40; i++){ const x = (i * 97) % W, y = (i * 173 + t * 10) % H; ctx.beginPath(); ctx.arc(x, y, 3 + (i % 3), 0, Math.PI * 2); ctx.fill(); }
  if(game && phase !== 'menu' && (phase !== 'intro' || lastGame !== 'reaction')) game.draw(t);
}

/* ---------- Screens ---------- */
const overlay = $('#overlay'), card = $('#card');
function showMenu(){
  phase = 'menu'; setMsg('');
  overlay.hidden = false;
  card.innerHTML =
    '<canvas id="menuCv" width="440" height="240"></canvas>' +
    '<h1>' + L('حفلة الأصحاب', 'Friends Party', 'Arkadaş Partisi') + '</h1>' +
    '<p>' + L('حطّوا الجوال عالطاولة بالنص، وكل واحد ياخد زاوية وزرّ. أول واحد بيجمع النقاط بياخد الكاس 🏆', 'Put the phone flat in the middle of the table. Each kid takes a corner and a button. The first to get the points wins the cup 🏆', 'Telefonu masanın ortasına koyun, herkes bir köşe ve bir düğme alsın. Puanları ilk toplayan kupayı kazanır 🏆') + '</p>' +
    '<span class="label">' + L('كم ولد رح يلعب؟', 'How many kids will play?', 'Kaç çocuk oynayacak?') + '</span>' +
    '<div class="choice" id="chN">' + [2,3,4].map(n => '<button data-n="' + n + '" aria-pressed="' + (n === nPlayers) + '">' + AR(n) + '<small>' + L('لاعبين', 'players', 'oyuncu') + '</small></button>').join('') + '</div>' +
    '<span class="label">' + L('كم نقطة للفوز؟', 'How many points to win?', 'Kazanmak için kaç puan?') + '</span>' +
    '<div class="choice" id="chT">' + [3,5,7].map(n => '<button data-t="' + n + '" aria-pressed="' + (n === target) + '">' + AR(n) + '<small>' + L('نقاط', 'points', 'puan') + '</small></button>').join('') + '</div>' +
    '<button class="big-btn" id="btnStart">' + L('يلا نلعب', 'Let\'s play', 'Hadi oynayalım') + '</button>' +
    '<ul class="games">' +
      '<li><span>⚡</span><span>' + L('<b>مين الأسرع:</b> اكبس أول ما تصير الدائرة خضرا', '<b>Who is fastest:</b> press when the circle turns green', '<b>En hızlı kim:</b> daire yeşil olunca bas') + '</span></li>' +
      '<li><span>🏁</span><span>' + L('<b>سباق الكبس:</b> اكبس بسرعة لتوصل العلم', '<b>Tap Race:</b> press fast to get to the flag', '<b>Basma Yarışı:</b> bayrağa varmak için hızlı bas') + '</span></li>' +
      '<li><span>🌋</span><span>' + L('<b>أرض الحمم:</b> كل كبسة بتلفّك، لا توقع بالحمم', '<b>Lava Floor:</b> each press turns you, don\'t fall in the lava', '<b>Lav Zemini:</b> her basış seni döndürür, lava düşme') + '</span></li>' +
      '<li><span>🪢</span><span>' + L('<b>شد الحبل:</b> اللي تحت ضد اللي فوق', '<b>Tug of War:</b> bottom side against top side', '<b>Halat Çekme:</b> alttakiler üsttekilere karşı') + '</span></li>' +
    '</ul>' +
    '<a class="ghost-btn" href="../">' + L('⬅ كل الألعاب', '⬅ All games', '⬅ Bütün oyunlar') + '</a>';
  card.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { nPlayers = +b.dataset.n; store.set('n', nPlayers); card.querySelectorAll('[data-n]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  card.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { target = +b.dataset.t; store.set('target', target); card.querySelectorAll('[data-t]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#btnStart').onclick = startMatch;
}
function startMatch(){
  ac();
  players = PLAYERS.slice(0, nPlayers).map(p => Object.assign({}, p, { score:0, out:false }));
  buildButtons(); overlay.hidden = true; queue = []; lastGame = null; nextGame();
}
function showChampion(p){
  phase = 'menu'; SFX.win(); say(L(p.name + ' هو البطل', p.name + ' is the champion', p.name + ' şampiyon'));
  const coins = 6 + players.length * 2; if(window.World){ World.addCoins(coins, 'لخزانة بوبو'); /* fixed key: world.js shows it in the right language */ World.track('play', 'party'); }
  overlay.hidden = false;
  const sorted = players.slice().sort((a, b) => b.score - a.score);
  card.innerHTML =
    '<canvas id="champCv" width="440" height="240" data-color="' + PLAYERS.findIndex(q => q.name === p.name) + '"></canvas>' +
    '<h2>' + L(p.name + ' هو البطل! 🏆', p.name + ' is the champion! 🏆', p.name + ' şampiyon! 🏆') + '</h2>' +
    '<p style="color:var(--gold);font-weight:700">' + L('ربحتوا ' + AR(coins) + ' 🪙 عملة', 'You all got ' + coins + ' 🪙 coins', coins + ' 🪙 altın kazandınız') + '</p>' +
    '<div class="board">' + sorted.map(q => '<div><span><i style="background:' + q.color + '"></i>' + q.name + '</span><span>' + L(AR(q.score) + ' نقاط', q.score + (q.score === 1 ? ' point' : ' points'), q.score + ' puan') + '</span></div>').join('') + '</div>' +
    '<button class="big-btn" id="btnAgain">' + L('كمان حفلة', 'Party again', 'Bir parti daha') + '</button>' +
    '<button class="ghost-btn" id="btnMenu">' + L('القائمة', 'Menu', 'Menü') + '</button>';
  $('#btnAgain').onclick = startMatch; $('#btnMenu').onclick = showMenu;
}
$('#btnQuit').onclick = () => { if(phase !== 'menu') showMenu(); };

/* ---------- Loop ---------- */
let last = 0;
function frame(now){
  const t = now / 1000, dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  if(phase !== 'menu') update(dt);
  draw(t);
  const mc = document.getElementById('menuCv'), cc = document.getElementById('champCv');
  if(mc && !overlay.hidden){
    const c = mc.getContext('2d'); c.clearRect(0, 0, mc.width, mc.height);
    PLAYERS.forEach((p, i) => drawBuddy(c, 70 + i * 100, 140 + Math.sin(t * 3 + i) * 12, 38, p, t + i, i % 2 ? 'happy' : 'idle', { x:Math.sin(t + i), y:0 }));
  }
  if(cc && !overlay.hidden){
    const c = cc.getContext('2d'); c.clearRect(0, 0, cc.width, cc.height);
    c.font = '80px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('🏆', 120, 130);
    drawBuddy(c, 290, 140 + Math.abs(Math.sin(t * 5)) * -20, 60, PLAYERS[+cc.dataset.color], t, 'happy', { x:0, y:0 });
  }
  requestAnimationFrame(frame);
}
function start(){
  fit(); showMenu(); requestAnimationFrame(frame);
  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(() => {});
}
start();
})();
</script>
