<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="../i18n.js"></script>
<script src="../rt.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title data-en="Uncle Grumpy's House" data-tr="Somurtkan Amca'nın Evi">بيت عمّو زعلان</title>
<meta name="description" content="لعبة مقالب ثلاثية الأبعاد مضحكة للأطفال: تسلّل لبيت عمّو زعلان وحضّرله مقالب، ولا تخلّيه يشوفك!" data-en="A funny 3D prank game for kids: sneak into Uncle Grumpy's house and set up silly pranks without being seen!" data-tr="Çocuklar için komik bir 3D şaka oyunu: Somurtkan Amca'nın evine gizlice gir ve görünmeden komik şakalar hazırla!">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bobo Land">
<meta name="theme-color" content="#2f2a55">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Uncle Grumpy's House («بيت عمّو زعلان»): a 3D prank game with our grumpy-but-harmless neighbour.
   Always landscape (the page rotates its own layer, like the other 3D games). */
:root{
  --night:#2b2452; --night-2:#3a3170; --night-3:#4a3f8c; --wall-face:#231d45;
  --ink:#fff7e8; --muted:#d8cff7; --gold:#ffcd4d; --mint:#5fe3b1; --pink:#ff8fb8; --rose:#ffb35c;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0;
  --sa-t:env(safe-area-inset-top,0px);--sa-r:env(safe-area-inset-right,0px);--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px);--sw:100vw;--sh:100vh}
#stage.rot{--sa-t:env(safe-area-inset-right,0px);--sa-r:env(safe-area-inset-bottom,0px);--sa-b:env(safe-area-inset-left,0px);--sa-l:env(safe-area-inset-top,0px)}
#saProbe{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;width:var(--sa-l);height:var(--sa-b)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#touch{position:absolute;inset:0;z-index:2;touch-action:none}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;gap:8px;pointer-events:none;
  padding:calc(8px + var(--sa-t)) max(12px,var(--sa-r)) 0 max(12px,var(--sa-l));direction:ltr}
.hud > *{pointer-events:auto}
.icon-btn{width:50px;height:50px;flex:none;border:0;border-radius:16px;background:rgba(43,36,82,.82);font-size:24px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25);padding:0}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.icon-btn.lit{background:var(--gold)}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.chips-row{display:flex;gap:6px;align-items:center;direction:ltr}
.chip{background:rgba(43,36,82,.84);border-radius:999px;padding:5px 12px;font-weight:800;font-size:18px;white-space:nowrap;display:flex;align-items:center;gap:5px;font-family:var(--display);line-height:1.2}
.chip.day{box-shadow:inset 0 0 0 3px var(--gold);font-size:19px}
.chip.lk{font-size:20px;padding:4px 10px;opacity:.8;position:relative}
.chip.lk::after{content:"🔒";font-size:12px;position:absolute;right:-2px;top:-4px}
.chip.lk.done{background:rgba(40,150,100,.92);opacity:1}
.chip.lk.done::after{content:"✅"}
.chip.mood{flex:none;font-size:17px;box-shadow:inset 0 0 0 3px #8fd0ff;direction:inherit}
.chip.mood[data-m=chase]{background:rgba(220,70,100,.95);box-shadow:inset 0 0 0 3px #fff;animation:moodPulse .7s ease-in-out infinite}
.chip.mood[data-m=awake]{box-shadow:inset 0 0 0 3px var(--gold)}
.chip.mood[data-m=tired]{box-shadow:inset 0 0 0 3px var(--mint)}
@keyframes moodPulse{50%{transform:scale(1.07)}}
[dir=rtl] .chip.mood{direction:rtl}
.notecard{display:flex;align-items:center;gap:6px;background:#fffaf0;border-radius:14px;padding:4px 10px;box-shadow:0 4px 0 rgba(0,0,0,.25);direction:ltr}
.notecard span{font-size:22px}

.joy{position:absolute;z-index:4;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,247,232,.16);border:3px solid rgba(255,247,232,.45);pointer-events:none;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.joy.on{background:rgba(255,247,232,.24)}
.joy::before{content:"";position:absolute;inset:30px;border-radius:50%;border:2px dashed rgba(255,247,232,.35)}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,247,232,.88);box-shadow:0 4px 0 rgba(0,0,0,.25)}
#stage.short .joy{width:112px;height:112px;margin:-56px 0 0 -56px}

.act{position:absolute;z-index:4;right:max(18px,calc(var(--sa-r) + 8px));bottom:calc(18px + var(--sa-b));--s:min(calc(var(--sh) * .3),126px);width:var(--s);height:var(--s);
  border-radius:50%;border:4px solid #fff7e8;background:var(--ac,#ffcd4d);color:#2a1a00;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 7px 0 rgba(0,0,0,.28),0 0 0 6px rgba(255,255,255,.18);touch-action:none;font-family:var(--display);line-height:1;padding:0;animation:actIn .25s cubic-bezier(.2,1.5,.4,1)}
.act i{font-style:normal;font-size:calc(var(--s) * .36);line-height:1}
.act b{font-weight:800;font-size:calc(var(--s) * .2);margin-top:3px}
.act.dim{filter:saturate(.5) brightness(.9);opacity:.85}
.act.pulse{animation:actPulse 1s ease-in-out infinite}
.act:active,.act.on{transform:translateY(4px) scale(.96);box-shadow:0 2px 0 rgba(0,0,0,.28)}
@keyframes actIn{from{transform:scale(.4)}to{transform:scale(1)}}
@keyframes actPulse{50%{box-shadow:0 7px 0 rgba(0,0,0,.28),0 0 0 14px rgba(255,255,255,.3)}}
.runbtn{position:absolute;z-index:4;right:calc(max(18px,calc(var(--sa-r) + 8px)) + min(calc(var(--sh) * .3),126px) + 14px);bottom:calc(20px + var(--sa-b));width:84px;height:84px;border-radius:26px;border:3px solid #fff7e8;
  background:rgba(43,36,82,.85);font-size:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.28);padding:0;line-height:1}
.runbtn b{font-family:var(--display);font-size:16px;font-weight:800;margin-top:2px}
.runbtn.lit{background:#ff8a4d;color:#fff}
.runbtn.on{transform:translateY(3px)}
.slot{position:absolute;z-index:4;right:max(18px,calc(var(--sa-r) + 8px));bottom:calc(30px + var(--sa-b) + min(calc(var(--sh) * .3),126px));display:flex;align-items:center;gap:6px;
  background:rgba(255,250,240,.95);color:#3a2a00;border-radius:999px;padding:4px 14px 4px 6px;box-shadow:0 0 0 3px var(--gold),0 5px 0 rgba(0,0,0,.25);pointer-events:none;direction:ltr}
.slot i{font-style:normal;font-size:30px;width:40px;height:40px;display:grid;place-items:center;background:#fff;border-radius:50%}
.slot b{font-family:var(--display);font-weight:800;font-size:17px}

/* Grandma's speech bubble (follows her head) and the top hint */
.bubble{position:absolute;z-index:6;transform:translate(-50%,-100%);background:#fff7e8;color:#3a1f3a;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.25;
  padding:8px 14px;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.22);pointer-events:none;white-space:nowrap;max-width:60vw;animation:bIn .25s ease-out}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff7e8;border-bottom:0}
.bubble.top{left:50%!important;top:calc(64px + var(--sa-t))!important;transform:translateX(-50%)}
.bubble.top::after{display:none}
.bubble.top::before{content:"👵🏻 ";}
@keyframes bIn{from{opacity:0}to{opacity:1}}
.hint{position:absolute;z-index:6;left:50%;bottom:calc(16px + var(--sa-b));transform:translateX(-50%);max-width:min(560px,calc(var(--sw) - 360px));background:rgba(43,36,82,.9);
  color:var(--ink);font-family:var(--display);font-weight:800;font-size:18px;line-height:1.3;padding:8px 16px;border-radius:18px;box-shadow:0 0 0 3px rgba(255,247,232,.5),0 5px 0 rgba(0,0,0,.25);text-align:center;pointer-events:none;animation:bIn .3s ease-out}
.hint.arrow{background:var(--gold);color:#3a2a00}

/* peeking out of a hiding spot */
.peek{position:absolute;inset:0;z-index:3;pointer-events:none}
.peek.wardrobe{background:linear-gradient(90deg,#5a3424 0 13%,rgba(90,52,36,.55) 16%,transparent 24% 76%,rgba(90,52,36,.55) 84%,#5a3424 87%),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(40,20,30,.55) 100%)}
.peek.bed{background:linear-gradient(180deg,#5a3a6a 0 30%,rgba(90,58,106,.4) 34%,transparent 40%),linear-gradient(0deg,rgba(40,20,30,.5),transparent 18%)}
.peek.table{background:linear-gradient(180deg,#fff0f0 0 26%,rgba(255,240,240,.6) 30%,transparent 36%),linear-gradient(90deg,rgba(255,240,240,.75) 0 7%,transparent 12% 88%,rgba(255,240,240,.75) 93%)}
.peek.curtain{background:linear-gradient(90deg,rgba(255,143,158,.92) 0 22%,rgba(255,143,158,.35) 30%,transparent 38%)}
.peek.tub{background:linear-gradient(90deg,rgba(255,184,210,.95) 0 24%,rgba(255,184,210,.35) 32%,transparent 40%),linear-gradient(0deg,rgba(255,255,255,.75) 0 16%,transparent 22%)}
.peek.coats{background:linear-gradient(90deg,rgba(122,90,168,.95) 0 20%,rgba(61,143,143,.5) 28%,transparent 36%)}
.peek.boxes,.peek.trunk{background:linear-gradient(90deg,#c89a62 0 16%,transparent 22% 78%,#c89a62 84%),linear-gradient(180deg,#a8794a 0 18%,transparent 24%)}
.peek.trunk{background:linear-gradient(180deg,#7a4a28 0 34%,rgba(122,74,40,.3) 40%,transparent 44%),linear-gradient(0deg,#8a5a34 0 22%,transparent 26%)}
.peek::after{content:"🫣";position:absolute;left:max(24px,calc(var(--sa-l) + 16px));bottom:calc(24px + var(--sa-b));font-size:54px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}

/* cosy sleep fade after a boop */
.sleepov{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;
  background:radial-gradient(circle at 50% 40%,#ffd9b8 0,#f29ab8 45%,#6a4f9a 100%);animation:sIn .5s ease-out;padding:20px}
.sleepov.out{animation:sOut .5s ease-in forwards}
.sleepov .moon{font-size:84px;line-height:1;animation:wob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.2))}
.sleepov h2{margin:0;font-family:var(--display);font-weight:800;font-size:38px;color:#fff;text-shadow:0 4px 0 rgba(90,40,90,.5)}
.sleepov p{margin:0;font-family:var(--display);font-weight:800;font-size:28px;color:#fff7e8;background:rgba(90,40,110,.5);border-radius:999px;padding:4px 22px}
@keyframes sIn{from{opacity:0}to{opacity:1}}
@keyframes sOut{to{opacity:0}}
.flash{position:absolute;inset:0;z-index:14;background:#fffbe6;opacity:0;pointer-events:none}
.flash.go{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

/* colour padlock */
.code{position:absolute;inset:0;z-index:16;display:grid;place-items:center;background:rgba(30,22,60,.6);padding:10px}
.code-card{position:relative;background:#fff7e8;color:#3a2a4a;border-radius:28px;padding:14px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 0 0 4px var(--gold),0 16px 40px rgba(0,0,0,.45);animation:cardIn .25s ease-out;max-width:560px}
.code-card h2{margin:0;font-family:var(--display);font-weight:800;font-size:26px}
.code-card p{margin:0;font-weight:700;font-size:17px;color:#6a5a7a}
.code-card .x{position:absolute;top:8px;inset-inline-end:8px;width:46px;height:46px;border:0;border-radius:14px;background:#efe3d0;font-size:20px}
.note-row{display:flex;align-items:center;gap:6px;background:#fffdf6;border-radius:14px;padding:4px 12px;box-shadow:inset 0 0 0 2px #e8d9b8;direction:ltr}
.note-row span{font-size:26px}
.slots3{display:flex;gap:10px;direction:ltr}
.slots3 b{width:58px;height:58px;border-radius:16px;background:#efe3d0;display:grid;place-items:center;box-shadow:inset 0 0 0 3px #d9c8a8}
.pad6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;direction:ltr}
.pad6 button{width:68px;height:68px;border:0;border-radius:20px;background:#fff;display:grid;place-items:center;box-shadow:0 5px 0 #d9c8a8,inset 0 0 0 3px #efe3d0}
.pad6 button:active{transform:translateY(4px);box-shadow:0 1px 0 #d9c8a8}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
#stage.short .pad6 button{width:58px;height:58px} #stage.short .slots3 b{width:48px;height:48px} #stage.short .code-card{gap:5px;padding:10px 16px 14px}

/* overlays and cards */
.overlay{position:absolute;inset:0;z-index:20;display:flex;background:rgba(30,22,60,.55);overflow-y:auto;
  padding-left:max(16px,var(--sa-l));padding-right:max(16px,var(--sa-r));padding-block:calc(14px + var(--sa-t)) calc(14px + var(--sa-b))}
.overlay.dim{background:rgba(30,22,60,.8)}
.overlay.clear{background:linear-gradient(90deg,rgba(30,22,60,.1),rgba(30,22,60,.5) 52%,rgba(30,22,60,.72))}
[dir=rtl] .overlay.clear{background:linear-gradient(270deg,rgba(30,22,60,.1),rgba(30,22,60,.5) 52%,rgba(30,22,60,.72))}
.card{width:100%;max-width:470px;margin:auto;background:rgba(58,49,112,.95);border-radius:28px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  box-shadow:0 0 0 3px var(--night-3),0 24px 60px rgba(0,0,0,.5);animation:cardIn .3s ease-out}
.card.wide{max-width:880px}
.card.bare{background:none;box-shadow:none;max-width:none;padding:0;animation:none}
@keyframes cardIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;margin:0}
.card p{margin:0;color:var(--muted);line-height:1.5;font-size:17px;text-wrap:balance}
.big-btn{border:0;border-radius:20px;background:var(--gold);color:#3a2a00;font-family:var(--display);font-weight:800;font-size:25px;padding:11px 28px;min-width:200px;box-shadow:0 6px 0 #c48f12}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c48f12}
.ghost-btn{border:0;background:var(--night-3);border-radius:16px;padding:11px 18px;font-weight:700;font-size:18px;box-shadow:0 4px 0 var(--wall-face);color:var(--ink)}
.ghost-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wall-face)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tally{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;direction:ltr}
.tally span{background:var(--night);border-radius:16px;padding:7px 14px;font-weight:800;font-size:19px}
.bigstar{font-size:62px;line-height:1;animation:spin .7s ease-out;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));direction:ltr}
.bigstar .off{filter:grayscale(1) brightness(.6);opacity:.5}
@keyframes spin{from{transform:scale(0) rotate(-200deg)}to{transform:scale(1) rotate(0)}}
.hero-btn{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:20px;background:rgba(58,49,112,.94);padding:4px 14px 4px 4px;box-shadow:0 0 0 3px var(--c,var(--gold)),0 5px 0 rgba(0,0,0,.3);font-family:var(--display);font-weight:800;font-size:18px}
.hero-btn img{width:46px;height:46px;border-radius:14px;object-fit:cover;object-position:top;background:var(--night-3)}
.rothint{display:flex;align-items:center;gap:10px;background:var(--gold);color:#3a2a00;border-radius:18px;padding:6px 16px 6px 12px;font-family:var(--display);font-weight:800;font-size:18px;box-shadow:0 4px 0 #c48f12}
.rothint i{font-style:normal;font-size:30px;line-height:1;display:inline-block;animation:rotphone 2.6s ease-in-out infinite}
@keyframes rotphone{0%,20%{transform:rotate(-90deg)}55%,85%{transform:rotate(-180deg)}100%{transform:rotate(-90deg)}}
.menu{width:min(520px,100%);margin:auto 0;margin-inline-start:auto;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.menu .top{display:flex;align-items:center;gap:10px}
.menu .logo{font-size:60px;line-height:1;animation:wob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-6px)}}
.menu h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:1.05;margin:0;color:var(--rose);text-shadow:0 5px 0 var(--wall-face)}
.menu .sub{margin:0;font-weight:700;font-size:18px;color:var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.45);text-wrap:balance}
.menu .mine{display:flex;gap:8px;direction:ltr}
.menu .mine span{background:rgba(43,36,82,.85);border-radius:999px;padding:4px 14px;font-size:20px}
.seg{display:flex;background:rgba(43,36,82,.9);border-radius:18px;padding:4px;gap:4px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.seg button{border:0;border-radius:14px;background:none;padding:8px 16px;font-family:var(--display);font-weight:800;font-size:19px;color:var(--muted)}
.seg button.on{background:var(--mint);color:#063d2a}
#stage.short .menu{gap:8px} #stage.short .menu .logo{font-size:48px} #stage.short .menu h1{font-size:36px}
#stage.short .big-btn{font-size:21px;padding:8px 20px;min-width:160px} #stage.short .ghost-btn{padding:8px 14px;font-size:16px}
#stage.short .card{gap:8px;padding:12px 16px} #stage.short .card h2{font-size:24px} #stage.short .bigstar{font-size:46px}
.heroes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;width:100%}
.hero{border:0;border-radius:20px;background:var(--night);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 0 0 3px var(--night-3),0 5px 0 rgba(0,0,0,.3);transition:transform .15s}
.hero img{width:100%;aspect-ratio:3/4;object-fit:contain;object-position:bottom;display:block;border-radius:14px;background:radial-gradient(circle at 50% 70%,var(--c),transparent 70%)}
.hero b{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.15}
.hero.on{background:#5a4fa8;box-shadow:0 0 0 4px var(--gold),0 5px 0 rgba(0,0,0,.3);transform:translateY(-5px)}
.hero.on b{color:var(--gold)}
#stage.short .hero b{font-size:14px}
/* online co-op: friends' name tags, player cards, room keypad, toast */
.ntag{position:absolute;z-index:3;transform:translate(-50%,-100%);max-width:9em;overflow:hidden;text-overflow:ellipsis;background:rgba(43,36,82,.88);color:var(--ink);
  font-family:var(--display);font-weight:800;font-size:15px;line-height:1.3;padding:2px 11px;border-radius:999px;box-shadow:0 0 0 2px var(--c,var(--gold)),0 3px 0 rgba(0,0,0,.25);pointer-events:none;white-space:nowrap;unicode-bidi:plaintext}
.ntag.far{opacity:.55}
.big-btn.pink{background:var(--pink);color:#4a0f2a;box-shadow:0 6px 0 #c4527e}
.big-btn.pink:active{box-shadow:0 2px 0 #c4527e}
.big-btn.mint{background:var(--mint);color:#063d2a;box-shadow:0 6px 0 #2a9c74}
.big-btn.mint:active{box-shadow:0 2px 0 #2a9c74}
.pslots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.pslot{background:var(--night);border-radius:18px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 0 0 3px var(--c,var(--night-3)),0 4px 0 rgba(0,0,0,.25);font-family:var(--display);font-weight:800;font-size:15px;min-width:0}
.pslot img{width:100%;max-width:88px;aspect-ratio:1;object-fit:cover;object-position:top;border-radius:14px;background:var(--night-3)}
.pslot .wait{width:100%;max-width:88px;aspect-ratio:1;border-radius:14px;background:var(--night-3);display:grid;place-items:center;font-size:36px;opacity:.6}
.pslot span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pslot small{font-size:15px;color:var(--muted);white-space:nowrap;direction:ltr}
.pslot.empty{box-shadow:0 0 0 3px var(--night-3)}
.mp-cols{display:flex;gap:18px;width:100%;align-items:center;justify-content:center;flex-wrap:wrap}
.mp-col{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1 1 230px;min-width:0}
.mp-code{display:flex;gap:8px;direction:ltr;justify-content:center;align-items:center}
.mp-code b{width:54px;height:66px;border-radius:16px;background:#fff7e8;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:#2b2452;box-shadow:inset 0 0 0 3px #d8cff7,0 4px 0 rgba(0,0,0,.25)}
.mp-code b.cur{box-shadow:inset 0 0 0 3px var(--gold),0 4px 0 rgba(0,0,0,.25)}
.mp-msg{min-height:1.4em;font-weight:800;color:#ffb3c6!important}
.keypad{display:grid;grid-template-columns:repeat(3,68px);gap:8px;direction:ltr;flex:none}
.keypad button{height:56px;border:0;border-radius:16px;background:#fff7e8;color:#2b2452;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;box-shadow:0 4px 0 #b7a9e6}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 #b7a9e6}
.keypad .ok{background:var(--mint);color:#063d2a;box-shadow:0 4px 0 #2a9c74}
.spin{display:inline-block;animation:spinL 1.2s linear infinite}
@keyframes spinL{to{transform:rotate(360deg)}}
.toast{position:absolute;z-index:25;left:50%;top:calc(14px + var(--sa-t));transform:translateX(-50%);max-width:min(560px,calc(var(--sw) - 32px));background:#fff7e8;color:#3a1f3a;
  font-family:var(--display);font-weight:800;font-size:18px;line-height:1.3;padding:8px 18px;border-radius:18px;box-shadow:0 0 0 3px var(--gold),0 5px 0 rgba(0,0,0,.25);text-align:center;pointer-events:none;animation:bIn .3s ease-out}
#stage.short .pslot img,#stage.short .pslot .wait{max-width:62px} #stage.short .mp-code b{width:44px;height:52px;font-size:34px;border-radius:13px}
#stage.short .keypad{grid-template-columns:repeat(3,62px);gap:6px} #stage.short .keypad button{height:44px;font-size:26px}

/* «بيت عمّو زعلان» additions: mission checklist, timer, A/B buttons, comic word, mission map */
.chips-row .chip.lv{box-shadow:inset 0 0 0 3px var(--gold)}
.chip.time.late{color:#ffb3c6}
.chip.st{font-size:16px;padding:4px 10px;background:rgba(95,227,177,.9);color:#063d2a}
.chip.st.run{background:rgba(255,138,77,.95);color:#fff}
.mlist{display:flex;gap:6px;direction:ltr}
.mi{position:relative;display:flex;align-items:center;gap:2px;background:#fffaf0;color:#3a2a00;border-radius:16px;padding:3px 9px;box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 0 0 3px #e8d9b8;font-family:var(--display);line-height:1}
.mi i{font-style:normal;font-size:23px}
.mi b{font-size:16px;color:#b39a6a;font-weight:800}
.mi em{position:absolute;top:-9px;right:-7px;font-style:normal;font-size:15px;background:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.mi[data-s=held],.mi[data-s=friend]{box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 0 0 3px var(--gold);background:#fff4c8;animation:moodPulse 1s ease-in-out infinite}
.mi[data-s=set]{background:#c9f7e2;box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 0 0 3px var(--mint)}
.mi[data-s=done]{background:var(--gold);box-shadow:0 4px 0 #c48f12,inset 0 0 0 3px #fff3c0}
.mi[data-s=done] i{filter:saturate(1.1)}
.chip.mood[data-m=calm]{box-shadow:inset 0 0 0 3px var(--mint)}
.chip.mood[data-m=sleep]{box-shadow:inset 0 0 0 3px #8fd0ff}
.bbtn{position:absolute;z-index:4;right:calc(max(18px,calc(var(--sa-r) + 8px)) + min(calc(var(--sh) * .3),126px) + 14px);bottom:calc(20px + var(--sa-b));width:88px;height:88px;border-radius:50%;border:3px solid #fff7e8;
  background:rgba(43,36,82,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.28);padding:0;line-height:1;touch-action:none}
.bbtn i{font-style:normal;font-size:34px}
.bbtn b{font-family:var(--display);font-size:15px;font-weight:800;margin-top:2px}
.bbtn::before{content:"B";position:absolute;top:-6px;left:-6px;width:26px;height:26px;border-radius:50%;background:#b99bff;color:#2b1a4a;font:800 15px/26px var(--display);text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.act::before{content:"A";position:absolute;top:-4px;left:-4px;width:30px;height:30px;border-radius:50%;background:#fff7e8;color:#3a2a00;font:800 17px/30px var(--display);text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.bbtn.lit{background:#b99bff;color:#2b1a4a}
.bbtn.on{transform:translateY(3px)}
.bubble.top::before{content:"👴🏻 "}
.peek.bush{background:radial-gradient(circle at 6% 20%,#4f9e48 0 13%,transparent 14%),radial-gradient(circle at 18% 88%,#3f8f3a 0 16%,transparent 17%),radial-gradient(circle at 92% 14%,#5aab52 0 14%,transparent 15%),radial-gradient(circle at 86% 92%,#4f9e48 0 17%,transparent 18%),radial-gradient(circle at 50% 104%,#3f8f3a 0 14%,transparent 15%),radial-gradient(circle at 50% -6%,#5aab52 0 13%,transparent 14%),radial-gradient(circle at 2% 60%,#5aab52 0 12%,transparent 13%),radial-gradient(circle at 98% 56%,#3f8f3a 0 12%,transparent 13%),radial-gradient(ellipse at 50% 52%,transparent 50%,rgba(63,143,58,.55) 75%)}
.comic{position:absolute;z-index:12;left:30%;top:34%;transform:translate(-50%,-50%);pointer-events:none;display:grid;place-items:center}
.comic svg{position:absolute;width:min(470px,52vw);height:auto;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25))}
.comic b{position:relative;font-family:var(--display);font-weight:800;font-size:clamp(34px,8vh,62px);line-height:1;color:#fff;white-space:nowrap;padding:0 20px;
  -webkit-text-stroke:3px #2b1a4a;paint-order:stroke fill;text-shadow:0 6px 0 #2b1a4a,0 0 0 #2b1a4a;transform:rotate(-6deg);unicode-bidi:plaintext}
.comic.go{animation:comicIn 3.2s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes comicIn{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg)}12%{transform:translate(-50%,-50%) scale(1.15) rotate(4deg)}20%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{transform:translate(-50%,-50%) scale(1.03);opacity:1}100%{transform:translate(-50%,-50%) scale(1.2);opacity:0}}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;width:100%}
.lvl{position:relative;border:0;border-radius:20px;background:var(--night);padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 0 0 3px var(--night-3),0 5px 0 rgba(0,0,0,.3);font-family:var(--display);min-width:0}
.lvl .num{position:absolute;top:5px;inset-inline-start:8px;font-size:15px;color:var(--gold)}
.lvl .le{font-size:34px;line-height:1.1}
.lvl .ln{font-weight:800;font-size:14px;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl .lp{font-size:15px;letter-spacing:1px;direction:ltr}
.lvl .ls{font-size:15px;direction:ltr}
.lvl .ls i{font-style:normal;opacity:.45}
.lvl.cur{box-shadow:0 0 0 4px var(--gold),0 5px 0 rgba(0,0,0,.3)}
.lvl.locked{opacity:.5}
.lvl:not(.locked):active{transform:translateY(3px)}
.card h2 small.tot{font-size:18px;color:var(--gold);margin-inline-start:8px}
.tally.mini span{font-size:20px;padding:4px 10px;background:rgba(255,255,255,.12)}
.bigstar .st{display:inline-block;animation:spin .7s ease-out both}
.lvtag{font-family:var(--display);font-weight:800}
.lvtag i{font-style:normal;direction:ltr;unicode-bidi:isolate}
#stage.short .levels{gap:6px} #stage.short .lvl .le{font-size:26px} #stage.short .lvl .ln{font-size:12px} #stage.short .bbtn{width:76px;height:76px}
#stage.short .mi i{font-size:20px} #stage.short .comic b{font-size:44px}
#nogl{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:24px;text-align:center;background:var(--night);font-family:var(--display);font-size:22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="stage">
<div id="saProbe"></div>
<canvas id="cv" aria-label="بيت عمّو زعلان" data-en-aria="Uncle Grumpy's House" data-tr-aria="Somurtkan Amca'nın Evi"></canvas>
<div id="touch"></div>
<div class="peek" id="peek" hidden></div>
<header class="hud" id="hud" hidden>
  <button class="icon-btn" id="btnPause" aria-label="استراحة" data-en-aria="Pause" data-tr-aria="Mola">⏸️</button>
  <button class="icon-btn" id="btnEye" aria-label="شوف بعيوني" data-en-aria="First-person view" data-tr-aria="Birinci şahıs görünüm">👁️</button>
  <button class="icon-btn" id="btnSnd" aria-label="الصوت" data-en-aria="Sound" data-tr-aria="Ses">🔊</button>
  <div class="hud-mid">
    <div class="chips-row"><span class="chip lv" id="hLv"></span><span class="chip time" id="hTime"></span><span class="chip st" id="hCrouch" hidden>🐢</span><span class="chip st run" id="hRun" hidden>🏃</span></div>
    <div class="mlist" id="hList"></div>
  </div>
  <span class="chip mood" id="hMood"></span>
</header>
<div class="joy" id="joy" hidden><div class="knob" id="knob"></div></div>
<button class="act" id="btnAct" hidden><i id="actI"></i><b id="actB"></b></button>
<button class="bbtn" id="btnB" hidden><i id="bI"></i><b id="bB"></b></button>
<div class="slot" id="slot" hidden><i id="slotI"></i><b id="slotB"></b></div>
<div class="bubble" id="bubble" hidden><span id="bubbleT"></span></div>
<div class="hint" id="hint" hidden></div>
<div class="comic" id="comic" hidden><svg viewBox="0 0 200 120" aria-hidden="true"><path d="M100 4 L116 30 L146 10 L142 40 L190 34 L160 58 L196 80 L152 82 L162 114 L124 94 L100 118 L84 92 L44 112 L52 80 L6 80 L40 58 L8 32 L56 38 L52 8 L84 30Z" fill="var(--cc,#ffcd4d)" stroke="#2b1a4a" stroke-width="5" stroke-linejoin="round"/></svg><b id="comicT"></b></div>
<div class="flash" id="flash"></div>
<div class="overlay" id="overlay"><div class="card" id="card"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="nogl" hidden><span data-en="Sorry, this phone can't show 3D games 😢" data-tr="Üzgünüz, bu telefon 3D oyunları gösteremiyor 😢">عذراً، هالتلفون ما بيقدر يشغّل ألعاب ثلاثية الأبعاد 😢</span></div>
</div>

<script src="../world.js"></script>
<script type="module" src="game.js"></script>
<script src="../back.js"></script>
<script>BoboBack.init({
  visible: () => { const o = document.getElementById('overlay'), g = window.__prank; return !o.hidden && (!g || g.state === 'title' || g.state === 'select' || g.state === 'mp' || g.state === 'levels'); },
  onBack: () => { const g = window.__prank; if(g && (g.state === 'select' || g.state === 'mp' || g.state === 'levels')) g.back(); else location.href = '../'; },
  mount: document.getElementById('stage')
});</script>
<script src="../friends.js"></script>
<script src="../invitepop.js"></script>
</body>
</html>
