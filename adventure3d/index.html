<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="../i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title data-en="Bobo's Adventure 3D" data-tr="Bobo'nun Macerası 3D">مغامرة بوبو ثلاثي الأبعاد</title>
<meta name="description" content="لعبة أطفال ثلاثية الأبعاد: لفّ الجزيرة مع بوبو، اجمع العسل ولاقي العشر نجوم." data-en="A 3D kids' game: explore the island with Bobo, collect honey and find all 10 stars." data-tr="3D çocuk oyunu: Bobo ile adayı gez, bal topla ve 10 yıldızı bul.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bobo Land">
<meta name="theme-color" content="#1c1838">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Full-screen WebGL island. HUD on top, joystick bottom-left, jump bottom-right, menus as overlays. */
:root{
  --night:#1c1838; --night-2:#2a2452; --night-3:#362e68; --wall-face:#2f2858;
  --ink:#fff7e8; --muted:#bdb4e6; --gold:#ffcd4d; --mint:#5fe3b1; --pink:#ff8fb8;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* #stage holds the whole game. The app is locked to portrait, so when the viewport is portrait the stage is
   rotated 90° clockwise (game top = right edge of the phone) and sized to the landscape size. JS sets size/transform. */
#stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0;
  --sa-t:env(safe-area-inset-top,0px);--sa-r:env(safe-area-inset-right,0px);--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px);--sw:100vw;--sh:100vh}
#stage.rot{--sa-t:env(safe-area-inset-right,0px);--sa-r:env(safe-area-inset-bottom,0px);--sa-b:env(safe-area-inset-left,0px);--sa-l:env(safe-area-inset-top,0px)}
#saProbe{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;width:var(--sa-l);height:var(--sa-b)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#touch{position:absolute;inset:0;z-index:2;touch-action:none}

.hud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;gap:8px;pointer-events:none;
  padding:calc(8px + var(--sa-t)) max(12px,var(--sa-r)) 0 max(12px,var(--sa-l))}
.hud > *{pointer-events:auto}
.icon-btn{width:46px;height:46px;flex:none;border:0;border-radius:15px;background:rgba(28,24,56,.78);font-size:22px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.compass{width:54px;height:54px;border-radius:50%;background:rgba(28,24,56,.72);display:grid;place-items:center;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.compass svg{width:40px;height:40px;fill:var(--gold);stroke:#7a5200;stroke-width:1.5;transition:transform .08s linear}
.compass b{position:absolute;bottom:-6px;font-size:16px;line-height:1}
.timer{font-family:var(--display);font-size:22px!important;background:#ff5d73!important;color:#fff;padding:4px 14px!important}
.chips{display:flex;gap:6px;flex:none;direction:ltr;flex-wrap:wrap;justify-content:flex-end;max-width:calc(var(--sw) * .62)}
.chip{background:rgba(28,24,56,.78);border-radius:999px;padding:6px 10px;font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px}

.joy{position:absolute;z-index:4;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,247,232,.16);border:3px solid rgba(255,247,232,.45);pointer-events:none;
  box-shadow:0 5px 0 rgba(0,0,0,.2)}
.joy.on{background:rgba(255,247,232,.24)}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,247,232,.8);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.jump{position:absolute;z-index:4;right:max(18px,calc(var(--sa-r) + 8px));bottom:calc(22px + var(--sa-b));--s:min(calc(var(--sw) * .27),108px);width:var(--s);height:var(--s);
  border-radius:50%;border:3px solid rgba(255,224,140,.85);background:rgba(255,205,77,.5);display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.25);touch-action:none}
.jump svg{width:46%;height:46%;fill:#fff7e8}
.jump.on{transform:translateY(4px) scale(.96);background:rgba(255,205,77,.8);box-shadow:0 1px 0 rgba(0,0,0,.25)}
#stage.short .jump{--s:min(calc(var(--sh) * .24),100px)}
#stage.short .joy{width:110px;height:110px;margin:-55px 0 0 -55px}

.toast{position:absolute;left:50%;top:calc(126px + var(--sa-t));transform:translateX(-50%);z-index:6;background:var(--ink);color:var(--night);
  font-family:var(--display);font-weight:800;font-size:19px;padding:8px 18px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.35);animation:pop .25s ease-out;pointer-events:none}
#stage.short .toast{top:calc(70px + var(--sa-t))}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

.overlay{position:absolute;inset:0;z-index:20;display:flex;background:rgba(18,14,40,.55);overflow-y:auto;
  padding-left:max(16px,var(--sa-l));padding-right:max(16px,var(--sa-r));
  padding-block:calc(16px + var(--sa-t)) calc(16px + var(--sa-b))}
.overlay.dim{background:rgba(18,14,40,.8)}
.overlay.title{background:linear-gradient(90deg,rgba(18,14,40,.5),rgba(18,14,40,0) 60%)}
.overlay.title .card{margin:auto auto auto 0}
.card{width:100%;max-width:440px;margin:auto;background:rgba(42,36,82,.94);border-radius:28px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
  box-shadow:0 0 0 3px var(--night-3),0 24px 60px rgba(0,0,0,.5);animation:cardIn .3s ease-out}
.card.wide{max-width:780px}
@keyframes cardIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card h1{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.1;margin:0;color:var(--gold);text-shadow:0 4px 0 var(--wall-face);text-wrap:balance}
.card h1 small{display:block;font-size:22px;color:var(--ink);text-shadow:none;margin-top:2px}
.card h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.6;font-size:16px;text-wrap:balance}
.big-btn{border:0;border-radius:20px;background:var(--gold);color:#3a2a00;font-family:var(--display);font-weight:800;font-size:24px;
  padding:12px 26px;min-width:200px;box-shadow:0 6px 0 #c48f12}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c48f12}
.ghost-btn{border:0;background:var(--night-3);border-radius:16px;padding:11px 18px;font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--wall-face);text-decoration:none;color:var(--ink);display:inline-block}
.ghost-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wall-face)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bigstar{font-size:76px;line-height:1;animation:spin .7s ease-out;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
@keyframes spin{from{transform:scale(0) rotate(-200deg)}to{transform:scale(1) rotate(0)}}
.tally{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;direction:ltr}
.tally span{background:var(--night);border-radius:16px;padding:8px 14px;font-weight:700;font-size:18px}
.starrow{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:24px;direction:ltr}
.starrow i{font-style:normal}
.starrow i.off{filter:grayscale(1);opacity:.3}
.how{list-style:none;margin:0;padding:12px 14px;background:var(--night);border-radius:18px;display:grid;gap:8px;text-align:start;width:100%}
.how li{display:flex;gap:10px;align-items:center;font-size:15px;line-height:1.4}
.how li span:first-child{font-size:22px;width:30px;text-align:center;flex:none}
/* "turn your phone" hint (only shown while the game is rotated) */
.rothint{display:flex;align-items:center;gap:10px;background:var(--gold);color:#3a2a00;border-radius:18px;padding:6px 16px 6px 12px;font-family:var(--display);font-weight:800;font-size:18px;box-shadow:0 4px 0 #c48f12}
.rothint i{font-style:normal;font-size:30px;line-height:1;display:inline-block;animation:rotphone 2.6s ease-in-out infinite}
@keyframes rotphone{0%,20%{transform:rotate(-90deg)}55%,85%{transform:rotate(-180deg)}100%{transform:rotate(-90deg)}}
/* hero picker */
.heroes{display:flex;gap:10px;justify-content:center;width:100%}
.hero{flex:1 1 0;min-width:0;max-width:168px;border:0;border-radius:22px;background:var(--night);padding:8px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 0 0 3px var(--night-3),0 5px 0 rgba(0,0,0,.3);transition:transform .15s}
.hero canvas{width:100%;aspect-ratio:1;border-radius:16px;display:block;background:#2a2452}
.hero b{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.2}
.hero.on{background:#4a3f8c;box-shadow:0 0 0 4px var(--gold),0 5px 0 rgba(0,0,0,.3);transform:translateY(-4px)}
.hero.on b{color:var(--gold)}
#nogl{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:24px;text-align:center;background:var(--night);font-family:var(--display);font-size:22px}
#stage.short .card{gap:8px;padding:12px 16px} #stage.short .card h1{font-size:28px} #stage.short .card h1 small{font-size:18px} #stage.short .card h2{font-size:23px}
#stage.short .how{display:none} #stage.short .bigstar{font-size:50px} #stage.short .big-btn{font-size:20px;padding:8px 22px} #stage.short .starrow{font-size:20px}
#stage.short .tally span{padding:5px 12px;font-size:16px} #stage.short .ghost-btn{padding:8px 14px;font-size:16px} #stage.short .hero b{font-size:18px}
#stage.short .rothint{font-size:16px;padding:4px 14px 4px 10px} #stage.short .rothint i{font-size:24px}
/* online play with friends */
.big-btn.alt{background:var(--pink);color:#4a0f2a;box-shadow:0 6px 0 #c45a83}
.big-btn.alt:active{box-shadow:0 2px 0 #c45a83}
.big-btn.mint{background:var(--mint);color:#063d2a;box-shadow:0 6px 0 #2a9c74}
.big-btn.mint:active{box-shadow:0 2px 0 #2a9c74}
.big-btn:disabled{opacity:.45;transform:none}
.mp-cols{display:flex;gap:18px;width:100%;align-items:center;justify-content:center;flex-wrap:wrap}
.mp-col{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1 1 250px;min-width:0}
.mp-code{display:flex;gap:8px;direction:ltr;justify-content:center;align-items:center}
.mp-code b{width:54px;height:66px;border-radius:16px;background:var(--night);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--gold);box-shadow:inset 0 0 0 3px var(--night-3),0 4px 0 rgba(0,0,0,.3)}
.mp-code b.cur{box-shadow:inset 0 0 0 3px var(--gold),0 4px 0 rgba(0,0,0,.3)}
.mp-code .copy{width:54px;height:54px;border:0;border-radius:16px;background:var(--night-3);font-size:24px;box-shadow:0 4px 0 var(--wall-face);margin-inline-start:4px}
.mp-code .copy:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wall-face)}
.mp-lbl{font-weight:700;color:var(--muted);font-size:15px}
.mp-msg{min-height:1.4em;font-weight:700;color:var(--pink)!important}
.keypad{display:grid;grid-template-columns:repeat(3,68px);gap:8px;direction:ltr;flex:none}
.keypad button{height:56px;border:0;border-radius:16px;background:var(--night-3);font-family:var(--display);font-weight:800;font-size:30px;line-height:1;box-shadow:0 4px 0 var(--wall-face)}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wall-face)}
.keypad .ok{background:var(--mint);color:#063d2a;box-shadow:0 4px 0 #2a9c74}
.keypad .del{font-size:24px}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:360px}
.slot{background:var(--night);border-radius:18px;padding:7px;display:flex;align-items:center;gap:8px;box-shadow:inset 0 0 0 3px var(--c);min-height:66px;position:relative;text-align:start}
.slot img{width:52px;height:52px;border-radius:12px;flex:none;display:block}
.slot b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.15;color:var(--c);display:block}
.slot small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.slot .crown{position:absolute;top:-12px;inset-inline-end:-4px;font-size:22px}
.slot.empty{box-shadow:none;outline:3px dashed var(--night-3);outline-offset:-3px;justify-content:center;opacity:.7;font-size:26px}
.mp-hero{width:84px;height:84px;border-radius:20px;box-shadow:0 0 0 3px var(--gold)}
.mpbar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;direction:ltr;pointer-events:none}
.mpscore{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip.ps{box-shadow:inset 0 0 0 3px var(--c);padding:3px 10px 3px 3px;gap:5px}
.chip.ps img{width:28px;height:28px;border-radius:50%;display:block;background:var(--night)}
.chip.ps.me{background:rgba(74,63,140,.95)}
.mpcd{position:absolute;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none;font-family:var(--display);font-weight:800;font-size:120px;line-height:1;color:var(--gold);text-shadow:0 7px 0 var(--wall-face),0 0 30px rgba(0,0,0,.35)}
.mpcd span{animation:pop2 .35s ease-out}
@keyframes pop2{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;direction:ltr;width:100%}
.pod{display:flex;flex-direction:column;align-items:center;gap:3px;width:112px;min-width:0}
.pod img{width:62px;height:62px;border-radius:16px;box-shadow:0 0 0 3px var(--c);display:block}
.pod b{font-family:var(--display);font-weight:800;font-size:17px;color:var(--c);line-height:1.2}
.pod span{font-weight:700;font-size:17px}
.pod .blk{width:100%;border-radius:14px 14px 6px 6px;background:var(--c);display:grid;place-items:center;font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.pod.me img{box-shadow:0 0 0 3px var(--c),0 0 0 7px var(--ink)}
.rest{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:ltr}
.spin{display:inline-block;animation:spinL 1.2s linear infinite}
@keyframes spinL{to{transform:rotate(360deg)}}
#stage.short .mp-code b{width:44px;height:52px;font-size:34px;border-radius:13px} #stage.short .mp-code .copy{width:46px;height:46px}
#stage.short .keypad{grid-template-columns:repeat(3,62px);gap:6px} #stage.short .keypad button{height:46px;font-size:26px}
#stage.short .slot{min-height:54px;padding:5px} #stage.short .slot img{width:42px;height:42px} #stage.short .slot b{font-size:16px}
#stage.short .mp-hero{width:60px;height:60px} #stage.short .mpcd{font-size:90px}
#stage.short .pod img{width:48px;height:48px} #stage.short .pod .blk{font-size:24px} #stage.short .pod b,#stage.short .pod span{font-size:15px}
#stage.short .chip.ps img{width:24px;height:24px} #stage.short.mpon .toast{top:calc(112px + var(--sa-t))}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<body>
<div id="stage">
<div id="saProbe"></div>
<canvas id="cv" aria-label="مغامرة بوبو ثلاثي الأبعاد" data-en-aria="Bobo's Adventure 3D" data-tr-aria="Bobo'nun Macerası 3D"></canvas>
<div id="touch"></div>

<header class="hud" id="hud" hidden>
  <button class="icon-btn" id="btnPause" aria-label="استراحة" data-en-aria="Pause" data-tr-aria="Mola">⏸️</button>
  <div class="hud-mid">
    <div class="mpbar" id="mpBar" hidden><span class="chip timer" id="mpTimer"></span><span class="mpscore" id="mpScore"></span></div>
    <div class="compass" id="compass" aria-hidden="true"><svg viewBox="0 0 40 40" id="arrow"><path d="M20 3 L32 31 L20 25 L8 31 Z"/></svg><b>⭐</b></div>
    <span class="chip timer" id="timer" hidden></span>
  </div>
  <div class="chips">
    <span class="chip" id="hudHearts"></span>
    <span class="chip" id="hudHoney"></span>
    <span class="chip" id="hudStars"></span>
  </div>
</header>

<div class="joy" id="joy" hidden><div class="knob" id="knob"></div></div>
<button class="jump" id="btnJump" hidden aria-label="نطّ" data-en-aria="Jump" data-tr-aria="Zıpla"><svg viewBox="0 0 24 24"><path d="M12 3 21 13h-5.5v8h-7v-8H3z"/></svg></button>

<div class="mpcd" id="mpCd" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="overlay" id="overlay"><div class="card" id="card"></div></div>
<div id="nogl" hidden><span data-en="Sorry, this phone can't show 3D games 😢" data-tr="Üzgünüz, bu telefon 3D oyunları gösteremiyor 😢">عذراً، هالتلفون ما بيقدر يشغّل ألعاب ثلاثية الأبعاد 😢</span></div>
</div>

<script src="../world.js"></script>
<script type="module">
import * as THREE from './three.module.min.js';

const $ = s => document.querySelector(s);
{ const md = document.querySelector('meta[name="description"]'), dl = window.I18N && md && md.getAttribute('data-' + I18N.lang); if(dl) md.setAttribute('content', dl); }
const N = n => window.I18N ? I18N.num(n) : String(n);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('adv3d_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('adv3d_' + k, JSON.stringify(v)); }catch(e){} }
};
const rawGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const rawSet = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };

/* ---------- Always-landscape stage ----------
   The app is a portrait-locked TWA, so when the viewport is portrait we rotate the whole game layer 90° clockwise
   (the game's top sits at the right edge of the phone; the kid turns the phone with its left side down).
   Stage coords: SW × SH (always landscape). toLayer() maps screen (clientX, clientY) into stage coords. */
const stage = $('#stage'), saProbe = $('#saProbe');
let ROT = false, VW = innerWidth, SW = innerWidth, SH = innerHeight, SAL = 0, SAB = 0;
function layout(){
  VW = innerWidth; const vh = innerHeight; ROT = vh > VW;
  SW = ROT ? vh : VW; SH = ROT ? VW : vh;
  const st = stage.style;
  st.width = SW + 'px'; st.height = SH + 'px';
  st.transform = ROT ? `translateX(${VW}px) rotate(90deg)` : 'none';
  st.setProperty('--sw', SW + 'px'); st.setProperty('--sh', SH + 'px');
  stage.classList.toggle('rot', ROT); stage.classList.toggle('short', SH <= 520);
  SAL = saProbe.offsetWidth; SAB = saProbe.offsetHeight;
}
function toLayer(cx, cy){ return ROT ? { x:cy, y:VW - cx } : { x:cx, y:cy }; }
function tryLandscapeLock(){ try{ const o = screen.orientation; if(o && o.lock) o.lock('landscape').catch(() => {}); }catch(e){} }
layout(); tryLandscapeLock();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => { let d = a - b; while(d > Math.PI) d -= Math.PI * 2; while(d < -Math.PI) d += Math.PI * 2; return d; };

/* ---------- Geometry merge helper: one draw call for lots of static, vertex-coloured pieces ---------- */
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _v = new THREE.Vector3(), _c = new THREE.Color();
class Merge{
  constructor(){ this.p = []; this.n = []; this.c = []; }
  add(geo, x, y, z, sx = 1, sy = 1, sz = 1, rx = 0, ry = 0, rz = 0, color = 0xffffff){
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    _m.compose(_v.set(x, y, z), _q.setFromEuler(_e.set(rx, ry, rz)), _s.set(sx, sy, sz));
    g.applyMatrix4(_m);
    const pa = g.attributes.position.array, na = g.attributes.normal.array;
    _c.set(color);
    for(let i = 0; i < pa.length; i++){ this.p.push(pa[i]); this.n.push(na[i]); }
    for(let i = 0; i < pa.length / 3; i++) this.c.push(_c.r, _c.g, _c.b);
    g.dispose(); return this;
  }
  geometry(){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.n, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    g.computeBoundingSphere(); return g;
  }
}

/* ---------- The island: height field ---------- */
const R = 62;
const riverZ = x => 4 + 3 * Math.sin(x * 0.08);
function riverC(x, z){ return 1 - smooth(2.6, 5.2, Math.abs(z - riverZ(x))); }
function H(x, z){
  const d = Math.hypot(x, z) / R + 0.035 * Math.sin(Math.atan2(z, x) * 5 + 1);
  let h = 1.4 - 4.4 * smooth(0.7, 1.05, d);
  h += 0.35 * Math.sin(x * 0.13 + 1) * Math.cos(z * 0.11) * (1 - smooth(0.6, 0.82, d));
  h += 8.5 * (1 - smooth(9, 19, Math.hypot(x, z + 38)));          // castle hill
  h += 2.2 * Math.exp(-((x - 18) ** 2 + (z + 22) ** 2) / 40);      // little east knoll
  h += 1.6 * Math.exp(-((x + 12) ** 2 + (z - 46) ** 2) / 30);      // dune
  return lerp(h, -1.7, riverC(x, z));                                // river
}

/* ---------- Camera ---------- */
const cam = { yaw:0, pitch:.34, dist:7.2, dragT:-9, tx:0, ty:0, tz:0 };
let snapCam = true;
const camPos = new THREE.Vector3();
function rayBlock(ox, oy, oz, dx, dy, dz, max){
  let best = max;
  const test = (x0, y0, z0, x1, y1, z1) => {
    let tmin = 0, tmax = best;
    const o = [ox, oy, oz], d = [dx, dy, dz], lo = [x0, y0, z0], hi = [x1, y1, z1];
    for(let a = 0; a < 3; a++){
      if(Math.abs(d[a]) < 1e-8){ if(o[a] < lo[a] || o[a] > hi[a]) return; }
      else { let t1 = (lo[a] - o[a]) / d[a], t2 = (hi[a] - o[a]) / d[a]; if(t1 > t2){ const s = t1; t1 = t2; t2 = s; } tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2); if(tmin > tmax) return; }
    }
    if(tmin > .05 && tmin < best) best = tmin;
  };
  for(const b of boxes) if(b.cam) test(b.x0, b.y0, b.z0, b.x1, b.y1, b.z1);
  for(const c of cyls) if(c.cam) test(c.x - c.r * .8, c.y0, c.z - c.r * .8, c.x + c.r * .8, c.y1, c.z + c.r * .8);
  return best;
}
function updateCamera(dt){
  const cave = inCave(P.x, P.z, P.y);
  if(T - cam.dragT > 1.2 && P.move > .3 && !cave){
    const want = Math.atan2(-Math.sin(P.face), -Math.cos(P.face)), d = angDiff(want, cam.yaw);
    if(Math.abs(d) < 2.3) cam.yaw += d * Math.min(1, dt * 1.1 * P.move);
  }
  const k = snapCam ? 1 : 1 - Math.exp(-10 * dt);
  cam.tx = lerp(cam.tx, P.x, k); cam.ty = lerp(cam.ty, P.y + 1.15, 1 - Math.exp(-(snapCam ? 99 : 6) * dt)); cam.tz = lerp(cam.tz, P.z, k);
  const pitch = cave ? .1 : cam.pitch, dist = (cave ? 4 : cam.dist) * (portrait ? 1.12 : 1);
  let dx = Math.sin(cam.yaw) * Math.cos(pitch), dy = Math.sin(pitch), dz = Math.cos(cam.yaw) * Math.cos(pitch);
  const t = rayBlock(cam.tx, cam.ty, cam.tz, dx, dy, dz, dist), dd = Math.max(1.2, t - .35);
  let x = cam.tx + dx * dd, y = cam.ty + dy * dd, z = cam.tz + dz * dd;
  y = Math.max(y, H(x, z) + .6, .5);
  if(snapCam){ camPos.set(x, y, z); snapCam = false; } else camPos.lerp(_v.set(x, y, z), 1 - Math.exp(-14 * dt));
  camera.position.copy(camPos); camera.lookAt(cam.tx, cam.ty + .2, cam.tz);
}

/* ---------- Per-frame visuals ---------- */
function animate(dt){
  // the hero
  hero.grp.position.set(P.x, P.y, P.z); hero.grp.rotation.y = P.face;
  P.sqv += (-P.sq * 180 - P.sqv * 14) * dt; P.sq += P.sqv * dt;
  if(P.flip > 0) P.flip = Math.max(0, P.flip - dt * 2.4);
  poseHero(hero, { t:T, dt, run:P.move, grounded:P.grounded, vy:P.vy, sq:P.sq, flip:P.flip });
  hero.grp.visible = P.inv <= 0 || Math.floor(P.inv * 12) % 2 === 0;
  const gh = groundInfo(P.x, P.z, P.y + .1, 0).h, hh = P.y - gh, ss = clamp(1.1 - hh * .08, .45, 1.1);
  pShadow.position.set(P.x, gh + .04, P.z); pShadow.scale.set(ss * 1.1, 1, ss * 1.1); pShadow.visible = gh > -.2;
  // honey spin
  const mpOn = mpActive();
  for(let i = 0; i < HONEY.length; i++){
    const h = HONEY[i];
    if(mpOn || honeyGot.has(i)) _m.makeScale(0, 0, 0);
    else _m.compose(_v.set(h[0], h[1] + Math.sin(T * 2.5 + i) * .1, h[2]), _q.setFromEuler(_e.set(0, T * 2.4 + i, 0)), _s.set(1, 1, 1));
    honeyMesh.setMatrixAt(i, _m);
  }
  honeyMesh.instanceMatrix.needsUpdate = true;
  // stars
  starObjs.forEach((o, i) => {
    o.grp.visible = !mpOn && starVisible(i);
    if(!o.grp.visible) return;
    o.m.rotation.y = T * 1.8; o.grp.position.y = STARS[i].at[1] + Math.sin(T * 2 + i) * .18;
  });
  // enemies + shadows
  let si = 0;
  for(const e of enemies){
    if(state === 'play' || state === 'title') placeEnemy(e, dt);
    e.grp.visible = e.alive && !mpOn;
    if(e.alive && !mpOn && si < 24){ _m.compose(_v.set(e.x, e.gy + .05, e.z), _q.identity(), _s.set(1.2, 1, 1.2)); eShadows.setMatrixAt(si++, _m); }
  }
  for(; si < 24; si++){ _m.makeScale(0, 0, 0); eShadows.setMatrixAt(si, _m); }
  eShadows.instanceMatrix.needsUpdate = true;
  // misc
  cpFlags.forEach((c, i) => { c.f.material.color.setHex(i === cp ? 0xffcd4d : 0xbfb8d6); c.f.rotation.y = Math.sin(T * 3 + i) * .25; });
  raceFlag.rotation.y = Math.sin(T * 2.5) * .2; castleBanner.rotation.y = Math.sin(T * 2) * .2;
  rings.forEach((r, i) => { r.m.scale.setScalar(1 + Math.sin(T * 3 + i) * .04); });
  waterTex.offset.set(T * .01, T * .006);
  cloudsGrp.rotation.y = T * .004;
  if(mushBounce > 0) mushBounce = Math.max(0, mushBounce - dt * 3);
  updateParts(dt);
}

function nearestTarget(){
  let best = null, bd = 1e9;
  STARS.forEach((s, i) => {
    if(starsGot[i]) return;
    const [x, z] = starVisible(i) ? [s.at[0], s.at[2]] : s.anchor();
    const d = (x - P.x) ** 2 + (z - P.z) ** 2;
    if(d < bd){ bd = d; best = [x, z]; }
  });
  return best ? { x:best[0], z:best[1], d:Math.sqrt(bd) } : null;
}
const compassEl = $('#compass'), arrowEl = $('#arrow'), timerEl = $('#timer');
function hudFrame(){
  const t = mpActive() ? mpNearest() : nearestTarget();
  if(!t || t.d < 2.5){ compassEl.style.visibility = 'hidden'; }
  else {
    compassEl.style.visibility = 'visible';
    const dx = t.x - P.x, dz = t.z - P.z, fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
    const a = Math.atan2(dx * rx + dz * rz, dx * fx + dz * fz);

  if(race.active){ timerEl.hidden = false; timerEl.textContent = '⏱️ ' + N(Math.ceil(race.t)); } else timerEl.hidden = true;

}

  }).join('');
  let status;
  if(busy) status = L('في سباق شغّال هلّق، استنّى يخلص ⏳', 'A race is on right now — wait for it to finish ⏳', 'Şu an bir yarış var, bitmesini bekle ⏳');
  else if(MP.isHost) status = pl.length < 2 ? L('استنّى أصحابك يفوتوا…', 'Waiting for friends to join…', 'Arkadaşlarının katılmasını bekle…') : L('كلّ شي جاهز؟ بلّش!', 'Everyone ready? Start!', 'Herkes hazır mı? Başla!');
  else status = L('استنّى صاحب الغرفة يبلّش ⏳', 'Waiting for the room owner to start ⏳', 'Oda sahibinin başlatmasını bekle ⏳');
  card.innerHTML = `<h2>👫 ${L('سباق النجوم', 'Star Rush', 'Yıldız Yarışı')}</h2>
    <div class="mp-cols"><div class="mp-col"><span class="mp-lbl">${L('رقم الغرفة', 'Room number', 'Oda numarası')}</span>
      <div class="mp-code" id="roomCode">${[...MP.code].map(d => `<b>${N(d)}</b>`).join('')}<button class="copy" id="bCopy" aria-label="${L('انسخ', 'Copy', 'Kopyala')}">📋</button></div>
      <p>${L('قول لأصحابك هالرقم 👆', 'Tell your friends this number 👆', 'Bu numarayı arkadaşlarına söyle 👆')}</p></div>
    <div class="mp-col"><div class="slots" id="slots">${slots}</div><p id="lobbyMsg">${status}</p></div></div>
    <div class="row">${MP.isHost && !busy ? `<button class="big-btn" id="bStart"${pl.length < 2 ? ' disabled' : ''}>▶️ ${L('يلّا نبلّش', 'Start', 'Başla')}</button>` : ''}
    <button class="ghost-btn" id="bHero">🦸 ${L('غيّر الشخصية', 'Change hero', 'Kahramanı değiştir')}</button>
    <button class="ghost-btn" id="bLeave">🚪 ${L('اطلع', 'Leave', 'Ayrıl')}</button></div>`;
  const bs = $('#bStart'); if(bs) bs.onclick = () => { SFX.tap(); mpStart(); };
  $('#bHero').onclick = () => { SFX.tap(); showSelect('lobby'); };
  $('#bLeave').onclick = () => { SFX.tap(); mpLeave(); };
  $('#bCopy').onclick = () => {
    SFX.tap(); const b = $('#bCopy'), done = () => { if(b.isConnected){ b.textContent = '✅'; setTimeout(() => { if(b.isConnected) b.textContent = '📋'; }, 1500); } };
    try{ navigator.clipboard.writeText(MP.code).then(done, () => { mpCopyFallback(); done(); }); }catch(e){ mpCopyFallback(); done(); }
  };
}
function mpCopyFallback(){ try{ const t = document.createElement('textarea'); t.value = MP.code; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }catch(e){} }

/* ---------- Main loop ---------- */
let last = performance.now(), fpsN = 0, fpsT = 0, fps = 60, slowT = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if(dt > .05) dt = .05; if(dt <= 0) dt = .001;
  fpsN++; fpsT += dt;
  if(fpsT >= 1){
    fps = fpsN / fpsT; fpsN = 0; fpsT = 0;
    // adaptive resolution for slower phones
    if(state === 'play' && fps < 42 && dpr > 1){ slowT++; if(slowT >= 2){ dpr = Math.max(1, dpr - .25); renderer.setPixelRatio(dpr); slowT = 0; } } else slowT = 0;
  }
  if(state === 'play'){
    if(mpFrozen()){ P.move = 0; T += dt; }
    else { let rest = dt; while(rest > 0){ const h = Math.min(rest, 1 / 60); step(h); rest -= h; } }
    updateCamera(dt); hudFrame();
  } else if(state === 'title' || state === 'mp' || (state === 'select' && selFrom !== 'pause')){
    T += dt;
    const a = T * .06;
    camera.position.set(Math.sin(a) * 74, 30, Math.cos(a) * 74); camera.lookAt(0, portrait ? -16 : 0, 0);
    updateMovers(T);
  }
  animate(dt);
  mpFrame(dt);
  if(state === 'select') renderPreviews(dt);
  sky.position.copy(camera.position);
  sunGlow.position.copy(camera.position).add(_v.set(150, 210, -260));
  renderer.render(scene, camera);
}

/* debug / test hook */
window.__adv3d = {
  get state(){ return state; }, get hero(){ return heroId; }, get rot(){ return ROT; }, get stage(){ return [SW, SH]; }, toLayer, setHero:id => setHero(id, true), get fps(){ return fps; }, get dpr(){ return dpr; }, P, cam,
  get stars(){ return starsGot.slice(); }, get honey(){ return honeyCount; }, starPos:i => STARS[i].at.slice(),
  teleport(x, z, y){ P.x = x; P.z = z; P.y = y != null ? y : groundTop(x, z) + .1; P.vx = P.vz = P.vy = 0; snapCam = true; },
  collectStar(i){ unlocked.rings = unlocked.meadow = unlocked.race = true; collectStar(i); },
  unlockAll(){ unlocked.rings = unlocked.meadow = unlocked.race = true; },
  info(){ return renderer.info.render; }, movers:() => movers.map(m => [m.cx, m.cy, m.cz]), enemies:() => enemies.map(e => [e.type, e.x, e.y, e.z, e.alive]), start:() => startPlay(),
  mp:{
    get screen(){ return MP.screen; }, get code(){ return MP.code; }, get id(){ return MP.id; }, get isHost(){ return MP.isHost; }, get local(){ return MP_LOCAL; },
    get players(){ return MP.players.map(p => ({ id:p.id, hero:p.hero, c:p.c, o:p.o, ph:p.ph })); }, get active(){ return mpActive(); }, get frozen(){ return mpFrozen(); },
    get own(){ return MP.match ? MP.match.own.slice() : null; }, get scores(){ return MP.match ? mpCounts(MP.match.own) : null; }, get honey(){ return MP.match ? MP.match.hn : 0; },
    get pool(){ return MP_POOL.length; }, get stars(){ return MP.match ? MP.match.stars.map(s => s.slice()) : null; }, get end(){ return MP.lastEnd; },
    visibleStars(){ return raceStars.filter(s => s.grp.visible).length; },
    remotes(){ return [...MP.remotes.values()].map(r => ({ id:r.id, hero:r.hero, c:r.c, visible:r.h.grp.visible, x:r.h.grp.position.x, y:r.h.grp.position.y, z:r.h.grp.position.z })); },
    goStar(i){ const s = MP.match.stars[i]; P.x = s[0]; P.z = s[2]; P.y = s[1] - 1.25; P.vx = P.vz = P.vy = 0; snapCam = true; },
    setTimeLeft(sec){ if(MP.match) MP.match.endAt = performance.now() + sec * 1000; }, skipCountdown(){ if(MP.match) MP.match.cdEnd = performance.now(); }
  }
};

resize(); hud(); showTitle();
requestAnimationFrame(frame);
</script>
</body>
