<style>
/* Full-screen WebGL island. HUD on top, joystick bottom-left, jump bottom-right, menus as overlays. */
:root{
  --night:#1c1838; --night-2:#2a2452; --night-3:#362e68; --wall-face:#2f2858;
  --ink:#fff7e8; --muted:#bdb4e6; --gold:#ffcd4d; --mint:#5fe3b1; --pink:#ff8fb8;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#touch{position:fixed;inset:0;z-index:2;touch-action:none}

.hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;gap:8px;pointer-events:none;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.hud > *{pointer-events:auto}
.icon-btn{width:46px;height:46px;flex:none;border:0;border-radius:15px;background:rgba(28,24,56,.78);font-size:22px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.compass{width:54px;height:54px;border-radius:50%;background:rgba(28,24,56,.72);display:grid;place-items:center;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.compass svg{width:40px;height:40px;fill:var(--gold);stroke:#7a5200;stroke-width:1.5;transition:transform .08s linear}
.compass b{position:absolute;bottom:-6px;font-size:16px;line-height:1}
.timer{font-family:var(--display);font-size:22px!important;background:#ff5d73!important;color:#fff;padding:4px 14px!important}
.chips{display:flex;gap:6px;flex:none;direction:ltr;flex-wrap:wrap;justify-content:flex-end;max-width:62vw}
.chip{background:rgba(28,24,56,.78);border-radius:999px;padding:6px 10px;font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px}
@media (max-width:420px){ .chip{font-size:15px;padding:5px 8px} }

.joy{position:fixed;z-index:4;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,247,232,.16);border:3px solid rgba(255,247,232,.45);pointer-events:none;
  box-shadow:0 5px 0 rgba(0,0,0,.2)}
.joy.on{background:rgba(255,247,232,.24)}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,247,232,.8);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.jump{position:fixed;z-index:4;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));--s:min(27vw,108px);width:var(--s);height:var(--s);
  border-radius:50%;border:3px solid rgba(255,224,140,.85);background:rgba(255,205,77,.5);display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.25);touch-action:none}
.jump svg{width:46%;height:46%;fill:#fff7e8}
.jump.on{transform:translateY(4px) scale(.96);background:rgba(255,205,77,.8);box-shadow:0 1px 0 rgba(0,0,0,.25)}
@media (orientation:landscape) and (max-height:500px){ .jump{--s:min(22vh,96px)} .joy{width:110px;height:110px;margin:-55px 0 0 -55px} }

.toast{position:fixed;left:50%;top:calc(126px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;background:var(--ink);color:var(--night);
  font-family:var(--display);font-weight:800;font-size:19px;padding:8px 18px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.35);animation:pop .25s ease-out;pointer-events:none}
@media (orientation:landscape) and (max-height:500px){ .toast{top:calc(70px + env(safe-area-inset-top,0px))} }
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

.overlay{position:fixed;inset:0;z-index:20;display:flex;background:rgba(18,14,40,.55);overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.overlay.dim{background:rgba(18,14,40,.8)}
.overlay.title{background:linear-gradient(180deg,rgba(18,14,40,0) 30%,rgba(18,14,40,.6))}
.overlay.title .card{margin:auto auto 0}
@media (orientation:landscape){ .overlay.title{background:linear-gradient(90deg,rgba(18,14,40,.5),rgba(18,14,40,0) 60%)} .overlay.title .card{margin:auto auto auto 0} }
.card{width:100%;max-width:440px;margin:auto;background:rgba(42,36,82,.94);border-radius:28px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
  box-shadow:0 0 0 3px var(--night-3),0 24px 60px rgba(0,0,0,.5);animation:cardIn .3s ease-out}
@keyframes cardIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card h1{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.1;margin:0;color:var(--gold);text-shadow:0 4px 0 var(--wall-face);text-wrap:balance}
.card h1 small{display:block;font-size:22px;color:var(--ink);text-shadow:none;margin-top:2px}
.card h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.6;font-size:16px;text-wrap:balance}
.big-btn{border:0;border-radius:20px;background:var(--gold);color:#3a2a00;font-family:var(--display);font-weight:800;font-size:24px;
  padding:12px 26px;min-width:200px;box-shadow:0 6px 0 #c48f12}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c48f12}
.ghost-btn{border:0;background:var(--night-3);border-radius:16px;padding:11px 18px;font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--wall-face);text-decoration:none;color:var(--ink);display:inline-block}
.ghost-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wall-face)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bigstar{font-size:76px;line-height:1;animation:spin .7s ease-out;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
@keyframes spin{from{transform:scale(0) rotate(-200deg)}to{transform:scale(1) rotate(0)}}
.tally{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;direction:ltr}
.tally span{background:var(--night);border-radius:16px;padding:8px 14px;font-weight:700;font-size:18px}
.starrow{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:24px;direction:ltr}
.starrow i{font-style:normal}
.starrow i.off{filter:grayscale(1);opacity:.3}
.how{list-style:none;margin:0;padding:12px 14px;background:var(--night);border-radius:18px;display:grid;gap:8px;text-align:start;width:100%}
.how li{display:flex;gap:10px;align-items:center;font-size:15px;line-height:1.4}
.how li span:first-child{font-size:22px;width:30px;text-align:center;flex:none}
#nogl{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;text-align:center;background:var(--night);font-family:var(--display);font-size:22px}
@media (max-height:520px){ .card{gap:8px;padding:12px 16px} .card h1{font-size:28px} .card h1 small{font-size:18px} .card h2{font-size:23px} .how{display:none} .bigstar{font-size:50px} .big-btn{font-size:20px;padding:8px 22px} .starrow{font-size:20px} .tally span{padding:5px 12px;font-size:16px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<canvas id="cv" aria-label="مغامرة بوبو ثلاثي الأبعاد" data-en-aria="Bobo's Adventure 3D" data-tr-aria="Bobo'nun Macerası 3D"></canvas>
<div id="touch"></div>

<header class="hud" id="hud" hidden>
  <button class="icon-btn" id="btnPause" aria-label="استراحة" data-en-aria="Pause" data-tr-aria="Mola">⏸️</button>

<script src="../world.js"></script>
<script type="module">
import * as THREE from './three.module.min.js';

const $ = s => document.querySelector(s);
{ const md = document.querySelector('meta[name="description"]'), dl = window.I18N && md && md.getAttribute('data-' + I18N.lang); if(dl) md.setAttribute('content', dl); }
const N = n => window.I18N ? I18N.num(n) : String(n);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('adv3d_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('adv3d_' + k, JSON.stringify(v)); }catch(e){} }
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => { let d = a - b; while(d > Math.PI) d -= Math.PI * 2; while(d < -Math.PI) d += Math.PI * 2; return d; };
let seed = 20261113;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ---------- Sound (tiny synth, no files) ---------- */
let actx = null, muted = store.get('muted', false);
function ac(){
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; } }
  if(actx && actx.state === 'suspended') actx.resume().catch(() => {});
  return actx;
}
function tone(freq, dur, type, vol, delay, toFreq){
  if(muted) return; const a = ac(); if(!a) return;
  const t0 = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if(toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
const SFX = {
  jump(){ tone(360, .16, 'sine', .1, 0, 720); }, djump(){ tone(520, .16, 'sine', .1, 0, 1040); },
  honey(){ tone(1046, .06, 'triangle', .07); tone(1568, .1, 'triangle', .06, .05); },
  star(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, .14, 'triangle', .13, i * .07)); },
  stomp(){ tone(500, .1, 'square', .06, 0, 160); tone(1200, .12, 'triangle', .08, .06); },
  hurt(){ tone(240, .25, 'sawtooth', .07, 0, 110); },
  spring(){ tone(220, .35, 'sine', .13, 0, 990); },
  splash(){ tone(600, .3, 'sine', .06, 0, 90); tone(300, .25, 'triangle', .05, .05, 80); },
  flag(){ [523, 659, 784].forEach((f, i) => tone(f, .16, 'triangle', .12, i * .08)); },
  ring(){ tone(880, .12, 'triangle', .1); tone(1320, .16, 'triangle', .09, .07); },
  go(){ [440, 440, 880].forEach((f, i) => tone(f, .14, 'square', .07, i * .16)); },
  win(){ [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, .2, 'triangle', .14, i * .11)); },
  lose(){ [440, 370, 311].forEach((f, i) => tone(f, .22, 'sine', .12, i * .14)); },
  tap(){ tone(520, .05, 'triangle', .08); }
};

/* ---------- Renderer ---------- */
const canvas = $('#cv');
let renderer;
try{
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
}catch(e){ $('#nogl').hidden = false; $('#overlay').hidden = true; throw e; }
let dpr = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(dpr);
const scene = new THREE.Scene();
const FOG = 0xc8ecff;
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.Fog(FOG, 70, 240);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 700);
let portrait = false;
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  portrait = w < h;
  camera.aspect = w / h; camera.fov = portrait ? 68 : 55; camera.updateProjectionMatrix();
  placeJoyHome();
}
addEventListener('resize', resize);

scene.add(new THREE.HemisphereLight(0xe4f6ff, 0x5f8a3c, 1.9));
const sun = new THREE.DirectionalLight(0xfff0d0, 2.1);
sun.position.set(40, 70, 30); scene.add(sun);

/* ---------- Geometry merge helper: one draw call for lots of static, vertex-coloured pieces ---------- */
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _v = new THREE.Vector3(), _c = new THREE.Color();
class Merge{
  constructor(){ this.p = []; this.n = []; this.c = []; }
  add(geo, x, y, z, sx = 1, sy = 1, sz = 1, rx = 0, ry = 0, rz = 0, color = 0xffffff){
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    _m.compose(_v.set(x, y, z), _q.setFromEuler(_e.set(rx, ry, rz)), _s.set(sx, sy, sz));
    g.applyMatrix4(_m);
    const pa = g.attributes.position.array, na = g.attributes.normal.array;
    _c.set(color);
    for(let i = 0; i < pa.length; i++){ this.p.push(pa[i]); this.n.push(na[i]); }
    for(let i = 0; i < pa.length / 3; i++) this.c.push(_c.r, _c.g, _c.b);
    g.dispose(); return this;
  }
  geometry(){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.n, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    g.computeBoundingSphere(); return g;
  }
}
const G = {
  box:new THREE.BoxGeometry(1, 1, 1), cyl:new THREE.CylinderGeometry(1, 1, 1, 16), cyl8:new THREE.CylinderGeometry(1, 1, 1, 8),
  cone:new THREE.ConeGeometry(1, 1, 10), cone4:new THREE.ConeGeometry(1, 1, 4), sph:new THREE.SphereGeometry(1, 12, 9),
  ico:new THREE.IcosahedronGeometry(1, 0), ico1:new THREE.IcosahedronGeometry(1, 1), dode:new THREE.DodecahedronGeometry(1, 0),
  hemi:new THREE.SphereGeometry(1, 14, 7, 0, Math.PI * 2, 0, Math.PI / 2)
};
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = canvasTex(64, 64, (x, w) => { const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,240,170,1)'); g.addColorStop(.4, 'rgba(255,214,90,.5)'); g.addColorStop(1, 'rgba(255,200,60,0)'); x.fillStyle = g; x.fillRect(0, 0, w, w); });
const blobTex = canvasTex(64, 64, (x, w) => { const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(20,30,40,.55)'); g.addColorStop(.6, 'rgba(20,30,40,.3)'); g.addColorStop(1, 'rgba(20,30,40,0)'); x.fillStyle = g; x.fillRect(0, 0, w, w); });
function emojiTex(e){
  return canvasTex(128, 128, x => { x.font = '104px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(e, 64, 72); });
}

/* ---------- The island: height field ---------- */
const R = 62;
const riverZ = x => 4 + 3 * Math.sin(x * 0.08);
function riverC(x, z){ return 1 - smooth(2.6, 5.2, Math.abs(z - riverZ(x))); }
function H(x, z){
  const d = Math.hypot(x, z) / R + 0.035 * Math.sin(Math.atan2(z, x) * 5 + 1);
  let h = 1.4 - 4.4 * smooth(0.7, 1.05, d);
  h += 0.35 * Math.sin(x * 0.13 + 1) * Math.cos(z * 0.11) * (1 - smooth(0.6, 0.82, d));
  h += 8.5 * (1 - smooth(9, 19, Math.hypot(x, z + 38)));          // castle hill
  h += 2.2 * Math.exp(-((x - 18) ** 2 + (z + 22) ** 2) / 40);      // little east knoll
  h += 1.6 * Math.exp(-((x + 12) ** 2 + (z - 46) ** 2) / 30);      // dune
  return lerp(h, -1.7, riverC(x, z));                                // river
}

/* ---------- Colliders ---------- */
const boxes = [], cyls = [];
function groundInfo(x, z, y, r){
  let h = H(x, z), ref = null;
  const m = r * 0.6;
  for(const b of boxes){
    if(x > b.x0 - m && x < b.x1 + m && z > b.z0 - m && z < b.z1 + m && b.y1 <= y + 0.45 && b.y1 > h){ h = b.y1; ref = b; }
  }
  for(const c of cyls){
    const dx = x - c.x, dz = z - c.z;
    if(dx * dx + dz * dz < (c.r + r * 0.35) ** 2 && c.y1 <= y + 0.45 && c.y1 > h){ h = c.y1; ref = c; }
  }
  return { h, ref };
}
const groundTop = (x, z) => groundInfo(x, z, 999, 0).h;

/* ---------- Static scenery ---------- */
const W = new Merge(), GLOW = new Merge();
function sbox(cx, cy, cz, sx, sy, sz, col, o = {}){
  W.add(G.box, cx, cy, cz, sx, sy, sz, 0, 0, 0, col);
  const b = { x0:cx - sx / 2, x1:cx + sx / 2, y0:cy - sy / 2, y1:cy + sy / 2, z0:cz - sz / 2, z1:cz + sz / 2, kind:o.kind, cam:!!o.cam };
  if(!o.noCol) boxes.push(b); return b;
}
function scyl(x, y0, z, r, h, col, o = {}){
  W.add(o.geo || G.cyl, x, y0 + h / 2, z, r, h, r, 0, o.ry || 0, 0, col);
  const c = { x, z, r, y0, y1:y0 + h, kind:o.kind, cam:!!o.cam };
  if(!o.noCol) cyls.push(c); return c;
}
const GREENS = [0x4fbf4a, 0x5ccf55, 0x42b14b, 0x6bd65a, 0x58c463];
const pick = a => a[Math.floor(rnd() * a.length)];
function tree(x, z, s, blossom){
  const g = H(x, z);

    if(near && !hinted[h.id] && !starsGot[h.star]){ hinted[h.id] = true; toast(h.text); }
    if(!near && hinted[h.id] && (h.x - P.x) ** 2 + (h.z - P.z) ** 2 > (h.r + 14) ** 2) hinted[h.id] = false;
  });
}
const ringDone = new THREE.MeshLambertMaterial({ color:0x5fe3b1, emissive:0x0a4a30 });
const HINTS = [
  { id:'river', star:0, x:0, z:12, r:4, text:L('نطّ عالحجار لتقطع النهر! 🪨', 'Hop on the stones to cross the river! 🪨', 'Nehri geçmek için taşlara zıpla! 🪨') },

  { id:'cave', star:5, x:CPS[5][0], z:CPS[5][1], r:5, text:L('في مغارة مخبّاية ورا الشجيرات! 🕳️', 'A cave is hiding behind the bushes! 🕳️', 'Çalıların arkasında gizli bir mağara var! 🕳️') },
  { id:'castle', star:6, x:0, z:-31, r:4, text:L('اطلع الدرج لراس البرج! 🏰', 'Climb the stairs to the top of the tower! 🏰', 'Kulenin tepesine merdivenden çık! 🏰') },
  { id:'meadow', star:7, x:PL.meadow[0], z:PL.meadow[1], r:10, text:L('دوس عالحشرات الخمسة من فوق! 🐞', 'Stomp the 5 bugs from above! 🐞', '5 böceğe yukarıdan zıpla! 🐞') },
  { id:'race', star:8, x:PL.raceA[0], z:PL.raceA[1], r:5, text:L('دوس عالزر الأحمر واركض للعلم! 🏁', 'Step on the red button and run to the flag! 🏁', 'Kırmızı düğmeye bas ve bayrağa koş! 🏁') },

];

/* ---------- Camera ---------- */
const cam = { yaw:0, pitch:.34, dist:7.2, dragT:-9, tx:0, ty:0, tz:0 };
let snapCam = true;
const camPos = new THREE.Vector3();
function rayBlock(ox, oy, oz, dx, dy, dz, max){
  let best = max;
  const test = (x0, y0, z0, x1, y1, z1) => {
    let tmin = 0, tmax = best;
    const o = [ox, oy, oz], d = [dx, dy, dz], lo = [x0, y0, z0], hi = [x1, y1, z1];
    for(let a = 0; a < 3; a++){
      if(Math.abs(d[a]) < 1e-8){ if(o[a] < lo[a] || o[a] > hi[a]) return; }
      else { let t1 = (lo[a] - o[a]) / d[a], t2 = (hi[a] - o[a]) / d[a]; if(t1 > t2){ const s = t1; t1 = t2; t2 = s; } tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2); if(tmin > tmax) return; }
    }
    if(tmin > .05 && tmin < best) best = tmin;
  };
  for(const b of boxes) if(b.cam) test(b.x0, b.y0, b.z0, b.x1, b.y1, b.z1);
  for(const c of cyls) if(c.cam) test(c.x - c.r * .8, c.y0, c.z - c.r * .8, c.x + c.r * .8, c.y1, c.z + c.r * .8);
  return best;
}
function updateCamera(dt){
  const cave = inCave(P.x, P.z, P.y);
  if(T - cam.dragT > 1.2 && P.move > .3 && !cave){
    const want = Math.atan2(-Math.sin(P.face), -Math.cos(P.face)), d = angDiff(want, cam.yaw);
    if(Math.abs(d) < 2.3) cam.yaw += d * Math.min(1, dt * 1.1 * P.move);
  }
  const k = snapCam ? 1 : 1 - Math.exp(-10 * dt);
  cam.tx = lerp(cam.tx, P.x, k); cam.ty = lerp(cam.ty, P.y + 1.15, 1 - Math.exp(-(snapCam ? 99 : 6) * dt)); cam.tz = lerp(cam.tz, P.z, k);
  const pitch = cave ? .1 : cam.pitch, dist = (cave ? 4 : cam.dist) * (portrait ? 1.12 : 1);
  let dx = Math.sin(cam.yaw) * Math.cos(pitch), dy = Math.sin(pitch), dz = Math.cos(cam.yaw) * Math.cos(pitch);
  const t = rayBlock(cam.tx, cam.ty, cam.tz, dx, dy, dz, dist), dd = Math.max(1.2, t - .35);
  let x = cam.tx + dx * dd, y = cam.ty + dy * dd, z = cam.tz + dz * dd;
  y = Math.max(y, H(x, z) + .6, .5);
  if(snapCam){ camPos.set(x, y, z); snapCam = false; } else camPos.lerp(_v.set(x, y, z), 1 - Math.exp(-14 * dt));
  camera.position.copy(camPos); camera.lookAt(cam.tx, cam.ty + .2, cam.tz);
}

/* ---------- Per-frame visuals ---------- */
function animate(dt){
  // Bobo
  const g = bobo.grp; g.position.set(P.x, P.y, P.z); g.rotation.y = P.face;
  P.sqv += (-P.sq * 180 - P.sqv * 14) * dt; P.sq += P.sqv * dt;
  const run = P.grounded ? P.move : 0, bounce = P.grounded ? Math.abs(Math.sin(T * 13)) * .08 * run + Math.sin(T * 3) * .02 * (1 - run) : 0;
  const sy = 1 + P.sq + (P.grounded ? Math.sin(T * 3) * .025 * (1 - run) : 0), sxz = 1 - P.sq * .6;
  bobo.body.scale.set(sxz, sy, sxz); bobo.body.position.y = bounce;
  bobo.body.rotation.x = run * .14;
  if(P.flip > 0){ P.flip = Math.max(0, P.flip - dt * 2.4); bobo.body.rotation.x = (1 - P.flip) * Math.PI * 2; }
  bobo.feet.forEach((f, i) => { const s = Math.sin(T * 13 + i * Math.PI) * run; f.position.z = .06 + s * .18; f.position.y = .06 + Math.max(0, s) * .1 + (P.grounded ? 0 : .05); });
  const blink = (T % 3.7) < .12 || ((T + 1.3) % 6.1) < .1;
  bobo.eyes.scale.y = blink ? .12 : 1;
  bobo.grp.visible = P.inv <= 0 || Math.floor(P.inv * 12) % 2 === 0;
  const gh = groundInfo(P.x, P.z, P.y + .1, 0).h, hh = P.y - gh, ss = clamp(1.1 - hh * .08, .45, 1.1);
  pShadow.position.set(P.x, gh + .04, P.z); pShadow.scale.set(ss * 1.1, 1, ss * 1.1); pShadow.visible = gh > -.2;
  // honey spin
  for(let i = 0; i < HONEY.length; i++){
    const h = HONEY[i];
    if(honeyGot.has(i)) _m.makeScale(0, 0, 0);
    else _m.compose(_v.set(h[0], h[1] + Math.sin(T * 2.5 + i) * .1, h[2]), _q.setFromEuler(_e.set(0, T * 2.4 + i, 0)), _s.set(1, 1, 1));
    honeyMesh.setMatrixAt(i, _m);
  }
  honeyMesh.instanceMatrix.needsUpdate = true;
  // stars
  starObjs.forEach((o, i) => {
    o.grp.visible = starVisible(i);
    if(!o.grp.visible) return;
    o.m.rotation.y = T * 1.8; o.grp.position.y = STARS[i].at[1] + Math.sin(T * 2 + i) * .18;
  });
  // enemies + shadows
  let si = 0;
  for(const e of enemies){
    if(state === 'play' || state === 'title') placeEnemy(e, dt);
    if(e.alive && si < 24){ _m.compose(_v.set(e.x, e.gy + .05, e.z), _q.identity(), _s.set(1.2, 1, 1.2)); eShadows.setMatrixAt(si++, _m); }
  }
  for(; si < 24; si++){ _m.makeScale(0, 0, 0); eShadows.setMatrixAt(si, _m); }
  eShadows.instanceMatrix.needsUpdate = true;
  // misc
  cpFlags.forEach((c, i) => { c.f.material.color.setHex(i === cp ? 0xffcd4d : 0xbfb8d6); c.f.rotation.y = Math.sin(T * 3 + i) * .25; });
  raceFlag.rotation.y = Math.sin(T * 2.5) * .2; castleBanner.rotation.y = Math.sin(T * 2) * .2;
  rings.forEach((r, i) => { r.m.scale.setScalar(1 + Math.sin(T * 3 + i) * .04); });
  waterTex.offset.set(T * .01, T * .006);
  cloudsGrp.rotation.y = T * .004;
  if(mushBounce > 0) mushBounce = Math.max(0, mushBounce - dt * 3);
  updateParts(dt);
}

/* ---------- HUD ---------- */
const hudEl = $('#hud'), toastEl = $('#toast');
let toastTimer = 0, honeyDirty = false;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false; toastEl.style.animation = 'none'; void toastEl.offsetWidth; toastEl.style.animation = ''; clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.hidden = true, 2300); }
function nStars(){ return starsGot.filter(Boolean).length; }
function hud(){
  $('#hudHearts').textContent = '❤️'.repeat(Math.max(0, P.hearts)) + '🤍'.repeat(Math.max(0, 3 - P.hearts));
  $('#hudHoney').textContent = '🍯 ' + N(honeyCount);
  $('#hudStars').textContent = '⭐ ' + N(nStars()) + '/' + N(10);
}
function nearestTarget(){
  let best = null, bd = 1e9;
  STARS.forEach((s, i) => {
    if(starsGot[i]) return;
    const [x, z] = starVisible(i) ? [s.at[0], s.at[2]] : s.anchor();
    const d = (x - P.x) ** 2 + (z - P.z) ** 2;
    if(d < bd){ bd = d; best = [x, z]; }
  });
  return best ? { x:best[0], z:best[1], d:Math.sqrt(bd) } : null;
}
const compassEl = $('#compass'), arrowEl = $('#arrow'), timerEl = $('#timer');
function hudFrame(){
  const t = nearestTarget();
  if(!t || t.d < 2.5){ compassEl.style.visibility = 'hidden'; }
  else {
    compassEl.style.visibility = 'visible';
    const dx = t.x - P.x, dz = t.z - P.z, fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
    const a = Math.atan2(dx * rx + dz * rz, dx * fx + dz * fz);
    arrowEl.style.transform = `rotate(${a}rad)`;
  }
  if(race.active){ timerEl.hidden = false; timerEl.textContent = '⏱️ ' + N(Math.ceil(race.t)); } else timerEl.hidden = true;
  if(honeyDirty){ honeyDirty = false; store.set('honey', honeyCount); store.set('honeyIds', [...honeyGot]); }
}

/* ---------- Menus ---------- */
const overlay = $('#overlay'), card = $('#card');
function setPlayUI(on){ overlay.classList.remove('title'); hudEl.hidden = !on; joyEl.hidden = !on; jumpBtn.hidden = !on; overlay.hidden = on; if(!on){ toastEl.hidden = true; } }
function starRow(){ return '<div class="starrow">' + starsGot.map(g => `<i class="${g ? '' : 'off'}">⭐</i>`).join('') + '</div>'; }
const HOME = `<a class="ghost-btn" href="../">🏠 ${L('الرئيسية', 'Home', 'Ana sayfa')}</a>`;
function showTitle(){
  state = 'title'; setPlayUI(false); overlay.classList.remove('dim'); overlay.classList.add('title');
  const any = nStars() > 0 || honeyCount > 0;
  card.innerHTML = `<h1>${L('مغامرة بوبو', "Bobo's Adventure", "Bobo'nun Macerası")}<small>${L('ثلاثي الأبعاد', '3D', '3D')} 🏝️</small></h1>
    <p>${L('لفّ الجزيرة، اجمع العسل ولاقي العشر نجوم!', 'Explore the island, collect honey and find all 10 stars!', 'Adayı gez, bal topla ve 10 yıldızın hepsini bul!')}</p>
    ${any ? starRow() : ''}
    <button class="big-btn" id="bPlay">${any ? '▶️ ' + L('كمّل', 'Continue', 'Devam') : '▶️ ' + L('العب', 'Play', 'Oyna')}</button>
    <ul class="how">
      <li><span>🕹️</span><span>${L('اسحب عالشمال لتمشّي بوبو', 'Drag on the left to move Bobo', "Bobo'yu yürütmek için solda kaydır")}</span></li>
      <li><span>⬆️</span><span>${L('كبسة الزر الأصفر = نطّة، كبستين = نطّة دبل', 'Yellow button = jump, tap twice = double jump', 'Sarı düğme = zıpla, iki kez = çift zıplama')}</span></li>
      <li><span>👆</span><span>${L('اسحب عاليمين لتلفّ الكاميرا', 'Drag on the right to turn the camera', 'Kamerayı döndürmek için sağda kaydır')}</span></li>
      <li><span>🧭</span><span>${L('السهم بيدلّك على أقرب نجمة', 'The arrow points to the nearest star', 'Ok en yakın yıldızı gösterir')}</span></li>
    </ul>
    <div class="row">${any ? `<button class="ghost-btn" id="bNew">🔄 ${L('من الأول', 'New game', 'Yeni oyun')}</button>` : ''}${HOME}</div>`;
  $('#bPlay').onclick = () => { ac(); SFX.tap(); startPlay(); };
  if(any) $('#bNew').onclick = () => {
    SFX.tap();
    card.innerHTML = `<h2>${L('نبلّش من الأول؟', 'Start over?', 'Baştan başlayalım mı?')}</h2><p>${L('النجوم والعسل رح ينمحوا', 'Your stars and honey will be cleared', 'Yıldızların ve balın silinecek')}</p>
      <div class="row"><button class="big-btn" id="bYes">${L('إيه', 'Yes', 'Evet')}</button><button class="ghost-btn" id="bNo">${L('لا', 'No', 'Hayır')}</button></div>`;
    $('#bYes').onclick = () => { starsGot = Array(10).fill(false); honeyGot = new Set(); honeyCount = 0; cp = 0; store.set('stars', starsGot); store.set('cp', 0); store.set('done', false); honeyDirty = true; hudFrame(); showTitle(); };
    $('#bNo').onclick = showTitle;
  };
}
function startPlay(){
  state = 'play'; setPlayUI(true); toCheckpoint(); P.hearts = 3; hud(); placeJoyHome();
  if(window.World && !startPlay.tracked){ startPlay.tracked = true; }
}
function showPause(){
  if(state !== 'play') return;
  state = 'pause'; setPlayUI(false); overlay.classList.add('dim');
  joy.id = null; joy.x = joy.y = 0; look.id = null; knob.style.transform = '';
  card.innerHTML = `<h2>⏸️ ${L('استراحة', 'Paused', 'Mola')}</h2>${starRow()}
    <div class="tally"><span>⭐ ${N(nStars())}/${N(10)}</span><span>🍯 ${N(honeyCount)}</span></div>
    <button class="big-btn" id="bRes">▶️ ${L('كمّل', 'Resume', 'Devam')}</button>
    <div class="row"><button class="ghost-btn" id="bCp">🚩 ${L('رجّعني للعلم', 'Back to checkpoint', 'Kontrol noktasına dön')}</button>
    <button class="ghost-btn" id="bSnd">${muted ? '🔇' : '🔊'} ${L('الصوت', 'Sound', 'Ses')}</button>${HOME}</div>`;
  $('#bRes').onclick = () => { SFX.tap(); resume(); };
  $('#bCp').onclick = () => { toCheckpoint(); resume(); };
  $('#bSnd').onclick = () => { muted = !muted; store.set('muted', muted); $('#bSnd').innerHTML = (muted ? '🔇' : '🔊') + ' ' + L('الصوت', 'Sound', 'Ses'); SFX.tap(); };
}
function resume(){ state = 'play'; setPlayUI(true); hud(); }
$('#btnPause').onclick = () => { SFX.tap(); showPause(); };
function collectStar(i){
  if(starsGot[i]) return;
  starsGot[i] = true; store.set('stars', starsGot);
  const p = starObjs[i].grp.position;
  burst(p.x, p.y, p.z, 30, [0xffd23f, 0xffffff, 0xff8fb8, 0x5fe3b1], 6, 1.3);
  SFX.star(); hud();
  if(window.World) World.addCoins(5, L('من نجمة', 'for a star', 'yıldız için'));
  state = 'popup'; setPlayUI(false); overlay.classList.remove('dim');
  joy.id = null; joy.x = joy.y = 0; look.id = null; knob.style.transform = ''; for(const k in keys) keys[k] = false;
  const n = nStars();
  card.innerHTML = `<div class="bigstar">⭐</div><h2>${L('لقيت نجمة!', 'You found a star!', 'Bir yıldız buldun!')}</h2>
    <p><b style="color:var(--gold);font-size:20px">${STARS[i].name}</b></p>${starRow()}
    <div class="tally"><span>⭐ ${N(n)}/${N(10)}</span><span>+${N(5)} 🪙</span></div>
    <button class="big-btn" id="bGo">${n === 10 ? '🎉 ' + L('يا سلام!', 'Hooray!', 'Yaşasın!') : '▶️ ' + L('يلّا نكمّل', 'Keep going', 'Devam et')}</button>`;
  $('#bGo').onclick = () => { SFX.tap(); if(n === 10) showEnd(); else resume(); };
}
function showEnd(){
  state = 'end'; setPlayUI(false); overlay.classList.add('dim');
  if(!store.get('done', false)){ store.set('done', true); if(window.World) World.track('win', 'adventure3d'); }
  SFX.win();
  card.innerHTML = `<div class="bigstar">🏆</div><h2>${L('برافو! لقيت كل النجوم!', 'Amazing! You found all the stars!', 'Harika! Bütün yıldızları buldun!')} 🎉</h2>${starRow()}
    <p>${L('بوبو كتير مبسوط فيك. الجزيرة إلك، لفّ فيها قدّ ما بدّك!', 'Bobo is so proud of you. The island is yours — explore as much as you like!', 'Bobo seninle gurur duyuyor. Ada senin, istediğin kadar gez!')}</p>
    <div class="tally"><span>⭐ ${N(10)}/${N(10)}</span><span>🍯 ${N(honeyCount)}</span></div>
    <button class="big-btn" id="bMore">🏝️ ${L('كمّل لفّ', 'Keep exploring', 'Keşfetmeye devam')}</button><div class="row">${HOME}</div>`;
  $('#bMore').onclick = () => { SFX.tap(); resume(); };
}

/* ---------- Main loop ---------- */
let last = performance.now(), fpsN = 0, fpsT = 0, fps = 60, slowT = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if(dt > .05) dt = .05; if(dt <= 0) dt = .001;
  fpsN++; fpsT += dt;
  if(fpsT >= 1){
    fps = fpsN / fpsT; fpsN = 0; fpsT = 0;
    // adaptive resolution for slower phones
    if(state === 'play' && fps < 42 && dpr > 1){ slowT++; if(slowT >= 2){ dpr = Math.max(1, dpr - .25); renderer.setPixelRatio(dpr); slowT = 0; } } else slowT = 0;
  }
  if(state === 'play'){
    let rest = dt; while(rest > 0){ const h = Math.min(rest, 1 / 60); step(h); rest -= h; }
    updateCamera(dt); hudFrame();
  } else if(state === 'title'){
    T += dt;
    const a = T * .06;
    camera.position.set(Math.sin(a) * 74, 30, Math.cos(a) * 74); camera.lookAt(0, portrait ? -16 : 0, 0);
    updateMovers(T);
  }
  animate(dt);
  sky.position.copy(camera.position);
  sunGlow.position.copy(camera.position).add(_v.set(150, 210, -260));
  renderer.render(scene, camera);
}

/* debug / test hook */
window.__adv3d = {
  get state(){ return state; }, get fps(){ return fps; }, get dpr(){ return dpr; }, P, cam,
  get stars(){ return starsGot.slice(); }, get honey(){ return honeyCount; }, starPos:i => STARS[i].at.slice(),
  teleport(x, z, y){ P.x = x; P.z = z; P.y = y != null ? y : groundTop(x, z) + .1; P.vx = P.vz = P.vy = 0; snapCam = true; },
  collectStar(i){ unlocked.rings = unlocked.meadow = unlocked.race = true; collectStar(i); },
  unlockAll(){ unlocked.rings = unlocked.meadow = unlocked.race = true; },
  info(){ return renderer.info.render; }, movers:() => movers.map(m => [m.cx, m.cy, m.cz]), enemies:() => enemies.map(e => [e.type, e.x, e.y, e.z, e.alive]), start:() => startPlay()
};

resize(); hud(); showTitle();
requestAnimationFrame(frame);
</script>
