<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="../i18n.js"></script>
<script src="../rt.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title data-en="Egg Heist" data-tr="Yumurta Soygunu">اسرق البيضة</title>
<meta name="description" content="لعبة ثلاثية الأبعاد للأطفال: اشتري بيض، اجمع قروش، واسرق بيض من بيوت أصحابك." data-en="A 3D game for kids: buy eggs, collect coins and sneak eggs from your friends' nests." data-tr="Çocuklar için 3D oyun: yumurta al, para topla, arkadaşlarının yuvalarından yumurta kap.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bobo Land">
<meta name="theme-color" content="#1c1838">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Egg Heist («اسرق البيضة»): an island with 4 nests (bases) around an egg belt.
   Buy walking eggs, nests make egg-coins, sneak eggs from other nests, lock your gate.
   Always landscape (rotated layer like the other 3D games). */
:root{
  --night:#1c1838; --night-2:#2a2452; --night-3:#362e68; --wall-face:#2f2858;
  --ink:#fff7e8; --muted:#bdb4e6; --gold:#ffcd4d; --mint:#5fe3b1; --pink:#ff8fb8;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0;
  --sa-t:env(safe-area-inset-top,0px);--sa-r:env(safe-area-inset-right,0px);--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px);--sw:100vw;--sh:100vh}
#stage.rot{--sa-t:env(safe-area-inset-right,0px);--sa-r:env(safe-area-inset-bottom,0px);--sa-b:env(safe-area-inset-left,0px);--sa-l:env(safe-area-inset-top,0px)}
#saProbe{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;width:var(--sa-l);height:var(--sa-b)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#touch{position:absolute;inset:0;z-index:2;touch-action:none}

.hud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;gap:8px;pointer-events:none;
  padding:calc(8px + var(--sa-t)) max(12px,var(--sa-r)) 0 max(12px,var(--sa-l));direction:ltr}
.hud > *{pointer-events:auto}
.icon-btn{width:48px;height:48px;flex:none;border:0;border-radius:16px;background:rgba(28,24,56,.78);font-size:22px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.chips{display:flex;flex-direction:column;gap:6px;flex:none;align-items:flex-end;pointer-events:none}
.chip{background:rgba(28,24,56,.8);border-radius:999px;padding:5px 12px;font-weight:800;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px;direction:ltr;font-family:var(--display);line-height:1.2}
.chip.coin{font-size:22px;box-shadow:inset 0 0 0 3px var(--gold)}
.chip.lk.on{background:rgba(200,60,90,.92)}
.chip.lk.ready{background:rgba(40,130,90,.92)}
.chip.timer{font-size:22px;background:rgba(28,24,56,.85);padding:2px 16px;min-width:96px;justify-content:center;box-shadow:inset 0 0 0 3px var(--gold)}
.chip.timer.low{box-shadow:inset 0 0 0 3px #ff5d73;color:#ffd0d6}
#mini{width:112px;height:112px;flex:none;border-radius:50%;background:rgba(28,24,56,.55);box-shadow:0 0 0 3px rgba(255,247,232,.7),0 4px 0 rgba(0,0,0,.25);pointer-events:none}
.mpbar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;direction:ltr;pointer-events:none}
.chip.ps{box-shadow:inset 0 0 0 3px var(--c);padding:3px 10px 3px 3px;gap:5px;font-size:15px}
.chip.ps img{width:28px;height:28px;border-radius:50%;display:block;background:var(--night);object-fit:cover;object-position:top}
.chip.ps.me{background:rgba(74,63,140,.95)}

.joy{position:absolute;z-index:4;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,247,232,.16);border:3px solid rgba(255,247,232,.45);pointer-events:none;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.joy.on{background:rgba(255,247,232,.24)}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,247,232,.85);box-shadow:0 4px 0 rgba(0,0,0,.25)}
#stage.short .joy{width:110px;height:110px;margin:-55px 0 0 -55px}

/* the context action button: اشتري / اسرق / حط / قفّل */
.act{position:absolute;z-index:4;right:max(18px,calc(var(--sa-r) + 8px));bottom:calc(20px + var(--sa-b));--s:min(calc(var(--sh) * .3),128px);width:var(--s);height:var(--s);
  border-radius:50%;border:4px solid #fff7e8;background:var(--ac,#ffcd4d);color:#2a1a00;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  box-shadow:0 7px 0 rgba(0,0,0,.28),0 0 0 6px rgba(255,255,255,.18);touch-action:none;font-family:var(--display);line-height:1;padding:0;animation:actIn .25s cubic-bezier(.2,1.5,.4,1)}
.act i{font-style:normal;font-size:calc(var(--s) * .34);line-height:1}
.act b{font-weight:800;font-size:calc(var(--s) * .2);margin-top:2px}
.act small{font-weight:800;font-size:calc(var(--s) * .13);direction:ltr;opacity:.85}
.act.dim{filter:saturate(.35) brightness(.85);opacity:.82}
.act.pulse{animation:actPulse 1s ease-in-out infinite}
.act:active,.act.on{transform:translateY(4px) scale(.96);box-shadow:0 2px 0 rgba(0,0,0,.28)}
@keyframes actIn{from{transform:scale(.4)}to{transform:scale(1)}}
@keyframes actPulse{50%{box-shadow:0 7px 0 rgba(0,0,0,.28),0 0 0 14px rgba(255,255,255,.28)}}
.upbtn{position:absolute;z-index:4;right:max(18px,calc(var(--sa-r) + 8px));bottom:calc(28px + var(--sa-b) + min(calc(var(--sh) * .3),128px));width:64px;height:64px;border-radius:20px;border:3px solid #fff7e8;
  background:#8d6bff;font-size:30px;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.28);padding:0}
.upbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.upbtn.can::after{content:"";position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#ff4d6d;border:3px solid #fff7e8}
.upg{position:absolute;z-index:8;inset:0;display:grid;place-items:center;background:rgba(18,14,40,.45);padding:12px}
.upg .card{max-width:560px}
.uprow{display:flex;align-items:center;gap:12px;width:100%;background:var(--night);border-radius:20px;padding:10px 12px;text-align:start}
.uprow .ic{font-size:40px;flex:none}
.uprow .tx{flex:1;min-width:0}
.uprow .tx b{display:block;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.2}
.uprow .tx small{display:block;color:var(--muted);font-weight:700;font-size:15px;direction:ltr;text-align:end}
[dir=ltr] .uprow .tx small{text-align:start}
.uprow .big-btn{min-width:0;font-size:20px;padding:8px 16px;direction:ltr}

/* Aunt Laila's speech bubble */
.guide{position:absolute;z-index:6;left:50%;bottom:calc(14px + var(--sa-b));transform:translateX(-50%);display:flex;align-items:flex-end;gap:6px;pointer-events:none;
  max-width:min(520px,calc(var(--sw) - 320px));animation:gIn .35s cubic-bezier(.2,1.4,.4,1)}
.guide img{width:74px;height:96px;object-fit:contain;object-position:bottom;flex:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.guide p{margin:0 0 18px;background:#fff7e8;color:#2a1f4a;font-family:var(--display);font-weight:800;font-size:18px;line-height:1.3;padding:9px 15px;border-radius:20px;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.guide p::before{content:"";position:absolute;bottom:10px;inset-inline-start:-9px;border:9px solid transparent;border-inline-end-color:#fff7e8;border-inline-start:0}
[dir=rtl] .guide p::before{inset-inline-start:auto;inset-inline-end:-9px;border-inline-end-color:transparent;border-inline-start:9px solid #fff7e8;border-inline-end:0}
.guide.menu{z-index:25;left:auto;right:max(14px,var(--sa-r));transform:none;bottom:calc(10px + var(--sa-b));max-width:min(360px,calc(var(--sw) * .4));animation:gIn2 .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes gIn{from{opacity:0;transform:translateX(-50%) translateY(30px) scale(.8)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes gIn2{from{opacity:0;transform:translateY(30px) scale(.8)}to{opacity:1;transform:none}}
#stage.short .guide img{width:58px;height:76px} #stage.short .guide p{font-size:16px;padding:7px 12px;margin-bottom:12px}
.pop{position:absolute;z-index:7;left:50%;top:34%;transform:translate(-50%,-50%);pointer-events:none;font-family:var(--display);font-weight:800;font-size:34px;color:var(--gold);
  text-shadow:0 4px 0 var(--wall-face),0 0 18px rgba(0,0,0,.35);direction:ltr;white-space:nowrap;opacity:0}
.pop.go{animation:popUp 1.1s ease-out}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}

.overlay{position:absolute;inset:0;z-index:20;display:flex;background:rgba(18,14,40,.55);overflow-y:auto;
  padding-left:max(16px,var(--sa-l));padding-right:max(16px,var(--sa-r));padding-block:calc(14px + var(--sa-t)) calc(14px + var(--sa-b))}
.overlay.dim{background:rgba(18,14,40,.8)}
.overlay.clear{background:linear-gradient(90deg,rgba(18,14,40,.1),rgba(18,14,40,.55) 55%,rgba(18,14,40,.7))}
[dir=ltr] .overlay.clear{background:linear-gradient(270deg,rgba(18,14,40,.1),rgba(18,14,40,.55) 55%,rgba(18,14,40,.7))}
.card{width:100%;max-width:460px;margin:auto;background:rgba(42,36,82,.94);border-radius:28px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  box-shadow:0 0 0 3px var(--night-3),0 24px 60px rgba(0,0,0,.5);animation:cardIn .3s ease-out}
.card.wide{max-width:880px}
.card.bare{background:none;box-shadow:none;max-width:none;padding:0;animation:none}
@keyframes cardIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card h1{font-family:var(--display);font-weight:800;font-size:38px;line-height:1.1;margin:0;color:var(--gold);text-shadow:0 4px 0 var(--wall-face)}
.card h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;margin:0}
.card p{margin:0;color:var(--muted);line-height:1.5;font-size:16px;text-wrap:balance}
.big-btn{border:0;border-radius:20px;background:var(--gold);color:#3a2a00;font-family:var(--display);font-weight:800;font-size:24px;padding:11px 26px;min-width:190px;box-shadow:0 6px 0 #c48f12}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c48f12}
.big-btn.alt{background:var(--pink);color:#4a0f2a;box-shadow:0 6px 0 #c45a83}
.big-btn.alt:active{box-shadow:0 2px 0 #c45a83}
.big-btn.mint{background:var(--mint);color:#063d2a;box-shadow:0 6px 0 #2a9c74}
.big-btn.mint:active{box-shadow:0 2px 0 #2a9c74}
.big-btn:disabled{opacity:.45;transform:none}
.ghost-btn{border:0;background:var(--night-3);border-radius:16px;padding:11px 18px;font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--wall-face);text-decoration:none;color:var(--ink);display:inline-block}
.ghost-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wall-face)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tally{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;direction:ltr}
.tally span{background:var(--night);border-radius:16px;padding:7px 14px;font-weight:700;font-size:18px}
.bigstar{font-size:70px;line-height:1;animation:spin .7s ease-out;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
@keyframes spin{from{transform:scale(0) rotate(-200deg)}to{transform:scale(1) rotate(0)}}
.hero-btn{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:20px;background:rgba(42,36,82,.92);padding:4px 14px 4px 4px;box-shadow:0 0 0 3px var(--c,var(--gold)),0 5px 0 rgba(0,0,0,.3);font-family:var(--display);font-weight:800;font-size:18px}
.hero-btn img{width:46px;height:46px;border-radius:14px;object-fit:cover;object-position:top;background:var(--night-3)}
.rothint{display:flex;align-items:center;gap:10px;background:var(--gold);color:#3a2a00;border-radius:18px;padding:6px 16px 6px 12px;font-family:var(--display);font-weight:800;font-size:18px;box-shadow:0 4px 0 #c48f12}
.rothint i{font-style:normal;font-size:30px;line-height:1;display:inline-block;animation:rotphone 2.6s ease-in-out infinite}
@keyframes rotphone{0%,20%{transform:rotate(-90deg)}55%,85%{transform:rotate(-180deg)}100%{transform:rotate(-90deg)}}

/* title menu */
.menu{width:min(540px,100%);margin:auto 0;margin-inline-start:auto;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.menu .top{display:flex;align-items:center;gap:10px}
.menu .logo{font-size:56px;line-height:1;animation:wob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-6px)}}
.menu h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;margin:0;color:var(--gold);text-shadow:0 5px 0 var(--wall-face)}
.menu .sub{margin:0;font-weight:700;font-size:17px;color:var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.menu .mine{display:flex;gap:8px;direction:ltr;flex-wrap:wrap;justify-content:center}
.menu .mine span{background:rgba(28,24,56,.85);border-radius:999px;padding:5px 14px;font-weight:800;font-family:var(--display);font-size:18px}
.menu .row .big-btn{min-width:170px}
#stage.short .menu{gap:8px} #stage.short .menu .logo{font-size:46px} #stage.short .menu h1{font-size:36px}
#stage.short .big-btn{font-size:20px;padding:8px 20px;min-width:150px} #stage.short .ghost-btn{padding:8px 14px;font-size:16px}
#stage.short .card{gap:8px;padding:12px 16px} #stage.short .card h2{font-size:24px} #stage.short .bigstar{font-size:46px}
/* hero picker */
.heroes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;width:100%}
.hero{border:0;border-radius:20px;background:var(--night);padding:6px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 0 0 3px var(--night-3),0 5px 0 rgba(0,0,0,.3);transition:transform .15s}
.hero img{width:100%;aspect-ratio:3/4;object-fit:contain;object-position:bottom;display:block;border-radius:14px;background:radial-gradient(circle at 50% 70%,var(--c),transparent 70%)}
.hero b{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.15}
.hero.on{background:#4a3f8c;box-shadow:0 0 0 4px var(--gold),0 5px 0 rgba(0,0,0,.3);transform:translateY(-5px)}
.hero.on b{color:var(--gold)}
#stage.short .hero b{font-size:14px}
/* online */
.mp-cols{display:flex;gap:18px;width:100%;align-items:center;justify-content:center;flex-wrap:wrap}
.mp-col{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1 1 250px;min-width:0}
.mp-code{display:flex;gap:8px;direction:ltr;justify-content:center;align-items:center}
.mp-code b{width:54px;height:66px;border-radius:16px;background:var(--night);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--gold);box-shadow:inset 0 0 0 3px var(--night-3),0 4px 0 rgba(0,0,0,.3)}
.mp-code b.cur{box-shadow:inset 0 0 0 3px var(--gold),0 4px 0 rgba(0,0,0,.3)}
.mp-code .copy{width:54px;height:54px;border:0;border-radius:16px;background:var(--night-3);font-size:24px;box-shadow:0 4px 0 var(--wall-face);margin-inline-start:4px}
.mp-lbl{font-weight:700;color:var(--muted);font-size:15px}
.mp-msg{min-height:1.4em;font-weight:700;color:var(--pink)!important}
.keypad{display:grid;grid-template-columns:repeat(3,68px);gap:8px;direction:ltr;flex:none}
.keypad button{height:56px;border:0;border-radius:16px;background:var(--night-3);font-family:var(--display);font-weight:800;font-size:30px;line-height:1;box-shadow:0 4px 0 var(--wall-face)}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wall-face)}
.keypad .ok{background:var(--mint);color:#063d2a;box-shadow:0 4px 0 #2a9c74}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:360px}
.slot{background:var(--night);border-radius:18px;padding:7px;display:flex;align-items:center;gap:8px;box-shadow:inset 0 0 0 3px var(--c);min-height:66px;position:relative;text-align:start}
.slot img{width:52px;height:52px;border-radius:12px;flex:none;display:block;object-fit:cover;object-position:top;background:var(--night-3)}
.slot b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.15;color:var(--c);display:block}
.slot small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.slot .crown{position:absolute;top:-12px;inset-inline-end:-4px;font-size:22px}
.slot.empty{box-shadow:none;outline:3px dashed var(--night-3);outline-offset:-3px;justify-content:center;opacity:.7;font-size:26px}
.mpcd{position:absolute;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none;font-family:var(--display);font-weight:800;font-size:120px;line-height:1;color:var(--gold);text-shadow:0 7px 0 var(--wall-face),0 0 30px rgba(0,0,0,.35)}
.mpcd span{animation:pop2 .35s ease-out}
@keyframes pop2{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;direction:ltr;width:100%}
.pod{display:flex;flex-direction:column;align-items:center;gap:3px;width:116px;min-width:0}
.pod img{width:62px;height:62px;border-radius:16px;box-shadow:0 0 0 3px var(--c);display:block;object-fit:cover;object-position:top;background:var(--night-3)}
.pod b{font-family:var(--display);font-weight:800;font-size:17px;color:var(--c);line-height:1.2}
.pod span{font-weight:800;font-size:16px;direction:ltr}
.pod .blk{width:100%;border-radius:14px 14px 6px 6px;background:var(--c);display:grid;place-items:center;font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.pod.me img{box-shadow:0 0 0 4px #fff7e8,0 0 0 7px var(--c)}
.rest{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:ltr}
.spin{display:inline-block;animation:spinL 1.2s linear infinite}
@keyframes spinL{to{transform:rotate(360deg)}}
#stage.short .mp-code b{width:44px;height:52px;font-size:34px;border-radius:13px} #stage.short .keypad{grid-template-columns:repeat(3,62px);gap:6px} #stage.short .keypad button{height:46px;font-size:26px}
#stage.short .slot{min-height:54px;padding:5px} #stage.short .slot img{width:42px;height:42px} #stage.short .mpcd{font-size:90px} #stage.short .pod img{width:48px;height:48px} #stage.short .pod .blk{font-size:24px}

pMesh.frustumCulled = false; scene.add(pMesh);

}

function pushSeg(o, ax, az, bx, bz){

  else { if(dx === 0) o.lx += PR * (o.lx > 0 ? 1 : -1); else o.lz += PR * (o.lz > 0 ? 1 : -1); }

   Main loop
   ====================================================================== */
function tick(dt, withInput){
  T += dt;
  const frozen = mpFrozen();
  if(withInput && ME >= 0 && !frozen){ readInput(dt); stepPlayer(dt); }
  else if(ME >= 0){ P.vx = P.vz = 0; P.move = 0; const a = actors[ME]; a.m = 0; }
  if(frozen) return;
  if(GS.over) return;
  if(!MP.match || MP.isHost){ let rest = dt; while(rest > 0 && !GS.over){ const h = Math.min(rest, 1 / 30); hostStep(h); rest -= h; } }
  else { GS.t += dt; for(const e of GS.belt) e.s = Math.min(1, e.s + dt * BELT_V / ARC); }
}
let camOverride = null;
let last = performance.now(), fpsN = 0, fpsT = 0, fps = 60, slowT = 0, menuT = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now; if(dt > .05) dt = .05; if(dt <= 0) dt = .001;
  fpsN++; fpsT += dt;
  if(fpsT >= 1){
    fps = fpsN / fpsT; fpsN = 0; fpsT = 0;
    if(state === 'play' && fps < 42 && dpr > 1){ slowT++; if(slowT >= 2){ dpr = Math.max(1, dpr - .25); renderer.setPixelRatio(dpr); renderer.setSize(SW, SH, false); slowT = 0; } } else slowT = 0;
  }
  if(GS){
    const live = mpActive();
    if(state === 'play'){ tick(dt, true); updateCamera(dt); hudFrame(); updateActBtn(); }
    else if(live && GS && !GS.over){ tick(dt, false); }            // online games keep going behind menus
    else if(state === 'menu' || state === 'select' || (state === 'mp' && !MP.match)){
      if(mode === 'demo') tick(dt, false); else T += dt;
      menuT += dt; const a = menuT * .06;
      camera.position.set(Math.sin(a) * 34, 24, Math.cos(a) * 34); camera.lookAt(0, 0, 0);
    }
    if(camOverride){ camera.position.set(camOverride[0], camOverride[1], camOverride[2]); camera.lookAt(camOverride[3], camOverride[4], camOverride[5]); }
    beltMesh.rotation.y = -(BELT_V / BELT_R) * (GS ? GS.t : T);
    if(waterTex) waterTex.offset.set(T * .01, T * .006);
    animActors(dt); renderEggs(); animArrow();
  }
  mpFrame();
  updateParts(dt);
  sky.position.copy(camera.position);
  renderer.render(scene, camera);
}

  TIERS, BASES, NEST_L, PAD_COIN, PAD_LOCK, H,
  base:i => JSON.parse(JSON.stringify(GS.bases[i])), value:i => eggValue(GS.bases[i]), count:i => eggCount(GS.bases[i]),
  actor:i => { const a = actors[i]; return { kind:a.kind, hero:a.hero, x:a.x, z:a.z, rx:a.rx, rz:a.rz, on:a.on, st:a.bot && a.bot.st, visible:!!(a.h && a.h.grp.visible) }; },
  tp(x, z){ P.x = x; P.z = z; P.vx = P.vz = 0; collide(P, ME); const a = actors[ME]; a.x = a.rx = P.x; a.z = a.rz = P.z; snapCam = true; },
  tpLocal(i, lx, lz){ const B = BASES[i]; this.tp(wx(B, lx, lz), wz(B, lx, lz)); },
  tpEgg(){ const e = GS.belt.filter(e => e.s > .05 && e.s < .7).sort((a, b) => a.t - b.t)[0]; if(!e) return null; const [x, z] = beltEggPos(e); this.tp(x, z); return { id:e.id, t:e.t }; },
  inYard:(i, x, z) => inYard(i, x, z), yardOfMe:() => yardOf(P.x, P.z),
  moveBot(i, x, z){ const a = actors[i]; a.x = a.rx = x; a.z = a.rz = z; },
  moveBotLocal(i, j, lx, lz){ const B = BASES[j]; this.moveBot(i, wx(B, lx, lz), wz(B, lx, lz)); },
  walk(dirx, dirz, sec){ const l = Math.hypot(dirx, dirz) || 1; walkOverride = { x:dirx / l, z:dirz / l, t:sec }; },
  walkLocal(j, dlx, dlz, sec){ const B = BASES[j]; const dx = dlx * B.uz + dlz * B.ux, dz = -dlx * B.ux + dlz * B.uz; this.walk(dx, dz, sec); },
  sim(sec, withInput){ const n = Math.round(sec * 30); for(let k = 0; k < n; k++){ tick(1 / 30, !!withInput); } },
  stepActor(i, dx, dz, sec){ const a = actors[i], n = Math.round(sec * 30); for(let k = 0; k < n; k++){ a.x += dx * 4 / 30; a.z += dz * 4 / 30; collide(a, i); } a.rx = a.x; a.rz = a.z; return [a.x, a.z]; },
  set botsOn(v){ botsOn = !!v; }, get botsOn(){ return botsOn; },
  setCoins(n){ GS.bases[ME].coins = n; }, setTime(t){ GS.t = t; }, endRound:() => endRound(),
  intent:(i, k, d) => hostIntent(i, k, d || {}),
  start:dur => startSP(dur == null ? ROUND : dur), menu:() => showMenu(), select:f => showSelect(f || 'menu'), pause:() => showPause(), resume:() => resume(), upg:on => toggleUpg(on !== false),
  reset(){ SAVE = Object.assign(freshBaseData(), { tut:0, plays:0, best:0 }); persist(); }, tut:() => tutStep,
  info:() => renderer.info.render, camAt(...a){ camOverride = a.length ? a : null; },
  mp:{ get screen(){ return MP.screen; }, get code(){ return MP.code; }, get id(){ return MP.id; }, get isHost(){ return MP.isHost; }, get players(){ return MP.players.map(p => ({ id:p.id, hero:p.hero, c:p.c })); },
    get active(){ return mpActive(); }, get end(){ return MP.lastEnd; }, skipCountdown(){ if(MP.match) MP.match.cdEnd = performance.now(); },
    kinds:() => actors.map(a => a.kind), heroes:() => actors.map(a => a.hero) }
};

/* ---------- boot ---------- */
buildIsland();
resize();
showMenu();
requestAnimationFrame(frame);
/* links from the friends page: ?join=<room> joins that room, ?host=1&invite=<friendCode> creates a room and invites the friend */
(function(){
  const q = new URLSearchParams(location.search), join = q.get('join'), host = q.get('host') === '1', inv = q.get('invite'), room = q.get('room');
  if(!/^\d{4}$/.test(join || '') && !host) return;
  ['join', 'host', 'invite', 'room'].forEach(k => q.delete(k));
  try{ history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash); }catch(e){}
  if(/^\d{4}$/.test(join || '')) mpJoin(join, performance.now() + 20000);
  else { MP.inviteFor = /^[A-Z2-9]{6}$/.test(inv || '') ? inv : null; mpCreate(room); }
})();
</script>
